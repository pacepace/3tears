name: CI

on:
  pull_request:
    # `main` as well as `develop`, so a branch cut FROM main can satisfy main's
    # own required `check` context. The push-stamp below covers the normal
    # develop -> main release PR, whose head commit already carries a result --
    # but a hotfix branched off main never passes through develop, so nothing
    # ever stamps it and the PR blocks forever on a check that cannot run.
    # Found the first time a hotfix needed to reach main without shipping the
    # unreleased work sitting on develop.
    branches: [develop, main]
  # The merged develop head, not just the pre-merge PR ref. A PR check runs
  # against a throwaway merge ref whose SHA nobody keeps, so the commit that
  # actually lands on develop carries no status of its own. Stamping it here
  # is what lets the develop -> main release PR -- whose head IS that same
  # commit -- be gated on an already-computed result instead of re-running
  # the identical suite.
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 because the scope step below diffs against the PR base,
      # which a shallow clone does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A documentation-only PR runs no suite. The skip is decided HERE, inside
      # the job, rather than by a `paths-ignore:` on the trigger -- and that is
      # not a style preference.
      #
      # `check` is a REQUIRED status context on both develop and main. A
      # workflow that `paths-ignore` filters out never starts, so it never
      # reports that context, so the PR waits on a check that can never
      # arrive and blocks forever. That is strictly worse than running the
      # suite. It is also the same failure this file's trigger comments
      # already record twice, from the other direction.
      #
      # Keeping the job unconditional and skipping its STEPS keeps the
      # contract: `check` always reports, and a docs PR gets its green in
      # seconds instead of minutes.
      - name: Decide whether this change needs the suite
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Every push to develop runs the full suite whatever it touched.
            # The develop -> main release PR is gated on THIS commit's stored
            # result (see the push trigger's comment), so a stamp that skipped
            # the suite would hand main a green light nothing verified.
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "push to develop: running the full suite."
            exit 0
          fi
          changed=$(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD')
          echo "changed files:"
          echo "$changed"
          # Classified with shell `case` rather than a grep expression, on
          # purpose. `grep -qv` means "some line did not match", which is one
          # negation away from "no line matched" and reads the same at a
          # glance -- and the two differ exactly on the case that matters
          # here, a PR mixing docs with code. `case` states the doc shapes
          # positively and needs no negation to be read correctly.
          #
          # The default branch is `needed=true`: an unrecognised path is
          # treated as code, so a new kind of file is tested rather than
          # silently skipped. A changeset that is somehow empty also runs.
          needed=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md|docs/*|LICENSE|*/LICENSE) ;;
              *) needed=true; break ;;
            esac
          done <<CHANGED
          $changed
          CHANGED
          if [ -z "$changed" ]; then
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = "true" ]; then
            echo "-> code changed: running the full suite."
          else
            echo "-> documentation only: skipping lint, typecheck and tests."
          fi

      - uses: astral-sh/setup-uv@v8.2.0
        if: steps.scope.outputs.needed == 'true'
        with:
          version: "latest"

      - name: Set up Python
        if: steps.scope.outputs.needed == 'true'
        run: uv python install 3.14

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: uv sync --extra vision

      - name: Lint
        if: steps.scope.outputs.needed == 'true'
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Typecheck
        # single source of truth for the mypy target set (avoids CI/local drift).
        if: steps.scope.outputs.needed == 'true'
        run: ./scripts/typecheck.sh

      - name: Test (unit + enforcement; integration runs in its own job below)
        if: steps.scope.outputs.needed == 'true'
        run: uv run pytest packages/ tests/ -m "not integration" -v

  # The `integration` marker, which nothing ran until 2026-08-18.
  #
  # Why a separate job with SERVICE CONTAINERS rather than testcontainers: the
  # testcontainers route is ruled out here -- it exhausts a GitHub-hosted runner
  # -- so for a long time these tests ran only on a developer's machine who
  # remembered to. That left the whole durable surface outside the gate, and the
  # in-memory L3 fallback has no schema, so a missing DDL column passes every
  # unit test in the suite. That is exactly how the original `link_selector` bug
  # shipped past a green run.
  #
  # A service container is the same Postgres reached a different way. The
  # fixtures in `threetears.core.testing.fixtures` honour
  # THREETEARS_TEST_POSTGRES_URL / THREETEARS_TEST_NATS_URL and use whatever is
  # already running, so NO test assertion changes -- only where the connection
  # comes from. Unset, a developer's machine still gets testcontainers.
  #
  # Kept a separate job, not extra steps on `check`: `check` is main's required
  # status and gates the release PR, and these need services `check` does not.
  # Folding them in would make every docs-only PR wait on a database.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: the shared fixture is vector-capable for
        # every consumer regardless of collection order (see `db_image`).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Without a health gate the suite starts before Postgres accepts
        # connections and fails as though the code were broken.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      nats:
        # JetStream must be ON: the fixture cannot enable it on a server it did
        # not start, and the durable-circuit tests need it.
        image: nats:2.11-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Test (integration, against the service containers)
        env:
          THREETEARS_TEST_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/test
          THREETEARS_TEST_NATS_URL: nats://127.0.0.1:4222
        # Only the packages whose integration tests need Postgres or NATS. The
        # rest (S3/minio, SearXNG, a live Redshift) still start their own
        # containers or want credentials this job does not have, and would skip
        # noisily or hang; bringing them in is a follow-up with its own services.
        run: uv run pytest packages/core packages/nats packages/epoch packages/scheduled-jobs -m integration -v
