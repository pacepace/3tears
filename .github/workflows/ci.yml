name: CI

on:
  pull_request:
    # `main` as well as `develop`, so a branch cut FROM main can satisfy main's
    # own required `check` context. The push-stamp below covers the normal
    # develop -> main release PR, whose head commit already carries a result --
    # but a hotfix branched off main never passes through develop, so nothing
    # ever stamps it and the PR blocks forever on a check that cannot run.
    # Found the first time a hotfix needed to reach main without shipping the
    # unreleased work sitting on develop.
    branches: [develop, main]
  # The merged develop head, not just the pre-merge PR ref. A PR check runs
  # against a throwaway merge ref whose SHA nobody keeps, so the commit that
  # actually lands on develop carries no status of its own. Stamping it here
  # is what lets the develop -> main release PR -- whose head IS that same
  # commit -- be gated on an already-computed result instead of re-running
  # the identical suite.
  push:
    branches: [develop]

# A newer run of the same ref makes an older one meaningless, so it cancels it: two merges into develop
# seconds apart (2026-11-12) ran the whole suite twice, a fresh uncached unit run each on the testament
# pool, and only the newer head's result is ever read -- the release PR is gated on develop's head, which
# contains the older commit. A PR's second push does the same. The group is per event and ref, so runs of
# different refs never cancel each other, and a PR run never cancels develop's.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit + enforcement suite takes one of two routes:
  # - `unit-pool`, the testament pool (scripts/ci-unit-pool.sh run), when `route` chose it: the repo
  #   holds the TESTAMENT_KEY secret, the event is a push or a pull request from a branch of this
  #   repo, the repo variable TESTAMENT_CI is not "off", and the pool answered a probe.
  # - `unit`, the GitHub shards, otherwise, AND when `unit-pool` reports the pool lost during its run
  #   (outcome `unreachable`: never a test failure, which fails CI on the pool's verdict).
  # A job's `if:` cannot read a secret, so `route` turns everything it decided into outputs.
  # docs/testing.md, "CI on the testament pool".
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pool: ${{ steps.route.outputs.pool }}
      why: ${{ steps.route.outputs.why }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "latest"

      - name: Choose the unit route (the testament pool if it answers a probe, else the GitHub shards)
        id: route
        env:
          # the key only for a push or a pull request from a branch of this repo, whatever GitHub's
          # fork policy does; the script checks the event again
          TESTAMENT_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.TESTAMENT_KEY || '' }}
          TESTAMENT_COORDINATOR: ${{ vars.TESTAMENT_COORDINATOR }}
          # the console the client downloads from; the variable overrides it if the pool moves
          TESTAMENT_CONSOLE: ${{ vars.TESTAMENT_CONSOLE || 'https://testament.rodeo.illuminati.org/' }}
          # "off" sends CI to the shards on purpose, with the secret left in place
          TESTAMENT_CI: ${{ vars.TESTAMENT_CI }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: ./scripts/ci-unit-pool.sh route

  # The suite on the testament pool: .testament.toml's unit suite selects what ci-unit-tests.sh runs
  # (packages/ and tests/, -m "not integration and not loop_timing", less `docker` and `secrets`,
  # which the shards skip or leave out too); the loop_timing tests run serially on
  # this job's own runner after it. Its outcome is passed, failed or unreachable; the last runs the
  # shards below, whose verdict `check` then reads.
  unit-pool:
    name: unit (testament pool)
    needs: route
    if: needs.route.outputs.pool == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      outcome: ${{ steps.pool.outputs.outcome }}
      why: ${{ steps.pool.outputs.why }}
    steps:
      # fetch-depth 0: the scope step diffs against the PR base, and the client sends the worktree
      # as a commit whose objects it walks, with the release tags the manifest asks for.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this change needs the suite
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-scope.sh

      - uses: astral-sh/setup-uv@v8.2.0
        if: steps.scope.outputs.needed == 'true'
        with:
          version: "latest"

      - name: Test (unit + enforcement, on the testament pool)
        id: pool
        if: steps.scope.outputs.needed == 'true'
        env:
          TESTAMENT_KEY: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.TESTAMENT_KEY || '' }}
          TESTAMENT_COORDINATOR: ${{ vars.TESTAMENT_COORDINATOR }}
          TESTAMENT_CONSOLE: ${{ vars.TESTAMENT_CONSOLE || 'https://testament.rodeo.illuminati.org/' }}
          TESTAMENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          OUT: ${{ runner.temp }}/testament
        run: ./scripts/ci-unit-pool.sh run

      # The event loop's wall-clock tests, which the pool run leaves out (`-m "not loop_timing"`):
      # on a shared runner they run beside other batches and fail on the machine's load, not the
      # code (#1140). Here they run serially on this job's own runner, as the `rest` shard runs them,
      # after a pool verdict whether it passed or failed, so one failure does not hide the other.
      # Not after `unreachable`: the shards then run the whole suite, these tests included.
      - name: Set up Python (loop_timing, serial)
        if: "!cancelled() && steps.scope.outputs.needed == 'true' && steps.pool.outputs.outcome != 'unreachable'"
        run: uv python install 3.14

      - name: Install dependencies (loop_timing, serial)
        if: "!cancelled() && steps.scope.outputs.needed == 'true' && steps.pool.outputs.outcome != 'unreachable'"
        run: uv sync --extra vision

      - name: Test loop_timing (serial, on this runner)
        if: "!cancelled() && steps.scope.outputs.needed == 'true' && steps.pool.outputs.outcome != 'unreachable'"
        run: ./scripts/ci-unit-tests.sh --loop-timing -v

      # the envelope and JUnit report, for reading a run after the fact: never the verdict, so an
      # artifact-service outage does not fail the check (run 43094188951 lost ten minutes and the job to one)
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.needed == 'true'
        continue-on-error: true
        with:
          name: testament-unit
          path: ${{ runner.temp }}/testament
          if-no-files-found: ignore

  # The suite on GitHub's runners, as eleven shards running side by side: one session after another
  # took ~25 of `check`'s ~27 minutes, evals alone 12. The shards partition exactly what
  # `./scripts/ci-unit-tests.sh` runs with no selector (see its header), so every test still runs
  # once. `check` below waits for all of them and is the one status the branches require.
  # They run when `route` chose them, or when the pool was lost during `unit-pool`'s run; they
  # wait for `unit-pool` to know which (skipped when route chose the shards, so `!cancelled()`).
  unit:
    name: unit (${{ matrix.shard }})
    needs: [route, unit-pool]
    if: "!cancelled() && needs.route.result == 'success' && (needs.route.outputs.pool == 'false' || needs.unit-pool.outputs.outcome == 'unreachable')"
    runs-on: ubuntu-latest
    strategy:
      # every shard reports, so one failure does not hide another's
      fail-fast: false
      matrix:
        shard: [evals-1, evals-2, evals-3, evals-4, evals-5, evals-6, evals-7, evals-8, core, tests, rest]
    steps:
      # fetch-depth 0: the scope step diffs against the PR base, and the API-growth gate in
      # tests/enforcement compares against the latest vX.Y.Z tag; a shallow clone has neither.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the same classifier `check` runs (scripts/ci-scope.sh), so a doc-only PR skips the shards too
      - name: Decide whether this change needs the suite
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-scope.sh

      - uses: astral-sh/setup-uv@v8.2.0
        if: steps.scope.outputs.needed == 'true'
        with:
          version: "latest"

      - name: Set up Python
        if: steps.scope.outputs.needed == 'true'
        run: uv python install 3.14

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: uv sync --extra vision

      # The evals render tests (the `browser` marker) run in these shards as they do on the pool:
      # headless Chromium, installed by the locked playwright, its download cached by that version.
      # Only the evals shards hold them. THREETEARS_REQUIRE_CHROMIUM below makes a failed install
      # fail them rather than skip them.
      - name: Read the locked playwright version (browser tests)
        id: playwright
        if: steps.scope.outputs.needed == 'true' && startsWith(matrix.shard, 'evals-')
        # assigned first, so a failed read fails the step instead of caching under an empty version
        run: |
          version="$(uv run python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: steps.scope.outputs.needed == 'true' && startsWith(matrix.shard, 'evals-')
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install headless Chromium and its system libraries (browser tests)
        if: steps.scope.outputs.needed == 'true' && startsWith(matrix.shard, 'evals-')
        # DejaVu as the pool's image has it: the package's pages set a local font stack, so they draw in the
        # machine's faces, and the dev box's and the pool's are DejaVu (docker/testament.Dockerfile says why)
        run: |
          uv run playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig

      # the faces the package's pages draw in (a local font stack, so the machine's): DejaVu, as on the dev box and
      # the pool, or the render checks measure another face and fail or pass for the wrong reason
      - name: Check the fallback fonts are DejaVu (browser tests)
        if: steps.scope.outputs.needed == 'true' && startsWith(matrix.shard, 'evals-')
        run: ./scripts/check-fallback-fonts.sh

      - name: Test (unit + enforcement; integration runs in its own job below)
        if: steps.scope.outputs.needed == 'true'
        env:
          THREETEARS_REQUIRE_CHROMIUM: ${{ startsWith(matrix.shard, 'evals-') && '1' || '' }}
        # four workers, one package per worker, as ./scripts/test.sh runs it locally -- split into
        # several sessions so no worker outgrows the runner's memory (see the script's header)
        run: ./scripts/ci-unit-tests.sh --shard ${{ matrix.shard }} -v

  check:
    # the required status: it reports whatever the unit route did, so it never waits on a check
    # that cannot arrive, and it is red unless the route that ran to a verdict passed.
    needs: [route, unit, unit-pool]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The verdict comes from the route that ran to one: the pool's, or the shards' when route
      # chose them or the pool was lost during its run (unit-pool's outcome `unreachable`). The job
      # that ran runs its suite or, for a doc-only PR, skips its steps and still succeeds, so
      # anything but success (failure, cancelled, or skipped because the run broke before it
      # started) means the suite did not pass. A `route` that never decided fails here too.
      # tests/enforcement/test_ci_unit_shards.py runs this step against every combination.
      - name: The unit suite passed
        env:
          ROUTE: ${{ needs.route.outputs.pool }}
          ROUTE_WHY: ${{ needs.route.outputs.why }}
          UNIT_RESULT: ${{ needs.unit.result }}
          POOL_RESULT: ${{ needs.unit-pool.result }}
          POOL_OUTCOME: ${{ needs.unit-pool.outputs.outcome }}
          POOL_WHY: ${{ needs.unit-pool.outputs.why }}
        run: |
          level=notice
          case "$ROUTE" in
            true)
              if [ "$POOL_OUTCOME" = unreachable ]; then
                ran="the unit shards"; result="$UNIT_RESULT"; level=warning
                why="pool unreachable during the run (${POOL_WHY}): ran the shards"
              else
                ran="unit (testament pool)"; result="$POOL_RESULT"; why="$ROUTE_WHY"
              fi ;;
            false) ran="the unit shards"; result="$UNIT_RESULT"; why="$ROUTE_WHY" ;;
            *) echo "::error::the route job chose no unit route ('$ROUTE')"; exit 1 ;;
          esac
          echo "::${level} title=unit route::${ran}: ${why//%/%25}"
          printf '### unit route: %s\n\n%s\n' "$ran" "$why" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$result" != "success" ]; then
            echo "::error::$ran finished '$result'; see the failing unit (...) job."
            exit 1
          fi
          echo "$ran passed."

      # fetch-depth 0 because the scope step below diffs against the PR base,
      # which a shallow clone does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CLAUDE.md: "No agent attribution. Anywhere. Ever." Coding agents end every commit with a
      # Co-Authored-By trailer by default, so the rule is broken by omission, not by choice, and
      # prose alone did not hold it. Every commit the PR adds is read; a commit already on the base
      # is never examined (landed history stays landed), and the commits that landed with a trailer
      # before this step existed are exempt by hash in scripts/attribution-exemptions.txt. Runs for
      # a documentation-only PR too: its commits carry trailers as readily as any other.
      # tests/enforcement/test_no_agent_attribution.py fails if this step goes away.
      - name: Refuse agent attribution in the PR's commits
        if: github.event_name == 'pull_request'
        run: ./scripts/check-attribution.sh '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'

      # A documentation-only PR runs no lint, typecheck or suite. Why the skip lives in the jobs
      # rather than in a `paths-ignore:` on the trigger, and how a change is classified, is in
      # scripts/ci-scope.sh -- one classifier, shared with the unit shards above.
      - name: Decide whether this change needs the suite
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/ci-scope.sh

      - uses: astral-sh/setup-uv@v8.2.0
        if: steps.scope.outputs.needed == 'true'
        with:
          version: "latest"

      - name: Set up Python
        if: steps.scope.outputs.needed == 'true'
        run: uv python install 3.14

      - name: Install dependencies
        if: steps.scope.outputs.needed == 'true'
        run: uv sync --extra vision

      - name: Lint
        if: steps.scope.outputs.needed == 'true'
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Typecheck
        # single source of truth for the mypy target set (avoids CI/local drift).
        if: steps.scope.outputs.needed == 'true'
        run: ./scripts/typecheck.sh

      # The unit shards only ever see the OpenTelemetry uv.lock pins, which is always recent, so a
      # declared floor can fall behind the code with everything green. It did: observe imported a
      # name first shipped in opentelemetry-sdk 1.39 while declaring >=1.28, and a consumer pinned
      # to 1.36 failed at import. This runs the OpenTelemetry tests at exactly the declared floor.
      # tests/enforcement/test_otel_floor.py fails if this step goes away.
      - name: Test observe at its declared OpenTelemetry floor
        if: steps.scope.outputs.needed == 'true'
        run: ./scripts/test-otel-floor.sh -v

      # 3tears 0.75 runs on mcp 1.x as well as the locked 2.x, so consumers can move on their own
      # schedule; the step above only ever sees 2.x. Goes away when 3tears drops mcp 1.x, which the owner decides; no release is set.
      - name: Test the MCP packages on mcp 1.x
        if: steps.scope.outputs.needed == 'true'
        run: ./scripts/test-mcp-v1.sh -q

  # The `integration` marker, which nothing ran until 2026-08-18.
  #
  # Why a separate job with SERVICE CONTAINERS rather than testcontainers: the
  # testcontainers route is ruled out here -- it exhausts a GitHub-hosted runner
  # -- so for a long time these tests ran only on a developer's machine who
  # remembered to. That left the whole durable surface outside the gate, and the
  # in-memory L3 fallback has no schema, so a missing DDL column passes every
  # unit test in the suite. That is exactly how the original `link_selector` bug
  # shipped past a green run.
  #
  # A service container is the same Postgres reached a different way. The
  # fixtures in `threetears.core.testing.fixtures` honour
  # THREETEARS_TEST_POSTGRES_URL / THREETEARS_TEST_NATS_URL and use whatever is
  # already running, so NO test assertion changes -- only where the connection
  # comes from. Unset, a developer's machine still gets testcontainers.
  #
  # Kept a separate job, not extra steps on `check`: `check` is main's required
  # status and gates the release PR, and these need services `check` does not.
  # Folding them in would make every docs-only PR wait on a database.
  integration:
    runs-on: ubuntu-latest
    services:
      # Postgres only. NATS needs a command argument and is started in a step below.
      postgres:
        # pgvector, not plain postgres: the shared fixture is vector-capable for
        # every consumer regardless of collection order (see `db_image`).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Without a health gate the suite starts before Postgres accepts
        # connections and fails as though the code were broken.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # NATS is started here rather than as a `services:` entry, and the reason is a
      # real limitation rather than a preference: a service container takes `image`,
      # `env`, `ports` and `options`, but NO command -- and `nats:` needs `-js` as a
      # command argument to enable JetStream. Declared as a service it comes up
      # without JetStream and every durable test fails with `ServiceUnavailableError`,
      # which is exactly how this job failed the first time it ran.
      #
      # This is not the testcontainers pattern that is ruled out here. It is one
      # explicit container, started once, with no orchestration layer.
      - name: Start NATS with JetStream
        run: |
          docker run -d --name ci-nats -p 4222:4222 -p 8222:8222 \
            nats:2.11-alpine -js -m 8222
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              echo "nats is up with JetStream"; exit 0
            fi
            sleep 1
          done
          echo "nats did not become healthy"; docker logs ci-nats; exit 1

      - name: Test (integration, against the service containers)
        env:
          THREETEARS_TEST_POSTGRES_URL: postgresql://test:test@127.0.0.1:5432/test
          THREETEARS_TEST_NATS_URL: nats://127.0.0.1:4222
        # Only the packages whose integration tests need Postgres or NATS. The
        # rest (S3/minio, SearXNG, a live Redshift) still start their own
        # containers or want credentials this job does not have, and would skip
        # noisily or hang; bringing them in is a follow-up with its own services.
        # agent/acl needs Postgres alone: its NATS is an in-memory double. It is here
        # because its integration tests measure, against a real table, the teardown
        # queries (`list_owned_by`, `schema_in_use`) a consumer drops schemas on.
        run: uv run pytest packages/core packages/nats packages/epoch packages/scheduled-jobs packages/agent/acl -m integration -v
