# Keeps the workflows' action pins current. Every `uses:` is pinned to a full commit SHA with the
# release tag in a trailing comment, so a moved or hijacked tag cannot change what a job runs;
# Dependabot rewrites the SHA and the comment together when a new release appears.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    # A release must be two weeks old before it is proposed: a compromised release is usually
    # caught and pulled within days, and this keeps it from reaching a pin in the meantime.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
