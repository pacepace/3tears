[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-observe"
version = "0.57.0"
description = "Structured logging, tracing, and OpenTelemetry setup for 3tears applications"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The floor is what `_otel_internals` imports, not what shipped last: opentelemetry-sdk 1.39.0 is
# the first release with `opentelemetry.sdk._logs.export.LogRecordExporter`. api, sdk and the
# exporter release in lockstep (each sdk pins its api exactly, each exporter its sdk minor), so
# all three move together. scripts/test-otel-floor.sh runs the OpenTelemetry tests at exactly
# these floors, and CI runs it, so a floor that falls behind the code goes red here.
otel = [
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp>=1.39",
]
asgi = [
    "uuid-utils",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]
