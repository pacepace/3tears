[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-observe"
version = "0.64.0"
description = "Structured logging, tracing, and OpenTelemetry setup for 3tears applications"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The floor is what `_otel_internals` imports, not what shipped last. Its log handler is
# opentelemetry-instrumentation-logging's (the SDK's own `LoggingHandler` is deprecated in its
# favour), which first shipped in 0.61b0; that release pins opentelemetry-api 1.40.0 through
# its semantic-conventions, so api, sdk and the exporter cannot sit below 1.40 beside it.
# (opentelemetry-sdk 1.39.0 was the floor before: the first with
# `opentelemetry.sdk._logs.export.LogRecordExporter`.) api, sdk and the exporter release in
# lockstep (each sdk pins its api exactly, each exporter its sdk minor), and each contrib
# 0.(N+21)b0 ships with core 1.N, so all four move together. Every one is capped below its
# next major: a major may drop the private logs modules `_otel_internals` imports, and no
# consumer should resolve one before this code is tested against it.
# scripts/test-otel-floor.sh runs the OpenTelemetry tests at exactly these floors, and CI runs
# it, so a floor that falls behind the code goes red here.
otel = [
    "opentelemetry-api>=1.40,<2",
    "opentelemetry-sdk>=1.40,<2",
    "opentelemetry-exporter-otlp>=1.40,<2",
    "opentelemetry-instrumentation-logging>=0.61b0,<1",
    # `is_instrumentation_enabled`, which the export filter reads; instrumentation-logging pins this
    # same release, so it moves with it
    "opentelemetry-instrumentation>=0.61b0,<1",
]
asgi = [
    "uuid-utils",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]
