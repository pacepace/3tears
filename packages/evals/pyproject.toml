[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-evals"
version = "0.95.0"
description = "Evaluate LLM-backed products: campaigns over levers, judged and code-graded trials, cost and latency accounting, and analysis reports"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # The completion client (`threetears.evals.providers`) speaks each provider's HTTP API directly: no SDK, no
    # LangChain. The floor is the first release whose `AsyncClient` and `MockTransport` behave as the client and its
    # tests use them.
    "httpx>=0.27",
    "pydantic>=2.0",
    # The SQLite store's statements are the family's shared keyed builders (`threetears.interfaces.keyed`): the one
    # 3tears package evals depends on, and it depends on nothing (owner ruling 2026-11-11).
    "3tears-interfaces>=0.95.0,<0.96.0",
]

[project.optional-dependencies]
# The FastMCP transport (`threetears.evals.transports.fastmcp`): mounts the action catalogue as tools
# on a FastMCP server. Optional, so the engine and its catalogue install without an MCP stack. The suite
# runs against the locked release, and scripts/test-mcp-floor.sh runs the transport's tests at the floor
# declared here (with mcp at its own floor), so the floor cannot fall behind the code unnoticed. fastmcp 4
# is the first major on mcp 2.x; fastmcp 3 needs mcp 1, which 3tears no longer supports. The cap is the
# newest major this is tested against. fastmcp-slim is named too: the `fastmcp` module ships in it, and
# fastmcp is its wrapper
fastmcp = ["fastmcp>=4.0,<5", "fastmcp-slim>=4.0,<5"]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.uv.sources]
3tears-interfaces = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

# MIGRATIONS.toml stays at the package root for the repo and ships inside the installed package
[tool.hatch.build.targets.wheel.force-include]
"MIGRATIONS.toml" = "threetears/evals/MIGRATIONS.toml"
