[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-evals"
version = "0.66.0"
description = "Evaluate LLM-backed products: campaigns over levers, judged and code-graded trials, cost and latency accounting, and analysis reports"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "3tears-observe>=0.66.0,<0.67.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The Vega-Lite chart renderer, `threetears.evals.vega`: its rasteriser draws a report's charts to
# PNG and SVG. The core ships no charting library and never imports the renderer, so a host that
# brings its own renderer installs without this. Pinned exactly: the renderer's tests compare
# rendered output, and a vl-convert release bundles a different Vega-Lite.
vega = [
    "vl-convert-python==1.9.0.post1",
]

# The FastMCP transport (`threetears.evals.transports.fastmcp`): mounts the action catalogue as tools
# on a FastMCP server. Optional, so the engine and its catalogue install without an MCP stack. The suite
# runs against the locked release; the floor is the first release an adopting host is known to run, and is
# tested by running the transport's tests against it rather than assumed:
#   uv run --with "fastmcp==3.4.2" pytest packages/evals/tests/test_fastmcp_transport.py
# Re-run that when the transport starts using a fastmcp API it did not, and raise the floor if it fails.
# The cap is the major this is tested against.
fastmcp = ["fastmcp>=3.4.2,<4"]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.uv.sources]
3tears-observe = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]
