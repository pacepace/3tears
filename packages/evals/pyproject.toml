[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-evals"
version = "0.70.0"
description = "Evaluate LLM-backed products: campaigns over levers, judged and code-graded trials, cost and latency accounting, and analysis reports"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # The completion client (`threetears.evals.providers`) speaks each provider's HTTP API directly: no SDK, no
    # LangChain, no other 3tears package. The floor is the first release whose `AsyncClient` and `MockTransport`
    # behave as the client and its tests use them.
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The FastMCP transport (`threetears.evals.transports.fastmcp`): mounts the action catalogue as tools
# on a FastMCP server. Optional, so the engine and its catalogue install without an MCP stack. The suite
# runs against the locked release; the floor is the first release an adopting host is known to run. Nothing
# gates it: it was checked manually (passed on 2026-10-06) by running the transport's tests against it:
#   uv run --with "fastmcp==3.4.2" pytest packages/evals/tests/test_fastmcp_transport.py
# Re-run that when the transport starts using a fastmcp API it did not, and raise the floor if it fails.
# The cap is the major this is tested against.
fastmcp = ["fastmcp>=3.4.2,<4"]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]
