# Every name that left a public root of 3tears-evals, per release: its new home or "removed", and why.
#
# A public root is a module in threetears.evals.PUBLIC_ROOTS, and its public names are its __all__. When a name
# that shipped in a final release leaves one (moved to another root, renamed, or removed) it is recorded here, and
# a porter reads the release notes, which are printed from this file:
#
#     uv run python packages/evals/scripts/release_notes.py v<version>
#
# Every public name has a stability tier, recorded in api/surface.json and declared in one place, HOST_CONTRACT and
# STABLE in scripts/public_surface.py. The promise starts at 0.70.0, the first tagged release:
#   host-contract  a name a host writes against. It moves only with a record here AND a deprecation cycle: the
#                  release that moves it exports the new name beside the old one, which keeps working for that minor
#                  release and is named in that section's `notes`; the next minor release drops the old name, and its
#                  section records the removal in a [[release.change]] as any move is recorded.
#   stable         the rest of the declared surface (docs/surface.md). Any release may move it, recorded here, and
#                  there is no compatibility shim.
#   provisional    every other name a root exports, most because a declared signature reaches it. Promised nothing:
#                  docs/reference.md does not list it and api/surface.json records no signature for it. A move is
#                  still recorded here once a release has shipped it, since it left a root.
#
# tests/test_api_surface.py fails while a name is missing from the checked-in snapshot (api/surface.json) without
# being recorded in the FIRST section below, and scripts/generate_api_snapshot.py refuses to write a snapshot that
# drops one. A name that no final release exported is not recorded: it never shipped, so it can leave with only a
# regeneration of the snapshot. Sections run newest first; the first is the release being prepared. Older sections
# are history and are not checked against today's surface.
#
# Only final releases (tags v<x>.<y>.<z>) count. A pre-release tag, with any suffix, is never followed and never
# measured from, and has no section here. 0.70.0 is the package's first release: v0.69.0, the release before it,
# had no 3tears-evals, so nothing can have left a root before 0.70.0 and its section records no names. (The
# pre-release tags up to v0.66.0-evaladopt.23 were cut while evals was planned for 0.66.0, those up to
# v0.67.0-evaladopt.25 while it was planned for 0.67.0, the v0.68.0-evaladopt.N tags while it was planned for
# 0.68.0, and the v0.69.0-evaladopt.N tags while it was planned for 0.69.0; each of those releases shipped without
# it.)
#
# Before tagging a release, rename the first section from "unreleased" to its version; after the tag, the next
# release's work goes in a new "unreleased" section since that tag. tests/test_api_surface.py fails once the tree
# follows a tag with no section of its own, or while the unreleased section starts at an older tag. The tree follows
# the newest final release tag at or below its pyproject version, on any ref (a release is tagged on main, which
# develop never merges back). A release from before the package existed needs no section.
#
# Each [[release.change]] is one move for one reason:
#   from     the root the names left, in full
#   to       the root that exports them now, in full, or "removed"
#   names    names that keep their name in `to`
#   renamed  { old = "new" } for names renamed on the way
#   why      what a porter needs to understand the change
# A section's `notes` carry breaking changes that are not a public name: a field, a submodule, a version.
# They MUST also carry a change to the wording of a built-in judge prompt, or of the reply-format suffix a configured
# judge is sent, though no version moves: a judge's recorded identity is a fingerprint of that wording, so results
# judged before the release are another judge for agreement, profiles, drift and evidence tiers, and a scope's
# `calibrated` tier reads `undetermined` until it is calibrated again. That note carries JUDGE_WORDING_CHANGE_SENTENCE
# (threetears.evals.schema.models) verbatim and says which wording moved; tests/test_judge_identity_pins.py pins every
# fingerprint and fails while one moved since the section's `since` tag and no note carries the sentence.
# A section's `since` names the tag of the final release before it. The test then reads both surfaces from git and
# holds the section to exactly the names that left a root between that tag and this version's (or the working tree,
# before this version is tagged).
# A signature change alone needs no record here (the snapshot diff is its record); put it in `notes` when it breaks
# callers.

