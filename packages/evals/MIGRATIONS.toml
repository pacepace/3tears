[[release]]
version = "0.70.0"
since = "v0.69.0"
summary = """
The first release of 3tears-evals. No earlier release shipped the package, so no public name has moved or been
removed: every name on the surface is new, and api/surface.json is the baseline later releases are measured from.
"""
notes = [
    "The public API has three stability tiers (this file's header): a `host-contract` name moves only with a deprecation cycle, from this release on; a `stable` name may move in any release, recorded; and a `provisional` name is exported but promised nothing. Every name that leaves a public root from here on is recorded in this file and printed in that release's notes, with its new home or `removed`.",
    "Since `.27` (`evals/27-surface`), the declared surface (`host-contract` and `stable`) is 450 names, down from all 1,489 the roots export; the other 1,039 are `provisional`, still exported from the same roots and still importable, so no import breaks and nothing is recorded as moved. `docs/surface.md` maps the declared names by rung and `docs/reference.md` lists only them. What left the declared surface, by group: in `analysis`, the analysis bundle's section shapes (`RealizedDesign`, `TrialRow`, `JudgedMeasure`, the frontier, pivot, history and export lens results, the coverage, confound and divergence readings) and the report's block types (`TableBlock`, `TextBlock`, `OutcomeBar`, ...); in `kernel`, the campaign and analysis documents' inner shapes, the statistics helpers (`agreement_statistic`, `percentile`, `materiality`), the guardrail, bar and evidence-tier readings, the metric catalogue's field vocabularies, the cassette seams and the job-lease machinery; in `kernel.host`, the registration errors, the obligation and qualification rows, the readers a profile composes and the style vocabulary; in `schema`, the stored documents' nested records (judge repeats, rescores and second judgings, world events, leases, completeness, case sets, version spaces) and the open field aliases; in `run`, the job manager and its work functions, the CRUD helpers over templates, rubric dimensions and judge configs, the launch quote and pricing internals and the judge-request plumbing; in `ops`, every operation the action catalogue already exposes by name (`results_list`, `judge_repeat`, `analysis_generate`, ...) with its result and listing models and its text renderers, and the job-id helpers; in `actions`, the catalogue's tool-spec and permission vocabulary; in `transports.fastmcp`, the hook and binding types; in `testing`, the reader and jobs kits' cases and failures; in `gen`, the proposer's default templates and draft shapes; in `negotiation`, `BUDGET_SHARES` and `EFFORT_LADDER`; in `storage`, `AsyncStoreBridge` and `SQLITE_STORE_LAYOUT`. No release shipped any of them, so each is a note here rather than a `[[release.change]]`; a host binding to one asks for it to be promoted (`STABLE` in `scripts/public_surface.py`).",
    "The `v0.66.0-evaladopt.N` tags (through `.23`) and the `v0.67.0-evaladopt.N`, `v0.68.0-evaladopt.N` and `v0.69.0-evaladopt.N` tags after them (the last is `v0.69.0-evaladopt.33`) are pre-releases of this first release, never published to PyPI, and nothing here is measured from them. A host that ran one imports each name from the root `docs/reference.md` lists it under; each pre-release tag's own `MIGRATIONS.toml` and `CHANGELOG.md` still describe the moves between them.",
    "A store written before `.25` (`v0.67.0-evaladopt.25`; core below v15) is not read. Core schema v15 is the baseline, which `.25` wrote first (`CORE_BASELINE_VERSION` and `CORE_SCHEMA_VERSION` are 15, `CORE_SCHEMA_MINOR` is 0 and `CORE_UPGRADERS` is empty): a core document at v8 to v14 is refused by name as pre-release, with no upgrader, and a regenerable document, bundle or cell at an older version is refused or re-assembled at this release's (the version spaces are listed below). Delete every eval document a build before `.25` wrote before deploying this release (`nuke_all_eval_data(scopes, include_durable=True)`, for that pre-release store only); a store `.25` wrote is read as it stands.",
    "A cassette has a version space of its own: `EvalCassette.schema_version` is `CASSETTE_SCHEMA_VERSION` (1, exported from `threetears.evals.schema`), no longer `REGENERABLE_SCHEMA_VERSION`. A cassette a pre-release before `v0.66.0-evaladopt.22` wrote (at the regenerable version of its day, v9 or older) is refused by name and its corpus re-captured; one `.22` to `.24` wrote is already at cassette v1, whose format has not moved since. A regenerable bump no longer refuses any cassette; only a change to the cassette's own format bumps its version.",
    "Since `v0.66.0-evaladopt.20`, fields every writer sets are required: on `EvalRun`, `judge_temperature` exactly when `judge_model` is, `goal_check_proof_rules` exactly when `goal_check_proofs` is, and `cell_concurrency` (default 1); on `RubricScore`, `axis`; on `EvalAnalysis`'s provenance, `bundle_schema_version` and `host_declarations_digest`; on `EvalInsight`, `invalidation_trigger`; on `BarVerdict`, an interval beside any decision. A recorded judge identity is a `builtin:<sha12>` id or `<config id>@<sha12>`; a bare config id is refused. `__retired_fields__` and the stored-read context are gone, `GuardrailReadings.unstamped_dimensions` and `BarVerdict.decided_on_the_mean` are removed, `BundleInspection.mismatch_cause` loses `cannot_say`, and a cell id now digests every apparatus dimension (`judge_temperature` included).",
    "`CampaignDesign` carries `control_levers` and `control_identity_version` beside `control`, server-owned. Addressing the control from a run (`control_from_run_id`, `set_campaign_control`) records them; a typed control has no lever map and is dated with the accepting build's `IDENTITY_VERSION`; an update that keeps a typed key unchanged keeps the stored pair; and `campaign_create` and `campaign_update` refuse either field sent with a value the server would not store. A lever map or version without a control is refused, as is a map that does not digest to the key under this build's predicate.",
    "Naming a control from a run now always resolves that run's lever map, so a run whose host assembled it without the launch (no recorded `variant_levers`) is refused with `LeverCoordinateError` when its host's variant map disagrees with its own registry, even when the run has results. It used to be designated from its results' key alone; assembling a bundle over such a run already refused.",
    "A campaign's control is read through `resolve_declared_control`, as the keys it matches: the stored key, which cells stamped under its own `IDENTITY_VERSION` keep, and under a later version also the key `control_levers` re-keys to, so it is never stale while its old cells are there. `RealizedDesign.control_arm` is ONE arm, the cells under the first key any cell carries, the re-keyed one first; every reading that names the control reads it: the decision surface's `control_variant_key` (None when no cell carries the control), the surface's row order, the time axis, the adoption check and a stored analysis's arm table. Where cells carry both keys, the stored key's cells are `RealizedDesign.earlier_control` (`EarlierControl`, also on `DecisionSurface.earlier_control`): labelled the control under that identity predicate, disclosed, in no contrast, guardrail or adoption check and no contestant on the frontier (`FrontierPoint.earlier_control` marks its point, which is in no dominance test, never the pick and never a cost tie), and not in the control's numbers, while a marginal row, read over every run, counts them at the control's level; a time position holding them says so (`TimePosition.control_disclosure`). `compute_frontier` and `arm_table_of` take the earlier control (`earlier_control`). The bundle's shape moved twice for it before the `.25` bump below: to 51 for the added fields, and to 52 because the earlier control's disclosure says what a marginal row counts. The bundle's `declared_design` carries the control as declared. `ResolvedControl` and `ControlSource` are its public shapes. Re-keying follows a change to how a lever map is digested only, not a renamed lever, kind or overlay field. When no cell carries a typed key from another version, the control reads as `stale`: `RealizedDesign.control_excluded` gains `stale`, and `RealizedDesign.stale_control_disclosure` says why and names the remedy.",
    "Since `v0.66.0-evaladopt.21`, every core document carries `schema_minor` (0 in this release) beside `schema_version`, which is now the core major: a read accepts any newer minor of its own major, keeps every field it does not declare and writes it back, and constructing or validating a core document at a newer minor is refused (`CoreSchemaMinor`).",
    "That tolerance has a floor, `v0.67.0-evaladopt.25`, which wrote the v15 baseline: every build before it reads and writes core v14 or older, so it refuses every core document `.25` or this release writes; roll back no further than `.25` (the `.25` baseline note below).",
    "`schema_minor` is a server field on every authoring surface (`TEMPLATE_SERVER_FIELDS`, `RUBRIC_DIM_SERVER_FIELDS`, `JUDGE_CONFIG_SERVER_FIELDS`, `CAMPAIGN_SERVER_FIELDS`), ignored if sent.",
    "`UsageRole`, `SimulatorPurpose`, `CostCapOrigin`, `MeteredCallOrigin`, `CellTimeoutOrigin`, `ModelRoleOrigin`, `RoleModelOrigin`, `ReasoningEffort`, `OutOfRunPurpose` and `RefusalKind` are `str` rather than a `Literal`, so `get_args` on one returns nothing: read the values this build knows from `USAGE_ROLES`, `SIMULATOR_PURPOSES`, `COST_CAP_ORIGINS`, `METERED_CALL_ORIGINS`, `CELL_TIMEOUT_ORIGINS`, `MODEL_ROLE_ORIGINS`, `ROLE_MODEL_ORIGINS`, `REASONING_EFFORTS`, `OUT_OF_RUN_PURPOSES` and `REFUSAL_KINDS`; a stored value outside one is refused except on a newer minor's read. Each also has a `Literal` of the values this build knows (`KnownUsageRole`, `KnownCostCapOrigin`, …, `KnownOutOfRunPurpose`, `KnownRefusalKind`), which every caller-facing parameter and every writer takes, so a misspelt `scope_out_of_run_spend` `purpose_filter` is refused by name as before; only a stored field is open.",
    "A role spend line (`RoleSpend`) can name a usage role this build does not know (`RoleSpend.known` is False), listed after the known roles.",
    "`CoreDocumentModel.from_json` is strict, as any payload is (a newer minor, an unknown field and an older major are refused; a stored document is read with `from_dict`), and `CoreDocumentModel.to_json` refuses, by name, a document holding fields a newer minor wrote rather than drop them (write it with `to_dict`).",
    "The release policy now covers judge wording. A recorded judge identity is a fingerprint of the wording the judge was sent (`builtin:<sha12>` for a built-in prompt, `<config id>@<sha12>` for a configured judge and the reply-format suffix), so a later release that rewords either says so in these notes with `JUDGE_WORDING_CHANGE_SENTENCE` (in `threetears.evals.schema`): results judged before it are another judge for agreement, judge profiles, drift and evidence tiers. A run's own `judge_config_ids` holds bare config ids and no built-in dim, so such a change leaves a run's context key alone.",
    "Since `v0.66.0-evaladopt.22`, `threetears.evals.quick` no longer exports `CALLABLE_UNSEATED`, `JUDGED_CALLABLE_UNSEATED`, `JUDGED_CALLABLE_KIND_CONTRACT` or `SHARED_ARM_MODEL`, which no public signature reaches: a host declaring the judged callable kind takes its contract from `callable_kind_contracts()` (the second it returns, which seats the judge and nothing else), and a single-factor `compare`'s shared model is any arm's `EvalSummary.candidate_model`.",
    "`threetears.evals.testing` gains `RecordedCompletions` (host-contract), a completion client that records the calls a host's real client answers into a JSONL file (`record`) and replays them by prompt, model, temperature, request settings and call index with no network (`replay`). `record`, `replay` and `check_covers` each take a required `settings=` keyword, the `ClientRequestSettings` the client is built with or `None` for one built with none, because those settings never reach `generate`: every line carries them, every key covers them, and a replay asked under settings a prompt was not recorded with raises `RecordingRefused` naming each setting that differs, recorded value against asked. A recording is appended to and never overwritten: `record` onto a file that exists numbers its calls after the ones it holds, and only `replace=True` starts afresh. A replay miss, a missing or empty recording, a malformed line (named by its number, a missing or invalid `settings` included) and a line from a newer recording format each raise `RecordingRefused`, an `ApparatusError`, naming the prompt or the line and the command that re-records it, and `RecordedCompletions.check_covers` raises it before a replay starts for every `RecordedPrompt` (host-contract) the recording no longer covers. A replay returns a `ReplayedCompletion`: the ten recorded members, the price as recorded rather than quoted again, and every other attribute the recorded completion's type declared under `extra`. `ClientRequestSettings` (`threetears.evals.schema`) and the judge's `JUDGE_REQUEST_SETTINGS` (`threetears.evals.run`) are host-contract from this release: a host names one to record or replay.",
    "Since `.27` (`evals/27-client`), the public root `threetears.evals.providers` is the shipped completion client, on the base install and built on `threetears.evals.negotiation` and `httpx` alone (no SDK, no LangChain, no other 3tears package): `Model(id, *, provider=None, api_key=None, base_url=None, max_tokens=None, effort=None, temperature=None, recording=None, catalogue=None, http=None)` is a `CompletionClient` and `BoundCompletionClient` with `text`, `json`, `prompt` and `derive` beside `generate`, `price_ceiling` and `aclose`; `Clients(default=None, *, catalogue=None, http=None, **roles)` is the role factory a host hands `EvalHost` as `clients` (`load_prices()` at boot, `aclose()` at shutdown); `describe_failure` its `failure_describer`; `Completion` the reply; `Catalogue` OpenRouter's public model list, which models share; `ProviderError` the one error a failed request raises (the provider, the status and its own message, never the body, and `account`); `Provider` the three provider names. `Model`, `Clients`, `Catalogue`, `describe_failure` and `ProviderError` are host-contract, and `Model` is also exported from `threetears.evals`, loaded on first read (declared in `api/reexports.toml`).",
    "Since `.27`, the 3tears-models adapter is removed with no bridge, and with it every name it exported from `threetears.evals.providers` (pre-release names, so none is recorded as a move): `models_client`, `models_clients`, `ModelsClients`, `ModelsClientRefused`, `ModelsCompletion`, `ModelsCompletionClient`, `ModelsFailureDescriber`, `SupportedProvider`, `SUPPORTED_PROVIDERS` and `PROVIDER_KEY_VARIABLES`. To port: `models_client(id, api_key=..., provider=..., max_tokens=..., reasoning_effort=w | reasoning_max_tokens=n)` is `Model(id, api_key=..., provider=..., max_tokens=..., effort=w | n)`; `models_clients(defaults={role: id}, judge={...})` is `Clients(role=id, ...)` (a role is an id or a `Model` its models are built like); `aclose_all()` is `aclose()`; `ModelsFailureDescriber()` is `describe_failure`; `ModelsClientRefused` is a `ValueError` raised when the `Model` is built; `ModelsCompletion` is `Completion`.",
    "Since `.27`, the `[models]` extra is removed and 3tears-evals depends on no other 3tears package at all: `httpx>=0.27` joins `pydantic` on the base install. `ROOT_EXTRAS` no longer lists `providers`, so `transports.fastmcp` is the one root that needs an extra. An app on 3tears-models, LangChain or a provider SDK wraps its own client in the `CompletionClient` port (`docs/adopting-a-host.md`, \"Bringing a provider\"), held to it by `check_completion_conformance` and `check_refusal_negotiation`.",
    "What the client sends: an id with a `/` goes to OpenRouter on `OPENROUTER_API_KEY`, a bare id needs `provider=\"anthropic\"` or `provider=\"openai\"` (never guessed), `base_url=` takes any OpenAI-compatible endpoint, and a missing key is refused when the model is built unless a recording serves every call. `max_tokens=None` sends 8192 (`DEFAULT_MAX_TOKENS`); `effort` is a word or a token budget, sent as each family takes it; a Claude 5.5 model is never sent a temperature; a strict `json_schema` goes as each provider enforces it (OpenRouter with `provider.require_parameters`, Anthropic as `output_config.format`), as JSON mode where a model cannot take one. Nothing is retried: the only resends answer a refusal of a setting, through `negotiate`, learned for every model sharing a `Catalogue`.",
    "What the client reads: a reply's stop maps onto the engine's five words (an absent or unknown reason, Anthropic's `pause_turn` and `model_context_window_exceeded`, is `truncated`, logged at WARNING with the raw `provider_stop_reason`); counts are `None` when unreported, never `0`; `served_model` is `None` for a requested OpenRouter alias echoed back, and `served_provider` is the upstream OpenRouter routed to. An OpenRouter call is priced by its own `usage.cost` (`openrouter:reported`), and under bring-your-own-key by that plus `cost_details.upstream_inference_cost` (`openrouter:reported+upstream`; a BYOK reply without it is unpriced); a direct call by the catalogue's rates for the matching `vendor/model` row (`openrouter-catalogue:<id>`, ending `;cache-approximate` when a prompt cache was read or written). Unpriced is `None` with `pricing_failure` saying why.",
    "`Model(..., recording=path)` records and replays through `RecordedCompletions`, the one replay format: a recording that exists is replayed offline (no key needed), `RECORD=1` records it again live (a file last written before the run started is started afresh, one written in this run is added to), and a file that does not exist is recorded live. A recording holds one model's calls, so a `Model` handed one of another model's is refused when it is built (`RecordingRefused`).",
    "`RecordedCompletions` stands in for a `BoundCompletionClient` (an analysis writer, an out-of-run call): recording, `model_name` and `price_ceiling` are the inner client's, and an inner client that has neither raises `AttributeError` naming it; replaying, `model_name` is the one model the recording holds (since `.27` a recording holds one), and `price_ceiling` is `0.0`, since a replay sends nothing and costs nothing.",
    "`RecordedCompletions` refuses a non-finite `cost_usd` or `temperature` when it is recorded with `CompletionConformanceFailure`, as it refuses every value JSON cannot hold, and a refusal's remedy names the `rerecord=` command given, or else says to re-record the file with the client it stands in for.",
    "Since `v0.66.0-evaladopt.23`, `StopReason` has a fifth member, `truncated`: output that stopped early for a reason the provider did not name or named in words the mapping does not know (no finish reason, an unrecognised one, Anthropic's `pause_turn`); it is in `INCOMPLETE_STOP_REASONS`, and the engine's cut-short message says it is not the output cap and that the raw provider value is what to look at.",
    "`error` now means only that the provider reported an error in place of a completion (OpenRouter's `error` finish reason) or returned no choices; a host whose client maps an absent or unknown finish reason to `error` should map it to `truncated`, which the shipped client does.",
    "`truncated` is part of the core baseline (`EvalOutOfRunSpend.stop_reason`). It joined the pre-release v14 baseline in `.24` with no new version, and the v15 baseline carries it.",
    "Three more names a host writes against are `host-contract`: `StopReason` (the words a host's own client maps its provider's finish reason onto), `CompletionRole` (the key of `CompletionClients` and of `Clients`' roles), and `RecordingRefused` (what a host catches from the recorder).",
    "From `.24` (`v0.67.0-evaladopt.24`), `threetears.evals.__version__` reports `0.67.0`, not `0.66.0`: the family was bumped to 0.67.0 on the line, so a build from a pre-release tag reports the release it prepares, and a host running one records the tag beside it.",
    "The examples that call a model run live by default: with `ANTHROPIC_API_KEY` set they call `claude-haiku-5-5` through `Model`, recording the run into `examples/recordings/<example>.jsonl` when `RECORD=1` is set too, and without a key they replay that recording; `examples/_live.py` and every scripted stand-in for a model are gone.",
    "Two examples are renamed for what they now compare, since the examples call one model: `compare_two_models.py` is `compare_two_efforts.py` (`low` against `medium` reasoning effort on one model) and `prompt_x_model.py` is `prompt_x_effort.py` (the prompt crossed with the effort).",
    "`llm_analysis.py`'s first draft is canned (`llm_analysis_first_draft.json`), so the refusal it shows does not depend on a model's draft, and the model writes the repair; replayed, the writer reads the bundle the recording was made from (`examples/recordings/llm_analysis.bundle.json`), since a fresh campaign's bundle names fresh run ids and times.",
    "`AnalysisContextBundle` (`threetears.evals.analysis`) is `host-contract`: a host reloads a frozen bundle with `AnalysisContextBundle.from_json` to write over it again, as `llm_analysis.py` does.",
    "Until 0.70.0 is on PyPI, 3tears-evals installed from a tag is the one package outside a host's family pin: its base install depends on no other 3tears package, so it installs beside a family pinned at another version without a conflict.",
    "`threetears.evals.ROOT_EXTRAS` (host-contract) maps each public root that fails to import without an extra to that extra (`transports.fastmcp` to `fastmcp`), so a host's import gate imports `PUBLIC_ROOTS` minus the roots whose extra it does not install instead of keeping its own list; `PUBLIC_ROOTS` is host-contract too.",
    "Since `v0.68.0-evaladopt.26`, there is no `threetears.evals.vega` root and no `[vega]` extra (`vl-convert-python`): the Vega-Lite renderer, the chart renderer seam (`ChartRenderer`, `assert_renderer_conforms`, `renderer_disagreements`, `ChartRefused`), the `report_charts` operation (`ReportCharts`, `DrawnChart`, `ChartRefusal`, `ChartRefusalCause`) and the host's chart style (`ChartPalette`, `ChartFont`, `CHART_FONT_CHARACTERS`, `require_resolved_colour`, `StyleError`, `assert_no_style_text`, and `StyleProfile.chart_palette` and `chart_font`) are removed. A report draws its own two charts as inline SVG, and a host that wants its own pictures reads the report's `bundle.json`.",
    "Since `v0.67.0-evaladopt.25`, the v15 baseline replaces the pre-release v14 baseline `.21` to `.24` wrote, so a host that ran one of them deletes its eval documents again before deploying `.25` (the operator wipe; Discodon: `TRUNCATE evals, eval_runtime;`).",
    "`EvalRun.judge_request_settings` is renamed `judge_asked_settings` and `EvalRun.simulator_request_settings` `simulator_asked_settings`, with no field kept beside them: each holds what the engine ASKED the role for, stamped at launch, and every reader (rejudge, second judge, witnessed runs, the apparatus dimensions) reads the new name.",
    "The apparatus dimensions keep their names, `judge_request_settings` and `simulator_request_settings`, and read the asked fields, so a host's applicability declarations and a profile's judge inputs are unchanged.",
    "What a call was actually SENT with is stored under names of its own, each a `ClientRequestSettings` or `None` for unverified: `RubricScore.judge_sent_settings`, `RepeatedScore.first_judge_sent_settings`, `SecondJudgeScore.first_judge_sent_settings`, `OutOfRunSpend.sent_settings` (always `None` on a raised call) and the judge kind's `JudgeCaseSource.first_judge_sent_settings`, which a case's `content_digest` leaves out while it is `None`.",
    "`RoleUsage.sent_settings` is every distinct value a usage row's calls were sent with, in canonical order, or `None` once any of its calls did not say; it is not part of the row's key, so it never splits a spend row. A row written with the values in another order is stored in canonical order, and one repeating a value is refused.",
    "The engine's constants ask in effort words: `JUDGE_REQUEST_SETTINGS` is `max_tokens=10240, reasoning_effort=\"high\", strict_output=True` (it asked an 8192-token reasoning budget before), and `SIMULATOR_REQUEST_SETTINGS` asks `reasoning_effort=\"low\"` with `strict_output=True` (it asked `minimal`, unenforced, before), so every run's asked settings differ from a pre-release run's.",
    "The judge's 8192 tokens of reasoning room are `JUDGE_REASONING_HEADROOM_TOKENS` in `threetears.evals.run.judge`, which sizes `JUDGE_MAX_TOKENS` and is never sent; `JUDGE_REASONING_EFFORT` is the word.",
    "`analysis_gen_request_settings_for(*, answer_budget_tokens, reasoning_effort=\"medium\", reasoning_headroom_tokens=8192)` replaces `reasoning_budget_tokens`: `max_tokens` is the answer budget plus the headroom, the request asks by the effort word and sends no budget, and a headroom below 1024 is refused with a `ValueError` naming it; a host's `*_reasoning_budget_tokens` configuration is that headroom now.",
    "A host's own client builder must send `reasoning_effort`: none of the engine's request settings carries a token budget now (`JUDGE_REQUEST_SETTINGS`, `SIMULATOR_REQUEST_SETTINGS` and `analysis_gen_request_settings_for`'s value hold `reasoning_max_tokens=None`), so a builder reading only `reasoning_max_tokens` sends no reasoning at all; `wire_settings_for(settings, temperature)` (`threetears.evals.negotiation`) builds what a client sends from every field.",
    "`DEFAULT_ANALYSIS_GEN_REASONING_BUDGET_TOKENS` in `threetears.evals.analysis.generator` is `DEFAULT_ANALYSIS_GEN_REASONING_HEADROOM_TOKENS`, beside `DEFAULT_ANALYSIS_GEN_REASONING_EFFORT` (`medium`) and `MIN_ANALYSIS_GEN_REASONING_HEADROOM_TOKENS` (1024).",
    "`ClientRequestSettings` describes asked and sent settings alike, and no longer says a router maps a token budget onto an effort word: nothing in this package converts one into the other, and a client that sends one in place of the other reports what it sent.",
    "A completion may carry an optional `sent_settings` member, a `ClientRequestSettings` holding what its request actually carried (`strict_output` the enforcement actually sent), declared in `OPTIONAL_COMPLETION_ATTRIBUTES` (`threetears.evals.schema.completion`) and not a `CompletionResult` property, so every completion that conformed still does.",
    "`sent_settings_of(completion)` (`threetears.evals.schema`, host-contract) is the engine's one reader of it: an absent attribute or `None` reads as `None`, unverified and never refused, and a value of another type raises `CompletionProtocolDefect` naming the member.",
    "`check_completion_conformance` takes `require_sent_settings=False`: it checks `sent_settings`' type whenever the completion carries it, and with `True` fails a completion that does not.",
    "`CallUsage` carries `sent_settings` (read by `CallUsage.of`, `None` when the completion did not say), and `RoleUsageLedger.add` takes it and `add_llm_result` reads it, folding every distinct value into the row.",
    "`CallUsage.billed(completion)` reads a completion's spend alone, leaving `sent_settings` unread. `CappedCompletion` settles each call's reservation by it, so a call is settled to what it cost whatever its `sent_settings` holds, and the reporter kind's candidate row reads it, so a candidate's row never carries sent settings.",
    "A simulator call whose `sent_settings` holds the wrong type is recorded in the driver's `calls`, with its spend and as unverified, before `CompletionProtocolDefect` leaves, so a kind that folds `calls` on its way out counts the paid call; the judge path already carries the attempts' spend on the defect.",
    "`RecordedCompletions.FORMAT_VERSION` is 2: each line carries `sent_settings`, what the recorded call was sent with, and `ReplayedCompletion.sent_settings` replays it; a format-1 line is refused by name as older (`RecordingRefused`), so a recording made before `.25` is re-recorded.",
    "A host whose own client knows what each request carried reports `sent_settings` on its completion type in the same deploy that adopts `.25`, so its campaigns do not split at a later deploy, and holds its suite to it with `check_completion_conformance(..., require_sent_settings=True)`.",
    "A host's own client never fails a call for a setting either, in the shipped client's order: a request the provider refused for a setting it carried is sent once more with the closest setting the model takes, or without it; on a router that enforces parameters, the refused settings go first, the temperature before any other, keeping enforcement, and only a request that still finds no endpoint is sent without enforcement, reported as `strict_output=False` in its `sent_settings`. The engine's judge, simulated user and analysis generator all ask `strict_output=True`, so such a call is recorded unenforced and disclosed, never failed.",
    "Since `.25`, the engine records what each call was sent with: `run_judge_llm`'s reply carries `judge_sent_settings` (the parsing attempt's report) and its `judge_usage` names one value only when every attempt reported the same; the score stores it, a repeat, a second judge and a judge-kind case carry the first score's, the judge kind's `JudgeTrial` gains `judge_sent_settings`, and an out-of-run ledger row stores its call's report (a value of the wrong type is recorded `None` and named in `unreadable`).",
    "Two apparatus dimensions join the core: `judge_sent_settings` (read off each score, result-level) and `simulator_sent_settings` (read off the simulator's usage rows), each the distinct values sent and indeterminate when blank; `JUDGE_INPUTS` and `SIMULATOR_INPUTS` carry them, an unjudged run has no judge seat for `judge_sent_settings`, and a kind contract that seats the judge pin by pin seats `judge_sent_settings` too.",
    "Cells pool only when asked AND sent match: unverified on one side never pools with verified, both unverified pool and carry the gap in `unknown_dimensions`, and a run whose calls were sent two ways pools only with an identical mixture. Runs judged before a host reported `sent_settings` read unverified, so a campaign spanning that deploy splits.",
    "`JudgeKey` gains a sixth component, `judge_sent_settings` (the settings' canonical JSON, `None` = unverified), so agreement, evidence tiers, judge profiles, drift and the bundle's judge-change levels treat a judge sent other settings as another judge; `DimensionAgreement`, `SelfAgreementDimension`, `InterJudgeDimension`, `JudgeEvidenceTier`, `JudgeKindReading`, `JudgeDriftDimension`, `EvalJudgeProfile` and `JudgeIdentityLevel` carry it.",
    "A second judge is keyed by what its calls were sent with as well as what it was asked, as the first is: `inter_judge_agreement` and `judge_drift` read each pass's sent settings over its own scores (`sent_settings_level`, the reading the bundle's judge-change levels name a pass's judge by), and `InterJudgeDimension` and `JudgeDriftDimension` carry them as `second_sent_settings` (every distinct value in canonical order, `None` = unverified), so two passes asked alike and sent differently are two second judges.",
    "`UnrepeatedReason` gains `settings_changed`: a repeat whose call was sent with other settings than the first score's, or whose one side did not report them, is unpaired.",
    "`judge_profile_id` takes a required keyword `judge_sent_settings`, which its id digests, so every stored judge profile's id moves.",
    "`tier_sentence` names what a judge was sent (`, sent {max_tokens=..., reasoning_effort=..., strict}`) or says `, request settings unconfirmed`, and the judge-profile receipt line does too.",
    "Every surface states one sentence where the judge's or the simulated user's calls were not shown to be sent as asked: sent other settings, sent more than one way (with counts), sent without enforcement (the provider may have ignored any setting the serving model does not take), or not reported. `request_settings_readings` and `request_settings_disclosure` (`threetears.evals.analysis.reporting`) derive it; `EvalSummary.request_settings` (each role's `RequestSettingsReading`, whose `state` and `sent_display()` are the run's derived sent value) and `request_settings_warning`, `run_summary`'s `request_settings_disclosure`, `AnalysisContextBundle.request_settings_disclosure` and the report's methods carry it; `build_report` takes `request_settings=`. The candidate is never read.",
    "Version spaces moved with no upgrader: `REGENERABLE_SCHEMA_VERSION` 10 (judge profiles and analyses regenerate from the core), the bundle's `schema_version` 53, `CELL_MODEL_VERSION` 13 and `REPORT_VERSION` 10 (`urn:threetears-evals:report:v10`). `IDENTITY_VERSION` does not move (24).",
    "Since `.25`, the judge's strict reply format asks for an ordinal score as a string, `\"1\"` to `\"5\"`, merged with the offered `cannot_tell` into one string enum with no `anyOf`, and the parse reads it back to its integer; a bare integer on the scale is still read, and any other string is refused naming the criterion. An integer enum was sent before, and `google/gemini-3.5-flash-lite` through OpenRouter, `require_parameters` on, did not enforce it: it left every ordinal score out.",
    "`strict_response_format` (`threetears.evals.kernel`) refuses an `enum` or `const` holding a value that is not a string with `UnportableSchema`, naming where it sits and the values, rather than rewrite it, because the reply's reader is the host's: a host projecting its own model declares those values as strings (a `Literal` of strings, a `str` enum) and converts them on read. Every directive the engine sends enumerates strings only.",
    "The built-in judge wording (or the reply-format suffix a configured judge is sent) changed, so every result judged before this release is another judge for agreement, judge profiles, drift and evidence tiers. What moved is the ordinal wording, in the built-in prompts and the suffix alike: a score is asked for as a string (`\"1\"` to `\"5\"`) where it was asked for as an integer, so every ordinal judge (the transcript and outcome axes and every ordinal rubric dimension, built-in or configured, on a transcript or a document) is a new judge; the pass/fail wording did not move.",
    "A new public root on the base install, `threetears.evals.negotiation`, is the one implementation of never failing a request for a setting a model lacks, used by the shipped client and by a host's own client alike; it imports the package's schema and nothing else (no SDK, no HTTP client, no LangChain), and nothing in the engine imports it.",
    "`negotiate(asked, *, provider_family, model, provider=None, send, read_refusal, learned, declared=None)` sends `closest_settings`' answer through the caller's `send(wire, facts)`, hands what it raises to `read_refusal`, and on a `SettingRefusal` of a setting the request carried learns it and resends in a fixed order (a temperature first, keeping enforcement, and only then enforcement), at most once per setting and four times per call; anything else propagates unchanged and nothing is learned from a call never served.",
    "`negotiate` returns `Negotiated` (`reply`, `wire`, `notes`, `refusals`), whose `sent_settings` and `temperature` are what the served request carried, for the caller's completion.",
    "`LearnedSettings` holds what providers refused, safe across threads and keyed by the caller's provider name and the model, and takes `client=`, `declared_by=` and `contradiction=`, which name the client, the declared facts and where to correct a contradicted one in the WARNING it logs once per learned fact.",
    "`closest_settings` takes a `ProviderFamily`, the request shape a client speaks (`anthropic`, `openai`, `router`), not a provider: OpenRouter's shape is the `router` family, and the shipped client maps each provider it speaks to onto its family.",
    "`SettingRefusal` (and its `RefusedSetting` vocabulary) names what a provider refused; `read_router_refusal`, `read_anthropic_refusal` and `read_openai_refusal` read one off a status and a JSON body, parsed or as text, so a client of raw HTTP and an SDK's error read the same: OpenRouter's 404 under `require_parameters` and the 400s it relays from an upstream (`error.metadata.raw`), Anthropic's `invalid_request_error` naming a parameter it does not take, and OpenAI's `unsupported_parameter` or `unsupported_value` naming it in `param`.",
    "`anthropic_thinking(sent, facts)` and `ANTHROPIC_MIN_THINKING_BUDGET` are public in the same root, for a client of Anthropic's wire.",
    "`threetears.evals.testing` gains `check_refusal_negotiation(build_client)` (host-contract): it scripts routers (`RouterTransport`) that refuse the temperature, then enforcement, then an effort word and an output cap, and raises `NegotiationConformanceFailure` naming each mistake unless the host's client resends in that order, reports what the served request carried, sends its next call without what a served request proved, and asks for enforcement again on every call.",
    "Nine more names a host writes against are `host-contract`: `SIMULATOR_REQUEST_SETTINGS` and `analysis_gen_request_settings_for` (what a host's builder applies to its simulator and analysis clients, as `JUDGE_REQUEST_SETTINGS` to its judge), `CompletionProtocolDefect` (what the engine's readers of a completion raise on one that breaks the protocol), `anthropic_thinking`, `ANTHROPIC_MIN_THINKING_BUDGET` and `RefusedSetting` (what a host's own Anthropic client and refusal reader build on), and `RequestSettingsReading`, `SentSettingsState` and `SentSettingsShare` (what a summary says each apparatus role was asked for and sent).",
    "The host guide's new section, \"A client of your own that never fails a request\", is a minimal OpenRouter client over raw HTTP on the shared negotiation, run by the test suite with the check over it.",
    "`negotiate` learns only what a served request proved, and a learned fact lasts for the life of the `LearnedSettings` that holds it (the process, or the factory that keeps it): a temperature dropped for a router's 404 is learned only when the resend that dropped it alone was served, and is otherwise discarded, not learned and not logged.",
    "Enforcement is never learned across calls: each call starts enforced, and a router's 404 that survives dropping the temperature drops enforcement for that call alone, with the temperature put back (dropping it alone placed nothing); `LearnedSettings.learn` keeps no `enforcement` refusal, whoever hands it one.",
    "On a router's 404 under enforcement the temperature is always dropped first when the request carried one, whatever the declared facts say: a catalogue's `supported_parameters` says SOME endpoint takes a parameter, never that one endpoint takes all of them together.",
    "A temperature refused while the request reasoned (an effort word other than `none`, or a budget) is learned as a refusal beside reasoning only: `SettingFacts.temperature_beside_reasoning` (new), set by `SettingRefusal.beside_reasoning` (new), so a call asking `none` or no reasoning still sends its temperature.",
    "An effort refusal never walks the ladder into a failure: a refused word with the list of those taken (OpenAI's \"Supported values are\", and Anthropic's `output_config.effort: Input should be 'low', 'medium', 'high', 'xhigh' or 'max'`, seen live on `claude-haiku-5-5`, now read by `read_anthropic_refusal`) is learned with that list and the request resent once at the closest; a word refused with no list is resent once at the closest word left; and a second effort refusal in the call is read as the parameter, learned as \"takes no effort word\", and the request sent with none (a budget on an Anthropic model that takes one).",
    "`RefusedSetting` gains `max_tokens`, an output cap above the model's own that the provider names (`SettingRefusal.limit`, new): `read_anthropic_refusal` reads `max_tokens: N > M, which is the maximum allowed ...` and `read_openai_refusal` a `max_tokens` or `max_completion_tokens` param whose message says the model \"supports at most M\" tokens, and the loop resends at that cap and learns it as `max_output_tokens`.",
    "`facts_from_router_catalogue(supported_parameters)` (host-contract, `threetears.evals.negotiation`) turns a router catalogue's `supported_parameters` into `SettingFacts` stating only what no endpoint takes (an unlisted `temperature`, `reasoning` or `structured_outputs`); a listed one stays unknown. The shipped client uses it.",
    "`wire_settings_for(settings, temperature)` (host-contract, `threetears.evals.negotiation`) builds the `WireSettings` a client is asked for from the engine's `ClientRequestSettings` (`JUDGE_REQUEST_SETTINGS`, `SIMULATOR_REQUEST_SETTINGS`) and a temperature, so a host never hand-copies the engine's constants.",
    "The shipped client reads OpenRouter's catalogue once per `Catalogue` (at `load_prices` or a model's first call), so what a call is sent does not change mid-run with no recorded cause.",
    "On OpenRouter a strict schema the model cannot take (a relayed upstream `response_format` refusal, or a loaded catalogue listing no `structured_outputs`) is resent as JSON mode (`response_format: {\"type\": \"json_object\"}`) without `require_parameters`, never the same schema unenforced; with no `response_format` listed either, no format is sent and the engine validates the reply on return.",
    "`Clients` builds every role a run records asked settings for from them when the role is given as a model id: the `simulator` gets `SIMULATOR_REQUEST_SETTINGS` (its output cap and effort word) as the `judge` gets `JUDGE_REQUEST_SETTINGS`, so the client sends what the run records as asked.",
    "`check_refusal_negotiation` now scripts three routers, each over a client of its own: the temperature refused under enforcement (an enforced request is served, and `strict_output=True` must be reported), no endpoint under enforcement at all (the temperature put back when enforcement goes, and the next call enforced and with its temperature again), and an upstream refusing the output cap and the effort word (both must be reported as served); the client must be built asking a temperature, an output cap and an effort word, and a client reporting what it was asked or always unenforced is named.",
    "`check_completion_conformance(require_sent_settings=True)` also fails a completion whose `sent_settings` is `None`.",
    "The host guide's own client takes the model's catalogue row (`supported_parameters=`, read through `facts_from_router_catalogue`), maps OpenRouter's `error` finish reason and a 200 with no `choices` to `error`, and its check is built with `wire_settings_for(JUDGE_REQUEST_SETTINGS, ...)`.",
    "What people author is durable (from `.26`): templates, rubric dims, judge configs and their tombstones, case sets, test cases and calibration ratings left the evidence core for a version space of their own, `DURABLE_SCHEMA_VERSION` 15 (`DURABLE_BASELINE_VERSION` 15, which never moves; `DURABLE_SCHEMA_MINOR` 1; `DURABLE_UPGRADERS` empty), with `DURABLE_DOC_TYPES` and `DURABLE_ADDRESSING_FIELDS` beside the core's (exported from `threetears.evals.schema`). `DocLifecycle` gains `durable`, and `CORE_DOC_TYPES` and `CORE_ADDRESSING_FIELDS` no longer name the eight. No stored byte changes: every durable document `.25` wrote reads as durable v15.0, and `.25` reads this release's as core v15 at a newer minor, so the rollback floor stays `.25`. The evidence core is baseline-resettable from here on, and a durable shape change ships an upgrader (`schema/versioning.py`).",
    "Durable minor v15.1: `CalibrationRating.rated` (new `RatedOutput`: the criterion, intent, variation, goal outcomes, judged artifact and evidence the rater read, verified against the rating's label key) or `rated_withheld` (why not), exactly one of them. `rate_result` fills it under `reproducible_judge_inputs` and stores the rating with `rated_withheld` when that check refuses; `RatingStore` now also reads the run, template, test case and trace (it extends `JudgeInputStore`). A rating stored before v15.1 reads with `rated_withheld` = `RATING_WRITTEN_BEFORE_CONTENT`; constructing one yourself now names one of the two. Re-rate labels a pre-`.26` build wrote if they must outlive their runs.",
    "Breaking: `EvalStorage.nuke_all_eval_data(scopes, *, include_durable)` requires `include_durable`, with no default; `False` keeps the durable types. `EvalStorage.reset_core(scopes)` (new) is the core baseline operation: it deletes every core and regenerable document (`CORE_RESET_DOC_TYPES`, new) of the named scopes and nothing else. On a `RoutedDocumentStore`, `RoutedDocumentStore.reset_core(stores, route, scope_ids=..., routing_scope=...)` (new, returning `CoreReset`) does the same over every store and then relocates, so the router boots after it. A deploy runbook calls one of them and never truncates tables by name.",
    "Breaking for a lifecycle route: `DocTypeRoute(by=\"lifecycle\")` must map `durable`. A route that gives it a store of its own moves the eight durable types, so the first start raises `RouteChanged` until `RoutedDocumentStore.relocate` (or `reset_core`) has run.",
    "Durable minor v15.2: a judge case may be AUTHORED rather than frozen from a stored result. `AuthoredJudgeCase` (new, kernel: the criterion as a `RubricDim`, the output, the case material, the intent, an optional subject and judged artifact, the expected verdict as `\"pass\"`/`\"fail\"` or a score, the author and a note; a verdict the criterion's scale cannot hold is refused naming both) freezes through `freeze_judge_cases(..., authored=[...])` into a `JudgeCase` (`JudgeCase.from_authored`, new) whose one label is the expected verdict, so the judge kind, `judge_kind_readings` and judge profiles read it as a labelled case. Additive on the stored payload: `JudgeCaseSource.authored` (`JudgeCaseAuthoring`, new, default None and out of the content digest while None) with `run_id` and `result_id` None only beside it; `JudgeCaseLabel.rating_id` and `JudgeTrial.source_result_id` are None only on an authored case. `FrozenJudgeCase.source_run_id` and `source_result_id` are optional and `FrozenJudgeCase.authored_by` is new. A freeze naming no run, no labels and no authored case is refused as before. Every case frozen before reads and digests unchanged; a v15.1 build refuses an authored case by name when its judge kind reads it. On the host path, `ops.judge_case_author` (`JudgeCaseAuthor`, new) and the `judge_case_author` action (write) author one case into a judge template, naming its dimension by the subject template whose rubric words it (`criterion_template_id`, `criterion`; `scenario` defaults to that template's intent) and recording the caller as its author; it mints no case set (`case_set_mint` does). On the quick path, `Judge(examples=[JudgeExample(...)])` (`quick.JudgeExample`, new: a dimension, an answer, the verdict, a note, optionally the case and author) is checked when the judge is built, and a judged `run_eval` or `compare` seeds the examples as authored cases of the judge template `<template id>-judge`, listed by the case set of that name, calling no model.",
    "`freeze_judge_cases(..., from_labels=True)` (and `from_labels` on the `judge_cases_freeze` action, whose `judged_run_ids` is now required only without it) freezes judge cases from the scope's durable person labels alone, one per label key, reading no run or result; a label carrying no content is skipped by name (`JudgeCaseSkip.rating_id`, new). `JudgeCaseSource.test_case_id` is now optional (None on a case frozen from a label), and `JudgeCase.from_rated` builds a case from a label's content.",
    "Since `.26`, core is v15.1 (`CORE_SCHEMA_MINOR` 1), an additive minor: `CallLedger.refused` (a list of `RefusedCall`, default None), `RubricDim.judge` (`JudgeDeclaration`, `\"builtin\"` or `\"configured\"`, default None; on a durable template, catalogue dim or rating criterion it is durable v15.1 too) and `EvalResult.judge_cut_short` (a dim -> `JudgeCutShort` map, default empty). A `.25` build reads both documents as it always did and keeps the fields on write; a `.25` re-judge scores a dim without touching `judge_cut_short`, whose read rule (an entry counts only for a dim with no score while `judge_error` is set) leaves that entry unread.",
    "A judged dimension declares its judge. `create_template`, `seed_eval_definitions` and an `update_template` that writes `rubric` refuse a dimension with `judge` unset (naming every one), a `\"configured\"` one with no active judge config in the scope (a seed counts the configs it seeds), and a `\"builtin\"` one beside an active config; every launch (`build_judge_service`, `plan_judge`) refuses the same before any spend, and a launch's `judge_config_ids` may name a config only for a dim declared `\"configured\"`. A stored template from before `.26` reads, and its launch is refused until `template_update` declares its dimensions; a host's seed corpus carries `judge:` on every judged dimension. The built-in prompt no longer stands in for a missing config. A quick-path `Judge` declares its dimensions `\"builtin\"` itself, and a quick run's template id is digested without the declaration, so it is unchanged. The two reserved axes are unchanged.",
    "The rubric proposer's strict reply schema leaves `RubricDim.judge` out, so its output contract and every stored proposer prompt are unchanged; a drafted template's dimensions carry no declaration, and `create_template` asks for one.",
    "`JUDGE_REQUEST_SETTINGS` asks the judge's reasoning as a budget: `max_tokens=10240, reasoning_max_tokens=8192, strict_output=True` (`reasoning_effort` None), the cap still `JUDGE_REASONING_HEADROOM_TOKENS` plus `JUDGE_ANSWER_BUDGET_TOKENS`. A model taking effort words only (OpenAI, OpenRouter, an adaptive-only Anthropic model) is sent `high`, the word 8192 of 10240 reads as, exactly as before; an Anthropic model taking a thinking budget is sent the 8192 budget, and no temperature beside it. Reasoning stays on for every scale. Every run judged from `.26` records the new `judge_asked_settings`, so the `judge_request_settings` apparatus dimension separates it from runs judged before; where the budget is what is sent, `judge_sent_settings` moves too, so the judge is a new judge to agreement, evidence tiers, profiles and drift, and its calibration reads `undetermined` until redone. No judge wording changed. `JUDGE_REASONING_EFFORT` is the word the budget reads as, no longer what is sent.",
    "A judge reply the provider cut short carries a structured `judge_cut_short` beside its unchanged `error` in `run_judge_llm`'s reply, folded through `JudgeOutcome.cut_short` onto `EvalResult.judge_cut_short`; a re-judge drops a re-asked dim's entry and records any new cut. Nothing is retried or re-bought.",
    "`ExclusionCause` gains `truncated`: `trial_exclusion` returns it for an excluded result whose judge reply ran out of room (`max_tokens` or `truncated`, `OUT_OF_ROOM_STOP_REASONS`) and that carries no `infra_error`; a filtered or errored reply stays `infra`, and a candidate failure still outranks every exclusion. `ExclusionCause`, `trial_exclusion`, `judge_truncated_dims`, `DIFFERENTIAL_EXCLUSION_SHARE` (0.10) and `preregistered_questions` are exported from `threetears.evals.kernel`; `JudgeCutShort`, `JudgeDeclaration` and `OUT_OF_ROOM_STOP_REASONS` from `threetears.evals.schema`, whose `StopReason` is now defined in `schema.models` and re-exported unchanged; `ArmExclusions` and `DifferentialExclusion` from `threetears.evals.analysis`.",
    "A campaign's design is frozen once it holds a run: `campaign_update` (`update_campaign`) refuses `declared_design` in any form (set, replaced, withdrawn, or declared on an exploratory campaign) with `ConflictError` (409), and it and `set_campaign_control` refuse re-pointing or clearing a declared control; a control may be addressed once, from a run, while none is declared, which is the path `quick.compare` takes. `name` and `description` stay editable. A host's UI offers \"new campaign from this design\" in place of editing one with runs, and a confirmatory campaign declares its question before launching into it.",
    "Breaking for an import gate (from `.26`): each value of `threetears.evals.ROOT_EXTRAS` is a `RootExtra` (new, host-contract, exported from `threetears.evals`), not the extra's name: `.extra` is that name, and `.modules` every module the root imports that the base install lacks, by import name and sorted (`transports.fastmcp`: `fastmcp`; since `.27` no other root needs an extra). A gate that compared a value with a string compares `.extra`, and one that kept its own module list checks `.modules` with `importlib.util.find_spec` instead.",
    "`threetears.evals.negotiation.MAX_RESENDS` (new, host-contract, from `.26`) is the most refused sends one `negotiate` call answers (4, the bound the loop always had). A refused send is unbilled, so a call's price ceiling is one request's, but each can take up to the request timeout before it is refused: a wall-clock ceiling a host holds around one call allows `MAX_RESENDS` × that timeout past the served request's.",
    "Since `.26`, a report is one page every door renders, verdict first, built by code from the evidence bundle: `campaign_report`, `analysis_report`, `Comparison.report`, the command line's `report` and `report_read` all return it, and none adds, drops or reorders a block. Its screens are the title, the basis line (a question declared before the run, or `EXPLORATORY`), the verdict line (a setup gate, too few cases, the declared questions, or leads only), the scoreboard and its outcome bar; the memo and the contrasts against the control; the cases; one drill-down per trial; what was not tested; and the methods. `Report` lost `report_version`, `headline`, `byline` and the served words (`section_title`, `finding_number` and `rests_on_numbers` as fields, `TableCell.text` stays a property), gained `title`, `bundle` (excluded from its dump) and the `trial` block, and its sections are `header`, `scoreboard`, `memo`, `contrasts`, `cases`, `trials`, `not_tested` and `methods`. A chart block is an `outcome_bar` or `interval_rows` carrying its values, drawn by the package as inline SVG; a row needs `MIN_CASES` (5) usable cases and an interval, and a chart with none is not built.",
    "`Report.write(dir)` and `Comparison.write(dir)` write `report.html` (one page that needs no script), `report.md` and `bundle.json` (the evidence bundle, with its `schema_version`; the page names its fingerprint). The command line's `report --out` takes a directory and writes all three. The published Report JSON is gone (`schema.json`, `report_json_schema`, `published_report_schema`, `SCHEMA_PATH`, `SCHEMA_ID`, `REPORT_VERSION`, `Report.to_canonical_json`): `report_read(format=\"json\")` and `report --format json` return the bundle, which is the machine form.",
    "The disclosures `compare` added on its own (a judge grading its own model's answers, a measure with no margin to be equivalent on, a guardrail not shown held) are the report builder's, so every door carries them; `build_report` no longer takes `model_identity` or `request_settings` (the frozen bundle's own lines are printed), and `build_code_only_report` no longer takes `measures`. Below `MIN_CASES` cases a contrast reads `not tested (n=N)` with no Δ and no statistic (`VerdictReason` gains `too_few_cases`), and no report states a change as a percent.",
    "The chart intent pipeline, the arm table and the decision surface table are removed: the `threetears.evals.analysis.viz` root (`ChartIntent` and its parts, `chart_intent`, `check_intent`, `PayloadError`, `IntentPolicyError`, `table_disagreements`; `analysis/viz/quantities.py`, the number rule, stays as an internal module), `finding_chart_intent`, `ArmTable`, `ArmRow`, `ArmStatus`, `ArmMeasurement`, `SurfaceTable` and its parts, `Viz` and `VizType` (`threetears.evals.kernel`), `VALIDATED_SLOTS` and `SERIES_SLOTS` (`threetears.evals.kernel.host`) and the `FIND_FINDING` remedy. No arm is ever called a winner.",
    "The memo writer authors findings and recommendations only: `AuthoredAnalysis` loses `headline`, `headline_rests_on`, `summary` and `summary_rests_on`, `Finding` loses `chart` and gains `trials` (the ids of the bundle's trials it is drawn from), and `Chart`, `MeasureRef`, `NO_CHART` and `summary_bullets` are removed; `FindingResolution` loses `chart` and `chart_note`. `authored_schema`, `response_format` and `validate_authored` take the caveat kinds alone, and `prompt_content_version` no longer takes `time_axis`. The generator refuses a recommendation resting on no finding, a finding naming a trial the bundle does not hold, any `adopted` recommendation in a campaign that declared no question before its first run (keeping the control included), and a finding title stating a null its evidence did not establish (the null check moved from the headline and summary). The writer's prompt drops its chart rule and its headline and summary clauses (13 rules, under 24,000 characters).",
    "`REGENERABLE_SCHEMA_VERSION` is 11: an analysis stores the bundle it was written over (`EvalAnalysis.bundle`, read back with `analysis_bundle`), and a v10 analysis is refused on read and regenerated, as judge profiles and insights are. `AnalysisLine` (`analyses_list`) carries `verdict` (code's verdict line over that bundle), `findings` and `recommendations` in place of `headline` and `headline_standing`.",
    "The bundle's `schema_version` is 54. From the rig defects: `exclusions` (per arm and rig, the trials, usable trials and exclusions by cause, with `truncated_sent_caps` and `truncated_cap_unreported`), `differential_exclusions` (each arm and cause above `DIFFERENTIAL_EXCLUSION_SHARE`, beside the other arms' shares), `reading_scope.post_hoc_questions`, and the computed `question_declared` and `post_hoc_questions`. A question declared after the campaign's first member run was created no longer makes a campaign confirmatory: the families, the reading scope, the verdict order, the exploratory disclosure and the report's basis and verdict lines read `preregistered_questions`, so a campaign whose questions all came late reads as exploratory, with a disclosure naming them (`post_hoc_disclosure`). `exploratory_disclosure` takes an optional `first_run_at`. From the one report: each arm's census (`scoreboard`: ran, lost by cause, usable, passed, failed by cause, cases, cost), one row per trial (`trials`, capped at 500 with the lost and failed kept first, `trials_omitted` counting the rest), `case_sets`, `design_frozen_at` (the campaign's first member run's `created_at`, the instant its design froze; None with no run), each run summary's `judge_shares_candidate_model`, and `package_version` (left out of the fingerprint). Every trial is lost or not as `trial_exclusion` says, the one classification `exclusions` counts; the census departs from it only where pass^k does, counting a trial a failed check already decided as failed though the judge could not tell on another dimension. The writer reads the trials without their excerpts. `CampaignReadStore` (and so `AnalysisStore`) gains `load_eval_trace`, read for each kept trial that has a trace; `EvalStorage` already has it, and a host's own store adds it. Stored analyses read as `package_shape` changed.",
    "Since `v0.68.0-evaladopt.27`, `threetears.evals.testing` no longer exports the import check: `nonpublic_evals_imports`, `BoundaryFinding`, `BoundaryRule` and `BOUNDARY_RULES` are removed (`testing/import_boundary.py`). A host that wants to hold its imports to the public roots checks each `from threetears.evals.<root> import <name>` against that root's `__all__`.",
    "Since `.27`, the stored-result re-check is removed from `threetears.evals.run`: `recheck_goal_states`, `recheck_result`, `RecheckStore`, `ResultRecheck`, `RunRecheck`, `CheckFlip` and `KeptOutcome` (`run/recheck.py`). It had no action and no command; a stored result is graded again by running it again (the core is baseline-resettable), or by `grade_goal_checks` over its stored ledger and end state.",
    "Since `.27`, the universal battery launcher is removed from `threetears.evals.run`: `start_universal_battery`, `BatteryPreflight` and `TemplatePreflight`. `EvalTemplate.universal` stays, with its meaning (the template applies to every subject); a host launches each universal template with `start_run`.",
    "Since `.27`, every action without a bespoke rendering renders its result through one generic renderer (`render_model` in `threetears.evals.actions.render`): the result model's name, then every field it carries, one line each, a list of models one bullet per model. The text carries every fact it carried before, but its wording and layout changed; `job_poll`, `results_list`, `result_get`, `report_read` and a started job keep their own. Read an action's `structured` result, not its text, to branch on a value.",
    "Since `.27`, a host registers no prompt: `AnalysisGeneration.resolve_prompt` defaults to `None` and `prompt_id` to `ANALYSIS_GEN_PROMPT`, and the generator then runs `EVAL_ANALYSIS_GEN_DEFAULT`; `plan_draft` takes `system_prompt` and `reset` as optional keywords and sends the axis's shipped default when handed no prompt (`default_system_prompt(axis)`, new in `threetears.evals.gen`). An override works as before, needs `reset=`, and is held to its output contract. The drift check (`prompt_drift`) is the host's to call or not.",
    "Since `.27`, a `RecordedCompletions` recording holds one model's calls at one temperature (under any number of request settings): `replay` and `check_covers` no longer take `model=` or `temperature=`, a replay's `model_name` is the recording's one model, and recording a second model or temperature onto a file is refused (`RecordingRefused`), as is reading a file that holds two. The key and the line format are unchanged (`FORMAT_VERSION` 2), so a recording of one model reads as it did.",
    "Since `.27`, `threetears.evals.schema` no longer exports `CORE_UPGRADERS`, and `upgrade_core_document` is gone from `schema.versioning`: the core ships no upgrader, so `CORE_BASELINE_VERSION` is `CORE_SCHEMA_VERSION` and a core major is a baseline reset. `CoreUpgrader`, `upgrade_document` and `DURABLE_UPGRADERS` stay for the durable space.",
    "Since `.27`, the quick path is three slots at the package root: `Eval(cases, runner, grader)`, run with `await ev.run(store=, host=, scope=)`, returns a `Result`; with `Judge`, `Example`, `grader`, `World`, `Log`, `Model` and `Answer`, these nine names are exported from `threetears.evals` itself, loaded on first use, so `import threetears.evals` stays cheap. `threetears.evals.quick` keeps the host bridge alone: `as_host`, `run_cli`, `build_parser`, `HostCommand`, `HostFactory`, `DEFAULT_PROG`, `ENGINE_COMMANDS`, the `EXIT_*` codes, `measure` and `Measure`. No pre-release name is shimmed. Each old quick name and its new home: `run_eval(cases, fn, scorers, scope_id=, host=, store=, k=, model=)` -> `Eval(cases, fn or {model: fn}, scorers, k=).run(scope=, host=, store=)` (its summary is `Result.summary`; `run_id` and `template_id` are on `Result`); `compare(..., control=)` -> a mapping runner, its first key the control; `Comparison` -> `Result` (one type for one arm or many; `render()` is now the quiet print, `report_markdown(result.report)` the old text, `write(dir)` keys `html`/`bundle`/`markdown`); `ArmKey` and `factors=` -> arm names as `k=v` pairs (`\"model=m1, prompt=v2\"`); `expected=`, `ExpectedLabel` -> a field-name grader (the first field is the classifier: same `match`, `confusion_cell` and accuracy; every later field is a pass rate with `Result.labels(field)`); `UNUSABLE_ANSWER` -> unexported (same value); `stratum_key=` -> each case's reserved `stratum` key; `seed=`, `CaseSeed` -> each case's reserved `world` key; a case's `id` is now withheld from the runner and graders as well; `Candidate`, `ToolUsingCandidate`, `WorldCandidate`, `CandidateTools`, `Tool` -> removed (a runner is any callable); `Scorer` -> removed (a function grader); `Judge(client=, model=, rubric, scale=, context=, ...)` -> `threetears.evals.Judge(model, rubric, *, examples=(), labels=None, case_material=None, guard=None)` (`model` an id, a `Model` or a client naming its model with `model_name`; a mapping rubric is pass/fail by default, a `RubricDim` states its own scale; bare names are stored under `answer.`); `JudgeExample` -> `threetears.evals.Example`; `CaseMaterial` -> unexported; `Guardrail`, `GuardrailDirection`, `guardrails=`, `margins=`, `ranges=` -> `grader(fn_or_field, margin=, guard=, range=)` and `Judge(guard={dim: margin})` (every grade is higher-is-better, so a guardrail has no direction); `Answer` -> `threetears.evals.Answer`; `World(name, [Dimension], tools=[WorldTool])`, `Dimension`, `WorldTool`, `WorldTools`, `ToolRefused` -> `threetears.evals.World(State, tools=[typed functions])` (a pydantic state model, each field's description why it matters; a tool's parameters from its type hints; `world(agent)` is the runner; graders see `.answer`, `.state` and `.calls`; a refused call raises a `ValueError`) and `World(tools=[...], recording=path)` for lookups, replacing `tools=`, `cassette_mode=` and `cassette_corpus_id=` on the quick path (a recording that exists is replayed, `RECORD=1` records it again; the engine's own cassettes for a host's kinds are unchanged); `goal_checks=` -> expression graders; `intent=` -> the runner's docstring; `callable_host`, `callable_kind`, `callable_kind_contracts`, `CALLABLE_KIND`, `CALLABLE_KIND_CONTRACT`, `JUDGED_CALLABLE_KIND`, `ARM_LEVER`, `DEFAULT_QUICK_SCOPE` -> `threetears.evals.quick.as_host(evals, *, store, clients=None)` (the kind an eval's runs are of is still named `callable`). New: `Log` (outputs an app pushes, graded as logged; a repeat never logged is excluded as `not_logged`), `Model` (the shipped client, `threetears.evals.providers.Model`, served from the root too: one class, whose calls inside a runner are counted as that cell's `candidate` spend with no `Answer`), `Judge(labels=)` with `to_label.csv` written beside a judged result's report, and `python -m threetears.evals FILE.py|FILE.toml` (every eval a file declares, run into `.evals/evals.sqlite` under a scope named after the eval, its report under `.evals/reports/<name>/`).",
    "Since `.27`, `threetears.evals.kernel.note_spend(completion)` (new) adds one completion to the spend of the runner call in progress, and does nothing outside one: the shipped `Model` calls it on every completion, so an eval's runner that calls a model reports what it cost with no `Answer`; a host's own client may call it to the same end. A TOML eval file's judges each replay a recording of their own beside the runner's (`triage.judge.jsonl` beside `triage.jsonl`), since a recording holds one model's calls.",
    "Since `.27`, a reasoning budget goes as a budget wherever the provider takes one (a judge whose cap was its only stop was cut short in production). `closest_settings` sends a `router` request's budget as asked, and the shipped `Model` sends it as OpenRouter's `reasoning.max_tokens` (never beside `reasoning.effort`; a budget wins over a word) and as Anthropic's `thinking: {type: enabled, budget_tokens}`; OpenAI's chat completions take no budget, so there the budget still goes as its effort word. A host's own router client built on `negotiate` now receives `WireSettings.reasoning_max_tokens` for the judge (`JUDGE_REQUEST_SETTINGS` asks by a budget) and must send it as `reasoning: {max_tokens: N}`, as the host guide's client does; one that reads only `reasoning_effort` would drop the judge's reasoning. A budget sent as a word, or as nothing, is named on the sent settings: `ClientRequestSettings.unsent_reasoning_max_tokens` and `WireSettings.unsent_reasoning_max_tokens` (new, default None, never beside `reasoning_max_tokens`), core schema minor v15.2. A budget not below the asked `max_tokens` is refused by `closest_settings` with a `ValueError` naming both, never clamped; `facts_from_router_catalogue` reads a row without `reasoning` as taking no budget either (`reasoning_budget=False`); and `check_refusal_negotiation`'s client is built asking for an effort word (`SIMULATOR_REQUEST_SETTINGS`), since the judge's settings now ask a router for a budget.",
    "Since `.27`, an eval action's outcome tells a call that RAISED from one that was REFUSED: `ActionOutcome.ending` (new: `ok`, `refused` or `raised`) and `Refusal.raised` (new), from the refusal's status alone (a 5xx, `provider_refused`, `storage_failed` or a host's own error at one, is the engine or host failing the call). The text of a raised call is headed `raised:` in place of `refused:`, and the FastMCP transport's structured content for an error is `{\"ending\": ..., \"refusal\": {\"kind\", \"status\"}}` (it was `{\"refusal\": ...}` alone). A host recording its candidate's refusals from action outcomes calls `CallLedger.record_refusal` only for `ending == \"refused\"`.",
    "Since `.27`, the definition seed corpus has a `judge_cases` slot: `SeedCorpus.judge_cases` (new, a tuple of `SeedJudgeCase`, new, exported from `threetears.evals.run`), read by `load_seed_corpus` from `judge_cases/*.json`. A `SeedJudgeCase` is `judge_case_author`'s arguments with its two templates named by `name` (`judge_template`, `criterion_template`) and the case's `author`; `seed_eval_definitions` builds each through `author_judge_case` (new in `threetears.evals.run.judge_kind`, the door `judge_case_author` now goes through too) before anything is written, refusing the whole seed for a case authoring would refuse, and freezes it with `freeze_judge_cases(authored=)` after the templates, reported under `judge_case` keyed `<judge template>/<test case id>`. A host's own authoring tool over `judge_case_author` and `case_set_mint` for boot-time judge cases can be dropped.",
    "Since `.27`, the guides are cut to the adoption ladder, 19 pages to 11 a newcomer reads (plus the generated `surface.md` and `reference.md`, and `open-problems.md`). Each page renamed or merged, with where a link to it now points: `docs/tutorial.md` is replaced by `docs/ladder.md` (rungs 1 to 4 through the four examples; its keep-your-runs step moved to `docs/serving.md`); `docs/agents-and-mcp.md` and `docs/command-line.md` merged into `docs/serving.md` (rung 4: running a file, keeping and reading runs, the host commands and exit codes, operations, actions and MCP); `docs/world-model.md` merged into `docs/evaluating-agents.md` (its last section, \"Why a world\"); `docs/designing-classifier-evals.md` merged into `docs/building-an-inventory.md` (its second half, \"Designing a classifier's cases\", sections unnumbered); `docs/choosing-a-design.md` merged into `docs/measuring-soundly.md` (its first half); `docs/principles.md`, `docs/design-rationale.md` and `docs/prior-art.md` merged into `docs/design.md` (one section each). `docs/concepts.md` leads with six concepts (case, runner, grader, judge, comparison, report) and keeps the glossary below them; the README's anchor `#first-result-in-10-minutes` is now `#install`. No code or public name moved.",
    "Since `.27`, `python -m threetears.evals FILE` reads a Python file's relative paths beside the file, as it always read a TOML file's: while the file is imported, the cases `Eval` is handed, `Model`'s and `World`'s `recording=`, `Judge`'s `labels=` and a `Log`'s file are read against its directory (`threetears.evals.kernel.beside_eval_file`, new, provisional), so `python -m threetears.evals examples/1-triage/triage.py` runs from any directory. An absolute path is taken as given, and outside such a load a relative path is the working directory's, as before. The store and the reports stay under the working directory. A path the file's own code opens is its own to place (`Path(__file__).with_name(...)`).",
    "Since `.27`, serving an eval host is one call: `mount_fastmcp(as_host([...], store=...), scope=\"dev\")` builds a FastMCP server named `evals`, mounts the engine's catalogue over `OpsHost.reading(eval_host)` (new: a launching host that declares no kind and generates no analysis, so every read works and a launch is refused) with `read_only_tools()`, acts every call in `scope` as `identity` (default `mcp`), and returns the server to `run()`. The full form is unchanged and widened: `catalogue` defaults to `eval_catalogue()`, `host=` also takes an `EvalHost` (served through `OpsHost.reading`, read-only tools by default), and `scope=` stands in for `caller=` (exactly one of the two). `mount_fastmcp` is `host-contract` (it was `stable`), since rung 4's `serve.py` imports it.",
    "Since `.27`, a field grader after the classifier reads a case's `null` as \"must be absent\": an answer with no value in that field (`None`, or no such field) passes, and any value fails, its answer shown with the miss. It used to refuse the case (`the case's 'total' is None`). The classifier still refuses a `null` label, since a confusion matrix counts labels.",
    "Since `.27`, a single-arm result's quiet print (`print(result)`, `Result.render()`, and what `python -m threetears.evals FILE` prints) opens with a verdict in plain words, `<eval>: <passed>/<usable> cases passed; <n> misses: <case ids, up to 5>`, then `; <k> excluded: <cause>` per cause of a case every repeat of which was excluded, and, for a judged eval, the judge's calibration line right after it. It used to open with the eval's name alone (or `<eval>: <arm>`). A case passes when none of its usable repeats is a miss. A comparison's first line is unchanged. A host that parsed the first line reads `Result.misses()` and `Result.summary` instead.",
    "Since `.28`, the installed build ships its tier map: `threetears/evals/surface_tiers.json` (package data, every public `root.name` and its tier, written by `generate_api_snapshot.py` with `api/surface.json`, which is not installed, and held equal to it by `tests/test_api_tiers.py`), read by two new host-contract names at the package root: `surface_tier(qualified_name)` (`\"host-contract\"`, `\"stable\"` or `\"provisional\"`; `KeyError` for a name no root exports) and `declared_names()` (every `host-contract` and `stable` name). A host's own test gates its imports by tier against the version it runs (`docs/adopting-a-host.md`, \"Stability tiers\"). To keep the declared surface at its ceiling of 450, `threetears.evals.kernel.DEFAULT_JOB_LEASE_S` and `threetears.evals.schema.omit_paths` are `provisional` (they were `stable`; both still exported from the same roots). The toy host (`tests/fixtures/toyhost/`), which imports both, exercises the whole contract and reaches past it, so `tests/test_api_tiers.py` now holds its imports to the public roots rather than to the declared tiers; the courier host and every page stay held to the declared surface.",
    "Since `.28`, `threetears.evals.run.SeedJudgeCase` is `host-contract` (it was `provisional`): a host's production seed builds it in memory (`SeedCorpus(judge_cases=...)`) as well as reading it from `judge_cases/*.json`, so it moves only with a deprecation cycle. To keep the declared surface at 450, `threetears.evals.kernel.resolve_variant_identity` is `provisional` (it was `stable`; still exported from `kernel`, and the toy host's corpus still imports it).",
    "Since `.28`, the definition seed has a `case_sets` slot, so a production definition whose launches target a named case set is re-creatable from git: `SeedCorpus.case_sets` (new, a tuple of `SeedCaseSet`, new, provisional, exported from `threetears.evals.run`), read by `load_seed_corpus` from `case_sets/*.json`. A template cannot imply the set (it carries no list of its cases), and an authored case's stored id is derived from its judge template's generated id, so a `SeedCaseSet` names its judge `template` by name and its `judge_cases` by their corpus names, in order: `SeedJudgeCase.name` (new, default None, not part of the case), which `load_seed_corpus` fills from a `judge_cases/*.json` file's name when the file names none. `SeedCorpus` refuses, when built, a set listing a case twice, naming one the corpus does not carry or one of another judge template, two sets or two cases under one name, and two cases that differ only by name; a case a set lists that authoring refuses refuses the whole seed before anything is written, as any corpus judge case does. Once the cases are frozen, `seed_eval_definitions` mints each set whose name the scope holds no version of through `mint_case_set` (the path `case_set_mint` takes) over its cases' stored ids, reported under `case_set` keyed `<name> v<version>`; a scope holding any version of the name keeps it, the next version being `case_set_mint`'s, and a set some case of which did not land is counted failed and minted on the next boot. A host's own script minting its boot case sets over `case_set_mint` can be dropped.",
    "Since `.28`, `threetears.evals.providers.Catalogue` refreshes: `Catalogue(*, url=..., http=None, refresh_after=timedelta(hours=6))` (new keyword; zero refreshes on every load, negative is a `ValueError`) keeps the rows it read for `refresh_after`, and the first `load()` after that, which every live call makes, fetches them again; a long-lived process was priced from its first fetch forever. A first fetch that fails still raises and keeps nothing. A refresh that fails keeps the last rows rather than failing the call, logs at WARNING, and marks them stale: `Catalogue.stale_since` (new, when the rows expired, UTC) and `Catalogue.refresh_failure` (new, why), cleared by the next refresh that succeeds; the failed refresh is tried again on the first load five minutes later (or `refresh_after`, when shorter), not on every call. Every completion the stale rates price says so: `Completion.pricing_stale_since` (new member, `None` while the rates are fresh and on an OpenRouter call, which OpenRouter's own figure prices), so a `Completion` now carries five members of the client's own beside the port's ten.",
    "Since `.28`, the words the shipped client writes as a completion's `price_source` are a host-contract name: `threetears.evals.providers.PriceSource` (new, a `StrEnum`, so each member is the string itself and a stored `price_source` compares equal to it): `OPENROUTER_REPORTED` (`openrouter:reported`), `OPENROUTER_REPORTED_UPSTREAM` (`openrouter:reported+upstream`, the bring-your-own-key sum of OpenRouter's fee and the upstream's charge) and `OPENROUTER_CATALOGUE` (`openrouter-catalogue`, the prefix of `openrouter-catalogue:<catalogue id>`, which ends `;cache-approximate` when a prompt cache was read or written). The words are unchanged; the client now writes the members, and a test holds it to them. A host that spelled `\"openrouter:reported+upstream\"` compares with `PriceSource.OPENROUTER_REPORTED_UPSTREAM` instead. To keep the declared surface at 450, `threetears.evals.analysis.variant_key_of_run` is `provisional` (it was `stable`; still exported from `analysis`, and the toy host's run path still imports it).",
    "Since `.28`, a stored verdict is graded again through one door, `threetears.evals.run.regrade` (new, `stable`), the successor of `recheck_goal_states`, which `.27` removed with `run/recheck.py`: `await regrade(host, result_id, scope_id, *, checks=True, judges=True, apply=False)` re-grades one stored result's check dims (its goal checks) from what its cell stored (the trace's call ledger and end state, the result's world events, its case's variation) through `grade_goal_checks`, keeping as stored, with why, every outcome it cannot re-grade from that (the re-check's rules, unchanged), and names its judged dims whose judging failed, each held to `reproducible_judge_inputs` (over `JudgeInputStore`) before anything is written or spent. It returns a `Regrade` (new, provisional): every dim whose verdict moved, old beside new (`RegradedDim`, new, provisional: the check's expression or the judged dim, `graded_by` `check` or `judge`, `was`, `now`, `detail`), the outcomes kept as stored, the failed judged dims, and why either half re-graded nothing. It writes nothing unless `apply=True`: then the moved check verdicts are stored, conditional on the result as read (a race is a `ConflictError`, nothing stored), and the failed judged dims are asked again through `rejudge_result`, which spends and lands them with `apply_rejudge`. One result per call, where the re-check took a run: a host re-grading a run calls it per result (`list_results`). A run still being written is refused. The action catalogue gains `result_regrade` (write; `result_id`, `checks`, `judges`, `apply`), which never asks a judge: applying over it while a judged dim would be asked is refused, so a host re-asks those through `regrade` itself. To keep the declared surface at 450, `threetears.evals.kernel.host.CANDIDATE_MODEL_LEVER` is `provisional` (it was `stable`; still exported from `kernel.host`, and the toy host's run path still imports it).",
    "Since `.28`, a stored verdict is graded again through one door, `threetears.evals.run.regrade` (new, `stable`), the successor of `recheck_goal_states`, which `.27` removed with `run/recheck.py`: `await regrade(host, result_id, scope_id, *, checks=True, judges=True, apply=False)` re-grades one stored result's check dims (its goal checks) from what its cell stored (the trace's call ledger and end state, the result's world events, its case's variation) through `grade_goal_checks`, keeping as stored, with why, every outcome it cannot re-grade from that (the re-check's rules, unchanged), and names its judged dims whose judging failed, each held to `reproducible_judge_inputs` (over `JudgeInputStore`) before anything is written or spent. It returns a `Regrade` (new, provisional): every dim whose verdict moved, old beside new (`RegradedDim`, new, provisional: the check's expression or the judged dim, `graded_by` `check` or `judge`, `was`, `now`, `detail`), the outcomes kept as stored, the failed judged dims, and why either half re-graded nothing. It writes nothing unless `apply=True`: then the moved check verdicts are stored, conditional on the result as read (a race is a `ConflictError`, nothing stored), and the failed judged dims are asked again through `rejudge_result`, which spends and lands them with `apply_rejudge`. One result per call, where the re-check took a run: a host re-grading a run calls it per result (`list_results`). A run still being written is refused. The action catalogue gains `result_regrade` (write; `result_id`, `checks`, `judges`, `apply`), which never asks a judge: applying over it while a judged dim would be asked is refused, so a host re-asks those through `regrade` itself. To keep the declared surface at 450, `threetears.evals.kernel.host.CANDIDATE_MODEL_LEVER` is `provisional` (it was `stable`; still exported from `kernel.host`, and the toy host's run path still imports it).",    "Since `.29`, an OpenRouter reply whose usage carries no `is_byok` is unpriced: the completion's `cost_usd` is `None`, its `price_source` is `None` and its `pricing_failure` is \"OpenRouter's reply carried no is_byok, so its cost may be OpenRouter's fee alone\". It used to be priced at `usage.cost` as a normal-key call, which understates a bring-your-own-key call, where `cost` is OpenRouter's fee alone and the upstream's charge is `cost_details.upstream_inference_cost`; a reply that does not say which it is cannot be priced from `cost`, and a host cannot compose around it, since a `Completion` carries no raw usage. A reply stating `is_byok: false` is priced at `cost` (`openrouter:reported`) and one stating `is_byok: true` at `cost` plus the upstream figure, as before; a value that is not a bool counts as absent. OpenRouter sends `is_byok: false` on a normal key, so a live client sees no change; a host's test double or recording of an OpenRouter reply that carries `cost` adds `\"is_byok\": false` to its usage. A stored completion is not repriced.",
    "Since `.29`, a report reads result first, in tables and plain words; `bundle.json` is unchanged, and `report.html` and `report.md` change throughout. The title is the declared question in plain words (or the campaign's name and what it compares); line 2 names each arm once, by its given label with its model (`deepseek-v4.1-flash (production, control)`), then the date (the old basis line is gone; the design's declaration is a Methods row); the verdict line leads with the result, a declared decision rule read clause by clause (`threetears.evals.analysis.report.decision`, new) or one arm's `n/N cases passed`; the case floor is a caveat under the scoreboard. The scoreboard's columns are `arm, ran, [lost], usable, passed, check, judged, [other], cost` (counts and the cost per reply, no sentences; it was `lost`, `usable`, `passed`, `failed` and `reply` as words). A finding is one sentence and a table pivoted arm by reading (`evidence`'s columns are `arm`, `reading_<n>`, `cases`), its facts a `finding_facts` table in an `Evidence` fold. The contrasts table shows only contrasts that can resolve (`Result.contrasts()` and `contrast_rows(bundle)` still return every one), its statistics fold names a question `Q<n>`. Trials are a `trials` table and one closed fold each. Methods are a `methods` table and the engine's disclosures, folded (`DisclosureBlock.fold`, `TableColumn.term` and `TrialBlock.why` are new; `SECTION_TITLES` gains `decision` and `glossary`, and `contrasts` and `methods` are retitled). Arms are named through `threetears.evals.analysis.humanize` (new, stable), never `axis=level`: `Verdict.arm`, `Verdict.control` and the rows of `Result.contrasts()`, `guardrails()` and `strata()` carry the label (`v2`, not `candidate=v2`). `lint_prose`, `StyleViolation` and `GLOSSARY` (new, stable) are the rules every rendered sentence and a memo's are held to; a memo sentence breaking one is dropped or replaced at render, and what is left is counted in Methods (`style: N violations`). The writer's seed prompt states those rules in place of its old style list, so a stored copy reads drifted. A printed run summary counts the measures no result carries in one line. `OPEN_TRIALS` and `basis_line` are removed (unreleased). To hold the declared surface at 450, `threetears.evals.quick.ENGINE_COMMANDS` and `build_parser` and `threetears.evals.kernel.extract_json_array` and `fold_phase_timings`, imported by no guide, example or example host, are `provisional` now, still exported from the same roots.",
    "Since `.29`, a declared decision rule settles `switch` only on sampling evidence: a rate clause needs every arm at the case floor and the bundle's contrast interval bounding the drop within the margin, a cost clause the cost contrast's interval wholly below zero; `keep` still settles on what the run observed. `evaluate_rule` on bare counts now returns `unsettled` where it returned `switch` (`RateReading.interval`, `RuleReadings.control_cases`, `candidate_cases` and `cost_interval`, `ClauseVerdict.rate` and `RuleVerdict.readings` are new, all defaulted). The verdict line states plain counts with each arm by its model (`verdict_line(model=)` and `rule_sentence(control_model=, candidate_model=)` are new keywords). `humanize` leaves a check expression as written, and a goal check's heading is its expression as code, not `Pass rate of ...` (`Verdict.heading`, the `reading` of `Result.contrasts()`). Money is written `$0.0031` where it was `0.0031 usd`. In `report.md` and `report.html`, findings carry no `F<n>` (the `evidence` table is titled `Readings`, and the `coverage` table's `findings` cites headlines), the decision table heads each arm's column by name, Not tested lists readings in `unasked` and `no_margin` tables, and `GLOSSARY`'s `settled` and `control` are reworded.",
    "Since `.29`, `threetears.evals.analysis.MIN_CASES` (the case floor, 5: below it no rate or difference is estimated) is `host-contract` (it was `provisional`), since a host's seed gate holds its templates to it. To keep the declared surface at 450, `threetears.evals.quick.DEFAULT_PROG` is `provisional` (it was `stable`; still exported from `quick`).",
    "Since `.30`, `threetears.evals.run.SeedCaseSet` is `host-contract` (it was `provisional`): a host's production seed builds it in memory (`SeedCorpus(case_sets=...)`) as well as reading it from `case_sets/*.json`, so it moves only with a deprecation cycle. To keep the declared surface at 450, `threetears.evals.kernel.host.WorldConformanceReport` is `provisional` (it was `stable`; still exported from `kernel.host`).",
    "Since `.30`, a new read action, `judge_cases_list` (`template_id`), lists a judge template's stored cases in stored order: each case's id, criterion, author and expected verdict (for a hand-written case), label count, and whether it is live. It is read-only and also mounted by `read_only_tools()`. A host that wants a case set over every case of a template reads the ids from it and passes them to `case_set_mint`. A seed corpus's case `name` is not stored with the case, so the listing does not show it.",
    "Since `.30`, a frontier point's pass^k over fewer than `MIN_CASES` (5) cases states no figure (`pass^1 over 3 case(s), too few to state as a rate (a rate needs 5)`), not even an interval; it used to print a rate and an interval at any case count. `Frontier` data (`pass_hat_k`, its interval) is unchanged: only `frontier_text`, and what an action or the CLI prints from it, differs.",
    "Since `.30`, a memo page prints no answer line for a declared question whose decision rule settled every clause: the verdict line and the decision table answer it (`.29` printed `**Answered.** See the decision rule above.`). Where the rule settled with a clause still open, the one line is `**Partly answered.** Still open: whether <clause>.` (resolution `partial`). A memo answer that contradicted the rule is still disclosed in Methods.",
    "Since `.30`, where a clause of the declared rule settled a finding's one reading, a finding sentence saying the evidence cannot confirm, establish or show that difference (a narrow set of phrasings, such as `cannot statistically confirm`, `did not separate`, `not statistically significant`) is replaced by code's counts, candidate first, and under the case floor that only the size of the difference is not estimated (“Cheaper candidate passed 6 of 12 on `call_count(\"music.queue_track\") >= 2` to production's 11; too few cases to estimate how large the difference is.”); each replacement is disclosed in Methods. A title on such a reading reads that sentence where it read `...; the difference did not separate.` A goal check's held count (`6 of 12`) restated in a finding's body is now dropped like any measured count. `RateReading.measure`, `RuleVerdict.settles` and `RuleVerdict.settles_cost` (in `threetears.evals.analysis.report.decision`) are new and defaulted.",
    "Since `.30`, a line under the scoreboard says when an arm's label carries a cost or speed comparative its own row contradicts against the control (`The label 'cheaper candidate' says cheaper; it cost more per reply than production.`). Cost words are read on cost per reply; speed words on turn time, only where both arms' latency was read serially. The words are `threetears.evals.analysis.style.LABEL_CLAIMS` (new). Rename the arm, or keep the label and read the line.",
    "Since `.30`, the writer's seed prompt (`EVAL_ANALYSIS_GEN_DEFAULT`) adds one style line, never dispute a decision rule code settled and scope any doubt to how large the difference is, and tightens three sentences to stay within its 24,000-character budget. A stored copy of the writer prompt seeded from an earlier release now reads drifted (`prompt_drift`); reseed the preset, or add the line by hand, to take it. The `generate_analysis` fixture replays under the prompt frozen beside its recording, so nothing was re-recorded.",
    "Since `.30`, a declared decision rule settles `switch` on a rate clause only on the contrast's bounded interval (`FamilyComparison.bounded_interval`, the bounded test's on the rate's 0-1 range at its family's level, the interval a guardrail's `held` reads), for the overall pass rate and each check's; never on the t interval the Contrasts table prints. A `.29` page that settled `switch` on a check clause did so on an interval that overstated its confidence: simulated at the margin it said `switch` up to 14% of the time against the 2.5% it states (`docs/measuring-soundly.md`). Read such a page again under `.30`; on a handful of cases expect `unsettled`, since only a sweep settles a 10-point clause on seven cases.",
    "Since `.30`, the bundle is shape 55 (`schema_version`). Each family comparison carries `bounded_interval` (None where the reading declares no range or no test ran), and the overall pass rate is compared as a reading of its own: `reading` `trial`, `name` `passed`, one value per case (the share of its usable trials that passed, as the scoreboard classifies them), in the family of each live question whose decision rule has a rate clause, so that family's `family_size` grows by one and every adjusted p in it moves over unchanged runs. `FamilyComparison.reading` and the report's `Verdict.reading` take `trial`, so a host reading `reading` meets a third value, and the page names it \"the pass rate\". The analysis writer is not shown `bounded_interval`.",
    "Since `.30`, a bundle stored before shape 55 still loads and renders, and its fingerprint moves on reload (the new field is written as null). Its rate clause reads `unsettled` (\"this bundle predates the interval a switch needs\") and never falls back to the t interval; assemble it again to read `switch`.",
    "Since `.30`, a rule's rate clause reads every check: a goal check, which the bundle carries as a mean of 0s and 1s, is read as its count (mean times observations), and a label check's rate reads the `accuracy` contrast. Until `.30` neither had an interval the rule could find, so a check clause could not settle `switch` at all. The Decision table lists each check under its clause.",
    "Since `.30`, a seeded definition can be brought up to date. The boot seed stays fill-only; a release step or an operator reads drift with `threetears.evals.run.definition_drift(host, corpus, seeded_digests=None)` (new, `host-contract`), which reads every corpus template, rubric dim, judge config, judge case and case set `current`, `stale` (stored is what was seeded, the corpus moved), `customized` (changed since seeding: an edit, an archive, a delete), `unknown` (no record of what was seeded) or `absent`, writes nothing, and prints with `.summary()` (`drift: 3 stale, 0 customized, 1 unknown, 0 absent, 40 current`) and `.render()`. `threetears.evals.run.reset_definitions(host, corpus, keys, *, require_known_tools_allowed, refuse_undeclared_world_seed, refuse_undeliverable_template, overwrite_customized=False, seeded_digests=None)` (new, `host-contract`) writes the corpus's content for the named keys (`drift.keys(\"stale\")`), all or nothing after every check, refusing a `customized` or `unknown` one unless `overwrite_customized=True`. `threetears.evals.actions.definition_drift_actions(corpus, *, ...)` (new, `host-contract`) gives a host `definitions_drift` (read) and `definitions_reset` (write) for its catalogue. The result types (`DefinitionDrift`, `DefinitionReading`, `DefinitionReset`, `ResetDefinition`, `DefinitionState`), `definition_key` and `corpus_digests` are new and `provisional`. To keep the declared surface at 450, `threetears.evals.analysis.CampaignReadStore`, `CaseResult` and `LabelStatistics` are `provisional` (they were `stable`; still exported from `analysis`).",
    "Since `.30`, a reset never edits in place: a template's new content is its next revision, a new record under the same name (`EvalTemplate.revision`, 1 for every template stored before), and the revision it supersedes is archived and stays readable by id, with every run, result and case of it. `EvalStorage.load_template_by_name`, and so the seed and any lookup by name, resolves a name to its newest non-archived revision (it took the first record the store returned). A judge case resets with its judge template: the new revision holds the corpus's whole battery, and the corpus's case sets over it are minted again over it (`mint_case_set` now accepts a newer revision of the latest version's template, and takes `seed_digest`). A rubric dim or judge config reset writes a new record under its key and archives the old one. A campaign holding runs of two revisions of one template is refused at `campaign_create`, at `campaign_runs_add` and when its bundle is assembled (every analysis and report), naming the template and each revision: their results are two datasets. Two templates that only share a name at one revision number (two authored separately, each revision 1) are not revisions and are not refused. A two-run comparison names a later revision as `<name> (revision N)`.",
    "Since `.30`, the boot seed no longer adds a judge case to a judge template that already holds cases: a corpus case that is new, or whose words or verdict changed, used to be frozen beside the stored ones in the same template, so the template's live cases (what a launch of it runs) changed under one id and runs from before and after that boot pooled. The seed now fills a case only into a judge template revision that held no cases when the pass began (one it created in that pass, or an empty one); any other is not written, and `SeedOutcome.needs_reset` (new, with `total_needs_reset`) names it under `judge_case` as `<judge template>/<case name>`, with any new case set listing it under `case_set`, on every boot. `summary()` says `NOT WRITTEN, A STORED DEFINITION WOULD CHANGE: RESET IT`. The drift read shows that judge template `stale`, and `reset_definitions` writes its next revision holding every corpus case. A host whose release process relied on a boot adding hard negatives to a live judge template runs the reset as a release step instead. Templates, rubric dims, judge configs and case sets are still filled whole into empty slots only.",
    "Since `.30`, every definition the seed writes records what it wrote, under durable schema v15.3 (additive): `seed_digest` on `EvalTemplate`, `CatalogRubricDim`, `JudgeConfig` and `CaseSet` (the content digest, never ids, revision numbers or timestamps), and `seed_name` on a seeded judge `EvalTestCase` (its corpus name; its `content_hash` is what was seeded). Rows seeded before `.30` carry neither and read `unknown` when they differ from the corpus; a host that knows what it seeded then computes `corpus_digests(host, corpus)` over that corpus from its own history and passes the result as `seeded_digests`, and those rows read `stale`. `seed_digest` and `revision` are server fields that `create_template` and `update_template` ignore, and a judge config's re-authoring keeps its `seed_digest`, so an edited seeded definition reads `customized`.",
    "Since `.30`, `Model.price_ceiling` is a true upper bound or `None`; it used to price only the base prompt and completion rates, below the bill on a long prompt past a long-context tier, a reasoning rate above the completion rate, or a per-request fee. It now prices every price the catalogue row lists: a prompt token at the highest of `prompt`, `input_cache_read`, `input_cache_write` and `input_cache_write_1h`; an output token (reasoning included, within `max_tokens`) at the highest of `completion`, `internal_reasoning`, `image_output` and `audio_output`; plus `request`; and a tier in `overrides` wherever the prompt bound reaches its `min_prompt_tokens` (a time-of-day tier is taken to apply). Image and audio input prices are for inputs the client never sends, and `web_search` for searches it never asks for. The prompt bound counts each text's UTF-8 bytes after NFKC normalisation where that is longer, and the directive as JSON. Expect higher ceilings on models with cache-write rates or tiers, so a cap admits fewer calls at once; a launch whose largest call now prices above its cap is refused before it runs.",
    "Since `.30`, `Model.price_ceiling` answers `None`, never a lower figure, for a row listing a price it cannot bound: a price name it does not know the unit of (nonzero), a price that is not a number, tiers that are not a list, or `web_search` on a model that takes `web_search_options` and so may search unasked (Perplexity's `sonar` rows). Each reason is logged once per model at WARNING (`eval.providers price_ceiling cannot bound a call`). `Catalogue.ceiling(model_id, *, prompt_tokens, output_tokens)` (new) returns `(ceiling, None)` or `(None, why)`.",
    "Since `.30`, `Model.price_ceiling` answers `None` once the catalogue's rows are `Catalogue.ceiling_stale_after` old (new keyword `Catalogue(ceiling_stale_after=None)`, which is `refresh_after`, six hours, unless given; below `refresh_after` is a `ValueError`, since rows past it would not be due a refresh), so an enforced cap never holds a call against old prices. A completion is still priced from them and carries `pricing_stale_since`, as before. Rows do not reach that age by the host sitting idle: before the engine prices a call, out of a run (`start_paid_call`, analysis generation and its estimate, case generation and its quote, the judge repeat, second-judge and temperature work and estimates) or in one (a `CappedCompletion` call, a cell's judge calls, the judge kind's call), it awaits the client's `refresh_prices()` (new, optional; `Model.refresh_prices()` loads the catalogue and refreshes rows past `refresh_after`, never raising), so only a refresh that failed leaves them past the bound. Under an enforced cap a `None` ceiling does not switch enforcement off: an out-of-run call is refused before it is sent (`price_ceiling returned None`), and a call in a run holds no reservation and is made only while the run's cap is not yet reached, so such calls can pass the cap by about one call per running cell. No timer is needed; a host that wants to ride out a short outage refreshes more often than the bound (`refresh_after=timedelta(hours=1), ceiling_stale_after=timedelta(hours=6)`). A host that admits an out-of-run call itself (`OutOfRunBudget.admit` beside `plan_draft`) awaits `refresh_prices()` on the client first, or `start_paid_call` does it.",
    "Since `.30`, loads of one `Catalogue` made while a load is in flight share it: one fetch, whose result or error every caller sees. During a failing first fetch, N callers made N fetches one after another; they now make one. A caller cancelled while waiting cancels only its own wait.",
    "Since `.30`, `Model` takes `timeout=` (seconds or an `httpx.Timeout`; `None` keeps 600 seconds a request, 20 to connect) and `headers=` for the client it opens itself. Beside `http=` either is a `ValueError`: a client handed in is used as built, with its own timeout and headers. The provider's key and version headers, set on each request, win over a header of the same name. `derive()` and `Clients` carry both. The catalogue's own fetch timeout is exported as `threetears.evals.providers.CATALOGUE_FETCH_TIMEOUT_S` (new, provisional, `30.0`): a host handing `Catalogue(http=...)` its own client sets that client's timeout to it.",
    "Since `.30`, `threetears.evals.kernel.extract_json_array` and `fold_phase_timings` are `stable` again (`.29` made them `provisional`): a production host imports both. To keep the declared surface at 450, `threetears.evals.kernel.ExclusionCause` and `threetears.evals.schema.RefusedCall` are `provisional` (they were `stable`; still exported from the same roots), imported by no guide, example, fixture or production host.",
    "Since `.30`, a client of your own may offer `async refresh_prices()`; the engine awaits it before it prices a call on that client, so rates that go stale can be brought up to date where `price_ceiling`, being synchronous, cannot. A client without one is priced as before. `RecordedCompletions` forwards it to the client it records.",
    "Since `.30`, a catalogue-priced completion (a direct Anthropic, OpenAI or OpenAI-compatible call; `price_source` `openrouter-catalogue:<id>`) counts reasoning tokens, tiers and the request fee: it is priced from the same reading of the row as the ceiling, at the tier its prompt fell in, its reasoning tokens at `internal_reasoning` where the row lists that apart from `completion`, its cache reads at `input_cache_read` and its writes at `input_cache_write` or `input_cache_write_1h` (Anthropic's `cache_creation` split), plus `request`. Before, every token was priced at the base `prompt` and `completion` rates, so stored costs of earlier such calls may be low: a prompt past a long-context tier, reasoning on a model with a dearer reasoning rate, or a row with a request fee. Where a price applies that the reply cannot price (reasoning tokens a reply does not split out, on a row pricing them apart) or the row lists one the client cannot read, the call is unpriced with `pricing_failure` saying why, never priced lower. `;cache-approximate` now marks only a cache share priced at a rate the row does not list for it (the plain prompt rate, or the dearer write rate when the reply does not split writes by lifetime), not every call that touched a cache.",
    "Since `.32`, `Model` takes `transport=` (an `httpx.AsyncBaseTransport`, `None` for httpx's own) for the client it opens itself, beside `timeout=` and `headers=`; `aclose()` closes that client and, as httpx does, the transport it was opened on, so a transport shared between models is closed by the first one closed. `own_http=False` (new) says whether a client handed in with `http=` is the model's: `True` makes `aclose()` close it, replaying too. `transport=` beside `http=` is a `ValueError`, as `timeout=` and `headers=` are, and so is `own_http=True` without `http=`. `derive()` never carries `own_http`: a derived model, and so each `Clients` role built from a `Model`, sends through the template's client (the one handed in with `http=`, or the one it opened on its `transport=`) without closing it, so `Clients.aclose()` leaves the template's transport open. `Clients` takes `own_http=False` (new) for its own `http=`: `True` makes `Clients.aclose()` close it after every model. A host that wrapped a model only to close the client it handed in hands `own_http=True`, or `transport=`, and drops the wrapper.",
    "Since `.32`, one request reads the price catalogue once. The read a model's `refresh_prices()` makes belongs to the task that made it: that task's `price_ceiling` and its next `generate` price from it, and the `generate` consumes it, so a refresh that failed, a first read included, is not fetched again by the call it was made for: it was fetched twice, the second time by the call. A call from any other task (a child task that inherited the context included), a call after the one that consumed it, a call made without a refresh, and any call once the read is older than `ceiling_stale_after`, read for themselves. A call whose first read failed is unpriced with the same `pricing_failure`; a failed refresh of rows held prices the call from them, `pricing_stale_since` set, and leaves `price_ceiling` `None` once they are past `ceiling_stale_after`, as in `.30`.",
    "Since `.32`, a price-catalogue read says what it found: `threetears.evals.providers.PriceRefresh` (new, host-contract, a frozen keyword-only dataclass: `refreshed: bool`, whether this read fetched the rows anew; `fetched_at: datetime | None`, when the rows held were fetched, UTC, `None` while none are; `failure: str | None`, why the prices are not current, naming the error's class and message, from a first read that failed (`fetched_at` `None`) or a refresh that failed (the rows kept, stale), else `None`). `Model.refresh_prices()` returns it (it returned `None`) and keeps it as `Model.last_price_refresh` (new, read-only, `None` before the first; a call's own read leaves it); replaying, it is nothing read and no failure. `Clients.refresh_prices()` (new) reads the one catalogue every role shares, once, and returns one `PriceRefresh` for all of them; a role's lease returns its model's. `Catalogue.fetched_at` (new) and `Catalogue.read()` (new: `load()`, returning the outcome rather than raising) are what they are read from. A host that wrapped `refresh_prices()` to observe a failed first read reads `failure` with no `fetched_at` instead. The warning a failed first read logs is now `eval.providers catalogue unread url=<url>: <why>`, from the catalogue, not naming the model.",
    "Since `.32`, `threetears.evals.providers.Provider` is `provisional` (it was `stable`): no host imports the Literal, which `Model`'s signature still reaches and the root still exports.",
    "Since `.32`, a host's three template checks are one value on its host: `TemplateChecks(require_known_tools_allowed=, refuse_undeclared_world_seed=, refuse_undeliverable_template=)` (new, `host-contract`, in `threetears.evals.kernel.host`), passed as `EvalHost(template_checks=...)` (new field, default `None`). `create_template`, `update_template`, `seed_eval_definitions` and `reset_definitions` no longer take the three keywords: each reads them off the host it is handed, and refuses with `RefusedInput` when the host supplies none. `definition_drift_actions(corpus, *, seeded_digests=None)` no longer takes them either: `definitions_reset` reads them off the host each call is made in, so the factory needs no host to exist when the catalogue is mounted. To port: build the host with `template_checks=TemplateChecks(...)` of the three callables you passed, and drop them from every call.",
    "Since `.32`, the definition seed has a `template_cases` slot for a template's own cases (a scenario to play, an input to classify): `SeedCorpus.template_cases` (new, a tuple of `SeedTemplateCase`, new, `host-contract`, from `threetears.evals.run`), read by `load_seed_corpus` from `template_cases/*.json`, a case named by its file unless it names itself. A `SeedTemplateCase` names its `template` (one the corpus carries, not of the judge kind) and carries the case's `variation_params`, `host_payload` and `stratum`. The seed writes each into its template's current revision after the templates, with its name as `EvalTestCase.name` and `seed_name`, its content digest (over `variation_params` and `host_payload`, never `stratum`, which is no part of a case's identity, as for a generated case) as `content_hash` and the id derived from it, and the drift digest of all three (`template_case_digest`) as `EvalTestCase.seed_digest` (new, durable v15.5, additive, default `None`), so a stratum the corpus relabels reads `stale` and one an operator relabels reads `customized`; reported under `template_case`; as for a judge case, only into a revision holding no cases when the pass began, so a new or changed case for a revision already holding cases is withheld under `needs_reset`. A drift read reads each (`template_case/<template>/<name>`) as it reads a judge case, and a reset writes them with the template's next revision, so a host no longer writes them through its own seed in the same call. `SeedCorpus` refuses a template case naming a template it does not carry or a judge template, and two of one template under one name or with one content.",
    "Since `.32`, `templates_list` shows each template's `revision` (`TemplateLine.revision`, new and required; `judge_template_create` returns it too).",
    "Since `.32`, `threetears.evals.analysis.StyleViolation`, `GateOutcome` and `GateToken`, and `threetears.evals.schema.EvalCaseStratum`, are `provisional` (they were `stable`; each still exported from its root, and each a type a declared signature reaches): no host imports them.",
    "Since `.32`, a definition reset's overwrite flag is `overwrite_customized` (it was `discard_customization`, with no alias), on `threetears.evals.run.reset_definitions` and the `definitions_reset` action alike: it says what it does to a definition reading `customized` or `unknown`. To port: rename the keyword, or the action's argument.",
    "Since `.32`, every name `docs/adopting-a-host.md` tells a host to call, build, catch, type against or read is `host-contract` (each was `provisional`), and `tests/test_guide_names_are_declared.py` holds the rule: `threetears.evals.run.corpus_digests`, `DefinitionReset` and `load_seed_corpus`; `threetears.evals.providers.CATALOGUE_FETCH_TIMEOUT_S`; `threetears.evals.kernel.CappedCompletion`, `CostCapReached`, `strict_response_format`, `UnportableSchema` and the store ports `RunStore`, `ResultStore`, `RunRecordStore`, `DefinitionStore`, `CassetteStore` and `JobStore`; `threetears.evals.kernel.host.MemberActsOn`; `threetears.evals.analysis.READ_TIER_ROW_BUDGET` and `REPORTER_KIND_CONTRACT`; `threetears.evals.schema.JUDGE_WORDING_CHANGE_SENTENCE` and `StoreCalledOnEventLoop`; and `threetears.evals.actions.render_jobs_started`.",
    "Since `.32`, nothing a host imports is `provisional`: `tests/fixtures/host_imports/` holds each host's import list (`discodon.txt`, the production host's), and `tests/test_host_imports_are_declared.py` fails on a listed name that is `provisional` or no root exports. These are `host-contract` (they were `stable`): `kernel.FIND_TEMPLATE`, `kernel.SEED_REMEDY`, `kernel.KIND_TEMPLATE`, `kernel.KIND_TEXT`, `schema.PROSE_SCHEMA_KEY`, `schema.nested_schemas`, `schema.RESERVED_DIM_IDS`, `schema.NON_TERMINAL_RUN_STATUSES`, `run.SCHEDULER_CALL_ATTEMPTS`, `run.SIMULATOR_MAX_TOKENS`, `run.SIMULATOR_ANSWER_BUDGET_TOKENS`, `run.MeteredCallTally`, `run.metered_cell_tally`, `run.fold_metered_cell`, `run.precondition_failure_text`, `run.refuse_ignored_template_fields`, `gen.PROPOSER_MAX_TOKENS`, `analysis.generation_ceiling_s`, `analysis.judge_phase_ceiling_s`, `ops.run_label`, `analysis.humanize`. These are `stable` (they were `provisional`; nothing about them changes but the promise): `actions.ConformanceSample`, `actions.Refusal`, `analysis.ABSENT`, `analysis.AS_RECORDED_MODEL`, `analysis.ReporterLabel`, `analysis.first_request`, `analysis.freeze_reporter_case`, `analysis.prompt_content_version`, `analysis.serialize_report`, `gen.EVAL_BOUNDARY_GEN_TEMPLATE_DEFAULT`, `gen.EVAL_PROPOSER_TEMPLATE_DEFAULT`, `kernel.ACCURACY_MEASURE`, `kernel.ENGINE_FAMILIES`, `kernel.FIND_CAMPAIGN`, `kernel.FIND_RUN`, `kernel.INCOMPLETE_STOP_REASONS`, `kernel.METRIC_DESCRIPTORS`, `kernel.MeasureSummary`, `kernel.TURN_BUDGET_ENDED_KEY`, `kernel.WorldSessionError`, `kernel.classifier_label_measure`, `kernel.count_substituted`, `kernel.count_substituted_deliveries`, `kernel.host.BarRegistrationError`, `kernel.host.CANDIDATE_MODEL_LEVER`, `kernel.host.MeasureRegistrationError`, `kernel.host.WorldConformanceReport`, `kernel.judge_case_of`, `kernel.production_replicating_cost`, `kernel.resolve_variant_identity`, `ops.CaseSetLine`, `ops.CaseSetMint`, `ops.JobHandle`, `ops.JudgeCaseAuthor`, `ops.await_job`, `ops.case_set_mint`, `ops.case_sets_list`, `ops.judge_case_author`, `ops.reporter_case_archive`, `ops.run_job_id`, `run.LaunchGroup`, `run.callers_missing_the_constructor`, `run.launch_as_group`, `run.mint_case_set`, `run.rejudge_result`, `run.resolve_constructor`, `schema.CORE_RESET_DOC_TYPES`, `schema.CaseSetRef`, `schema.utc_now_iso`, `testing.JobsConformanceCase`, `transports.fastmcp.CatalogueTool`. `threetears.evals.storage.ROUTING_RECORD_DOC_TYPE` stays `stable`. With the typed decision rule's four names promoted beside them, the declared surface is 523 names (`DECLARED_CEILING`, 450 before).",
    "Since `.32`, a question declares its decision rule typed, not in prose: `Question.decision` (new, default `None`) is a `DecisionRule` of `RateDrop(max_points, reading=None)` and `CostLower()` clauses, all four `host-contract` in `threetears.evals.kernel` (`Question` was `stable`). `max_points` is above 0 and below 100 and a rule holds at least one clause; a `RateDrop` with no reading reads every pass/fail reading the arms share, the overall pass rate included, and with one it reads that goal check (its verbatim text), measure or capability pass/fail judged dimension (its key) alone. The settling logic is unchanged. The prose parser is removed with no alias (`parse_decision_rule`, `split_decision_rule`, `RuleClause`, the `unread` clause kind and the text-carrying `DecisionRule`). A live question whose text says `Decision rule:` and declares no `decision`, or a `RateDrop` naming a reading the campaign does not measure, is refused where the design is declared (`DesignRefused`, from `threetears.evals.kernel`, its remedy listing every reading the rule may name); a stored question of that shape still loads, its Decision section says the prose rule is no longer read, and its verdict is exploratory. The page writes the rule, and each clause's reason, as a sentence with the arms' names. Core schema is v15.3 (`CORE_SCHEMA_MINOR` 3, additive: `Question.decision`), and the bundle shape moves to 56 (57 with the change below). To port: replace a question's `Decision rule:` sentence with `decision=DecisionRule(...)`.",
    "Since `.32`, a model lever read off what ran (`observed_model_levers`) counts only the results that made a call in that role, and one fewer than two results exercised across the campaign is no level and no lever: it leaves the aliasing read, the factor pairs, the divergences, the coverage map and the next steps, and is listed in the bundle's `unexercised_factors` (new), which Not tested states in one line. The bundle is shape 57; a bundle stored before it still loads, its fingerprint moving on reload. On rung 0 a bool scorer or field grader is a pass/fail check (`MetricDescriptor.pass_fail`, new, default `False`), so a case passes when every check its template declares passes, on the console as on the page, and the console counts cases with the page's trial reader. The Markdown report quotes a trial's text in a fence longer than any backtick run inside it, writes a trial's summary on one escaped line, and escapes the block markers in an author's words; every other string a trial's record carries (why it failed, a failed check's name and expression, the judge's dimension, criterion and reason) is quoted as a fence or a code span chosen by its content. A lever the campaign declared as an axis is a level by declaration whatever its calls, on every reader.",
    "Since `.32`, a decision rule reads each true/false reading on its better end, so a lower-is-better measure's passes are its false count, and a pass/fail scorer or grader is a rate a rule reads and a reading a `RateDrop` may name, its passes the trials it passed; the page's readings and the declaration's offer read one list.",
    "Since `.32`, `threetears.evals.run.Ceilings` (new, `host-contract`, a frozen dataclass no field of which the caller sets) carries the package's inner ceilings a host derives its outer budgets from: `scheduler_call_attempts`, `simulator_max_tokens`, `simulator_answer_budget_tokens` and `proposer_max_tokens` (the values of `run.SCHEDULER_CALL_ATTEMPTS`, `run.SIMULATOR_MAX_TOKENS`, `run.SIMULATOR_ANSWER_BUDGET_TOKENS` and `gen.PROPOSER_MAX_TOKENS`), and `generation_ceiling_s` and `judge_phase_ceiling_s` (`analysis`'s functions of those names). The six names stay exported and `host-contract` in `.32`; `.33` drops them (the `.33` note below). To port: read each from `Ceilings()` instead.",
    "Since `.33`, a stored case is renamed through the package: `threetears.evals.ops.case_rename(host, scope_id, case_id, name)` (new, `host-contract`, over an `EvalHost`) writes the case's `name` and nothing else, through the store's write path for a case, and answers with a `CaseRenamed` (new, `host-contract`: `test_case_id`, `old_name`, `new_name`). The case keeps its id, its `content_hash`, its results and its `seed_name` and `seed_digest`, and the report calls it by the new name. It refuses a name `humanize(\"case\", name)` would not print (`ValidationFailedError`: spaces, a bare number, a generated id, over 40 characters), a name another case of its template or of a case set listing it carries (`ConflictError`), and an unknown case (`NotFoundError`). A new write action, `cases_rename` (`test_case_id`, `case_name`), makes the same write with the same refusals. A host that renamed a case by writing its document directly calls this instead. With the two promoted, the declared surface is 525 names (`DECLARED_CEILING`, 523 before).",
    "Since `.33`, `TemplateChecks` takes a fourth field, `kinds` (required, no default): the host's launch registry by kind name, the mapping its `LaunchHost` is built with (typed `Mapping[str, IgnoresTemplateFields]`, a structural protocol new in `threetears.evals.kernel.host`, `provisional`, which `LaunchableKind` satisfies). `create_template`, `update_template`, the boot seed (`seed_eval_definitions`), a definition reset and its drift read now refuse a template stating a field its kind's entry ignores (`LaunchableKind.ignored_template_fields`) through `refuse_ignored_template_fields`, with the message the launch dispatch gives; an update is held to it over the merged template unless it only sets `archived`, as `refuse_undeliverable_template` is. A kind the registry does not carry is refused nothing at authoring (its launch is refused by name). A host builds its `TemplateChecks` with `kinds=` its registry and drops its own call to `refuse_ignored_template_fields` from `refuse_undeliverable_template`. `refuse_ignored_template_fields` is removed from `threetears.evals.run` with no alias: it lives in `run.authoring`, its second parameter typed `IgnoresTemplateFields` (which a `LaunchableKind` still is), and the package calls it on every path that admits a template, so a host has nothing to call. The production host's import list no longer holds it (`tests/fixtures/host_imports/discodon.txt`).",
    "Since `.33`, `case_rename` takes `corpus=` (keyword, default `None`): the host's seed corpus for the scope (`load_seed_corpus`). Definition drift finds a template case stored before seeds recorded `seed_name` by its name, so when the corpus names the case that way, the rename records its old name as `seed_name` in the same write, and a seeded case renamed and then customised reads `customized`, not new to the corpus; a case drift would not find by name takes none. `OpsHost` gains `seed_corpus` (a `Callable[[str], SeedCorpus]` by scope id, default `None`), which the `cases_rename` action reads. A host that seeds template cases wires it (`OpsHost(..., seed_corpus=lambda scope_id: load_seed_corpus(<its directory>, scope_id))`); without it, a rename of such a case leaves drift reading it as new to the corpus.",
    "Since `.33`, a case can be written conditionally: `EvalStorage.load_test_case_with_etag(test_case_id, scope_id)` (new) returns the case and the token a conditional write presents, and `save_test_case` takes `if_match=` (keyword, default `None`), refusing with `ConflictError` when the case was written since that read. `case_rename` writes this way, so a retirement or an edit landing between its read and its save refuses the rename rather than being undone. Both are on the `host-contract` protocol `DefinitionStore`: a host's own store implementing it adds the method and the keyword (an `EvalStorage` already has both). A quick call now fills a stored case's `name` only when the store holds none, so a renamed case keeps its name through the next run of the same quick eval. `CaseResult` gains `case_id` (required), the stored test case's id.",
    "Since `.33`, the six separate ceiling names `.32` kept beside `Ceilings` are removed from their roots with no alias: `threetears.evals.run.SCHEDULER_CALL_ATTEMPTS`, `SIMULATOR_MAX_TOKENS` and `SIMULATOR_ANSWER_BUDGET_TOKENS`, `threetears.evals.gen.PROPOSER_MAX_TOKENS`, and `threetears.evals.analysis.generation_ceiling_s` and `judge_phase_ceiling_s`. `threetears.evals.run.Ceilings()` carries the same values and functions, unchanged, as `scheduler_call_attempts`, `simulator_max_tokens`, `simulator_answer_budget_tokens`, `proposer_max_tokens`, `generation_ceiling_s` and `judge_phase_ceiling_s`. To port: read each from a `Ceilings()` instead of its old name. The production host's import list no longer holds them (`tests/fixtures/host_imports/discodon.txt`). With the six removed, and `refuse_ignored_template_fields` (above), the declared surface is 518 names (`DECLARED_CEILING`, 525 before).",
    "Since `.34`, a template whose every revision is archived is absent to the definition seed: it writes no template case into any of its revisions, and `SeedOutcome.archived` (new, `dict[str, list[str]]`) names each such case under `template_case`, keyed `<template>/<name>`, counted by `total_archived`. It was written into the newest archived revision. A case so withheld keeps `SeedOutcome.nothing_to_do` false.",
    "Since `.34`, the definition seed fills a stored template case's empty `name` from the corpus case of the same content (fill-only, never overwriting a name), and `SeedOutcome.named` (new, `dict[str, list[str]]`, counted by `total_named`) lists each under `template_case`, keyed `<template>/<name>`. A pass that only named cases is not `nothing_to_do`.",
    "Since `.34`, a name fill that does not land is recorded by cause rather than dropped: `SeedOutcome.name_fill_failed` (new, `dict[str, dict[str, str]]`, counted by `total_name_fill_failed`) maps each `<template>/<name>` whose fill the store refused (`StorageError`) to the store's reason, logged at WARNING; `SeedOutcome.name_fill_contended` (new, `dict[str, list[str]]`, counted by `total_name_fill_contended`) lists each whose conditional write lost to another writer (`ConflictError`), logged at INFO. Both are under `template_case`, `summary()` words both, either keeps `nothing_to_do` false, and the case stays nameless for the next boot to fill.",
    "Since `.34`, `TemplateChecks` takes a fifth field, `refuse_inadmissible_template_case` (required, no default): a callable handed each template case (`threetears.evals.kernel.host.TemplateCaseFields`, new, `host-contract`, which a `SeedTemplateCase` is) that raises `ValidationFailedError` to refuse. The seed, a definition reset and `case_rename` ask it before they write, and a refused case is written by none of them. To port: add `refuse_inadmissible_template_case=` to every `TemplateChecks(...)`, a function returning `None` for a host with nothing to refuse. A template case with a blank name is refused by each of the three before the host's check. `DECLARED_CEILING` is 519.",
    "Since `.34`, `threetears.evals.kernel.production_replicating_cost` takes `candidate_kind` (keyword, required, no default): the result's `EvalResult.candidate_kind`. For a judge-kind result (`JUDGE_KIND`) it sums the judge role, since the judge under test is the subject and is metered under that role alone; for any other kind, `None` included, it sums the candidate, inner agent and external roles as before. A host calling it passes `candidate_kind=result.candidate_kind`. Every surface reading the arm's own spend moves with it over a judge campaign, which read no cost before (#828): the report scoreboard's cost per reply, the `production_replicating_cost` measure a cost contrast tests and the decision rule's cost clause reads, a frontier point's cost, the telemetry rollup and a run summary's `mean_prod_cost_usd`.",
]
