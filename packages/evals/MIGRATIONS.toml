[[release.change]]
from = "threetears.evals.analysis"
to = "threetears.evals.analysis"
why = """`CampaignDesign.controls` is `held_fixed`, one letter from `control` no longer, and the bundle's reading of it is renamed with it (#639)."""
renamed = { ControlsReading = "HeldFixedReading" }

[[release.change]]
from = "threetears.evals.quick"
to = "threetears.evals.quick"
why = """The run summary's `MeasureSummary` is renamed so it no longer shares a name with the bundle's `MeasureSummary`, which `kernel` exports; one name in two roots meant two things (#702). `threetears.evals.quick.MeasureSummary` is not `kernel.MeasureSummary`."""
renamed = { MeasureSummary = "RunMeasureSummary" }

[[release.change]]
from = "threetears.evals.ops"
to = "threetears.evals.ops"
why = """The run summary's `MeasureSummary` is renamed so it no longer shares a name with the bundle's `MeasureSummary`, which `kernel` exports; one name in two roots meant two things (#702). `threetears.evals.ops.MeasureSummary` is not `kernel.MeasureSummary`."""
renamed = { MeasureSummary = "RunMeasureSummary" }

[[release.change]]
from = "threetears.evals.analysis"
to = "removed"
why = """No operation or action reached them, and `compare_runs` had no caller anywhere, tests included; it is deleted with its `ComparisonColumns` hook (#621). Comparing two runs is the `runs_compare` operation and action in `ops`."""
names = ["ComparisonColumns", "compare_runs"]

[[release.change]]
from = "threetears.evals.analysis"
to = "removed"
why = """Leaves every `__all__`: no operation or action reached it (#621). Bisecting two runs is the `runs_bisect` operation and action in `ops`, which carries the lens's answer whole with the disclosures every comparison carries."""
names = ["bisect_runs"]

[[release.change]]
from = "threetears.evals.analysis"
to = "removed"
why = """It disclosed that the frontier did not check guardrails, which stopped being true: the frontier now disqualifies a contestant that breaches one, naming the dimension (#613)."""
