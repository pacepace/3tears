[[release]]
version = "0.80.0"
since = "v0.79.0"
summary = """
Search and agent-tools give grounded answers (#930). For 3tears-evals, a campaign's page reads like a senior analyst's for any eval shape: its first screen is the decision (the title, the
question, the writer's answer, what warns, each report-wide caveat once), code's readings sit in one Scorecard matrix
per campaign kind, and Design & provenance states the report-wide detail once. An aspect and a goal check may
declare the name a page prints for them, which no identity, digest or fingerprint reads. The page is built by one
module per part. A campaign's report reads one analysis, whatever it has archived, and lays out its failed trials
as a table by default. No public name has moved or been removed since 0.79.0; the durable version and what changed
are in `notes`.
"""
notes = [
    "Names are declared (durable v16.3; 0.78.0 and 0.79.0 shipped v16.2 without them): `Aspect.short_name` and `EvalTemplate.goal_check_names` (each name at most 32 characters, written only when set), `campaign_update`'s `short_names` (editable after runs join), and on the bundle `AnalysisContextBundle.short_name` and `goal_check_names`, written only when set. None is in any identity, key, digest or fingerprint: `measured_template_digest` and `template_digest` leave a template's names out (so a seed adding names reads no template as drifted and a reset writes no new revision), a `template_update` of `goal_check_names` alone leaves the template's `updated_at` (so no run loses its template's criteria, intent, rejudging or take-up), and the aspect and campaign bundle fingerprints leave both out, so runs, cells, pools, pairings, analyses and reporter cases key exactly as before. The bundle shape stays 64. Declare no name until every pod reading the store runs durable 16.3. A 0.78.0 or 0.79.0 pod (durable 16.2, no names) reads a campaign or template written at 16.3 as a newer minor, keeping its names opaquely and printing labels whole, but it refuses an aspect bundle holding a name, since the bundle's shape did not move. The pre-releases at durable 16.2 before the names (such as 00107a5b7) are the same build as 0.78.0 here. The released v16.1 build keeps a durable document's names and prints labels whole; if it renames or drops a named goal check, this build drops the name that check lost when it reads the template. `report.decision.floor_readings` and `floor_statement` take `check_names` (default none, which names each check by its expression), carried on `FloorReadings.check_names`; a page passes its aspect's names, and `campaign_readings` passes none, so a campaign's readings and fingerprint never move with a name. `AspectNames` carries each aspect's check names (`AspectNames.check_names(label)`).",
    "Every page's first screen is the decision (owner, 2026-10-24: a caveat is stated once, at the level it applies to; the first-screen rule holds on every page). The title is its first line on a campaign's page and an aspect's own alike: nothing stands above it and nothing is announced with `role=\"alert\"` (what warns is a `<p class=\"warning\">`). A campaign's page then reads the question, the writer's summary and recommendation (section `answer`, with a choice's why for each aspect its pick is behind on), then what warns (section `warnings`): one plain line per arm for the bars it misses, the floors it breaks and the guardrails it is not shown safe on, worded as what it means for the arm (`Adopting v2 overrides the 10-point floor it breaks on billing.`, a measurement's `solo falls short of the bar on clarity.`, `v2 is not yet shown safe on the no invented total guardrail on classify and the polite guardrail on tone.`, each guardrail with its own aspects). An aspect's own page reads its question, arms line and verdict, then one such line per candidate breaking a floor. The lines `Floor broken on …`, `Floors broken for …`, `Bar missed on …`, `Guardrail breached on …` and `Not yet shown safe on …` are gone, and so is `report.decision.floor_warning`; `campaign_warnings(readings, names)` no longer takes the floors. Each report-wide disclosure is one caveat line on the first screen (each carrying the id `caveat-late`, `caveat-untimed`, `caveat-latency` or `caveat-settings`) and its detail stated once: on a campaign's page in the new Design & provenance section (tables `criteria_set`: Criterion, Set on, Results existed on; and `test_setup`: Disclosure, Detail, Aspects, the detail each aspect's own sentence verbatim, latency's with the arms it holds for); on an aspect's own page in its methods (`criteria_set`, and the latency and request-settings lines, ids `setup-latency` and `setup-settings`). An aspect's fold on a campaign's page leaves those out by those marks. The lines are: criteria set after their readings were visible or with no recorded time; results with no ordered time; `Latency read while other runs executed beside it is left out of every comparison on <where>; …`; `Request settings on <where> were not confirmed as sent, …`. `late_criteria_lines` is replaced by `timing_caveats(bundles)`, which `analyses_list` says after the warnings in place of a line per criterion. The memo's findings sit in section `findings` and its next steps in `next` (was `memo`, headed What it means). The call's line with none recorded reads `No call is recorded yet: a person decides, over code's readings.` HTML links each aspect named in a campaign table's aspect column to its fold, shows a code span over 60 characters in a table cell or header by its start and a visible ellipsis with the whole in a fold that opens in place (a link beside it, never around it), and draws a matrix's glyphs on one scale for every column. Both are the page's own, never read off a table's name or a cell's text: a table drawn on one scale sets `TableBlock.shared_scale` (new, default false; every Scorecard matrix sets it), and a cell naming an aspect carries its fold's link from where it is built (`AspectNames.cell`, the links in `AspectNames.folds`, each spelled by `report.model.fold_anchor`, new). `table_row` keeps a value already a cell. `provenance_blocks(bundles, labels, *, names)` (was `(campaign, bundles, labels)`) and `call_blocks(..., names=, reports=)` take the page's names and each aspect's page, and `BarStatus.missed_reason(measure)` (new) says a missed bar's reason with its measure named as the page names it. No public root's surface moves; `CAMPAIGN_JSON_SHAPE` stays 5.",
    "The campaign page is laid out by one module per part (`threetears.evals.analysis.report.campaign`: page, warnings, provenance, scorecard, depth_blocks, aggregate, memo_blocks, names, common); `report.campaign_page` re-exports what it exported, `late_criteria_lines` and `AspectNames` now among them, and every page renders as before. `campaign_warnings(floors, readings, names)` and `campaign_verdict(readings, aspects, names)` take the `AspectNames` the page names aspects by (`AspectNames.of(bundles)`), and `aspect_depth` takes an optional `name` its sentences call the aspect. Both serializers lay sections out in the page's own order (`Report.section_titles`, `CampaignReport.section_titles`); a campaign's sections up to Design & provenance read before the aspect folds and the rest after (`CampaignReport.headed_sections`, new). The page's model gains what its later parts are built into, none of it set on a page laid out today: `ReportSection` adds a campaign's own sections (`answer`, `warnings`, `scorecard`, `findings`, `next`, `provenance`), each laid out under its heading, and `FIRST_SCREEN` holds `answer` and `warnings`; an aspect's `Report` refuses a block in one of them, and both pages refuse a block in `glossary`, which no serializer lays out; `TableCell.flag` (new, default null) is a short marker every serializer prints after the cell's value, in parentheses; `ChartKind` adds `cost_quality`, whose `ChartBlock.points` (new) are `CostQualityPoint`s (new in `threetears.evals.analysis`, provisional: `arm`, `cost` and its interval in the chart's `unit`, `pass_rate` and its interval in percent), two or more, which `chart_svg` draws. `CAMPAIGN_JSON_SHAPE` is 5: the JSON's keys do not move yet, and what the page reads across aspects joins it within the same unreleased shape.",
    "A campaign's page now holds, in its `scorecard` section headed Scorecard, what code read across its aspects, off the first screen: a `scorecard` table, one row per aspect, whose columns are a change's candidates (keys `arm:<variant key>`, the control's first; each cell the change in points, its interval against the margin, and its reading and any differing floor status in `flag`), a choice's arms (each cell the pass rate, `flag` the arms it is shown ahead of) or a measurement's measures (keys `measure:<key>`); the `aspects`, `pairs` and `measures` tables keep their keys and are folded under it (`details`), and `bars` and the frontier lines sit in the section too. The control's cell is flagged `cannot show a drop` at or below the margin and `cannot show a gain` at 100%. A passes cell over repeats reads `<n> of <m> trials`. `to_settle` is retitled 'To settle' and gains `shows` and `decided_by` (a row's count on the pass rate and each unclear rate floor's, its deciding rate named); its `why` column stays. Removed from the page: the lines under the table saying a floor reads another rate or other points than its row (the cell's flag says it), and the sentence 'A floor on the same rate and points gives the same count.' The level, error-rate and across-arms lines are reworded. `settle_blocks(campaign, readings, reports, *, names)` (was `(readings, *, names)`), in a provisional submodule. The page JSON shape does not move: its keys are the readings', not the tables'.",
    "A campaign page's depth tables appear only where they say more than a sentence would. The `depth` table is absent where every arm ran each of its cases the same number of times, every arm on one aspect ran as many cases, and all but at most three arm-and-aspect pairs, fewer than the rest, ran to one depth: one `scorecard` disclosure says it, naming those few, in place of the table and each aspect's own depth sentence (`depth.repeats_sentence`, new). The `pass_k_depth` table is absent where every compared frontier subject is planned and compared at depth 1 with no case left out: one disclosure says pass^k compares pass rates there, the subject's own where there is one, else `depth.COMMON_DEPTH_ONE_EVERYWHERE` for the campaign. The `precision` table leaves out a column no row fills (most often `between`), and sits in the `methods` section where every arm ran each case once. `depth.REPEATS_FLOOR` is no longer under the precision table: it is said once, in the `provenance` section (Design & provenance), where some comparison reads a between-case share. A JSON consumer reading those tables by name reads the disclosures where they are absent. The writer's view is unchanged: each aspect's `depth.said` and `pass_k[].said` are as before.",
    "`report_read`'s default output is smaller (#951): each aspect's trials section is the census line, one row per failed or lost trial naming its stored result (a new `Stored result` column, read with `result_get`), and the passed trials' table, with no per-trial records. `trials=\"all\"` (new on the `report_read` action and operation, on `campaign_report` and `analysis_report`, and `--trials all` on the CLI's `report`) lays out every record exactly as before. The same default reaches every door to the campaign's page: the CLI's `report`, `CampaignReport.write` through it, and the quick path's `Result.page`; `Result.report` and the one-aspect builders keep every record. In HTML a link to a failed trial lands on its row; in the JSON form nothing changes.",
    "`AnalysisStore` gains `load_reported_analysis(campaign_id, scope_id)`, the campaign's newest analysis that is not archived, read alone; `campaign_report` and `record_campaign_call` call it. `EvalStorage` implements it over any `DocumentStore` (no change to that port), so only a host implementing `AnalysisStore` itself adds it.",
    "Over MCP, `report_read`'s structured content no longer carries `body`: read the report from the reply's text block, which is the body exactly as `ReportDocument.body` was. The structured content keeps `campaign_id`, `basis`, `analysis_id` and `format`. An action opts in to this by declaring `Action.text_field` (new, default `None`), the field its render returns verbatim; `report_read` is the only one that declares it, so every other action's structured content, a host's own actions included, is unchanged. The in-process `ActionOutcome.structured` still carries the whole result, `body` included.",
    "A host's REST route (or any caller) that calls `report_read` without `trials` now serves the trials table by default; pass `trials=\"all\"` to serve the page as it was, every failed or lost trial's record included.",
    "`list_analyses_by_campaign`, and so `analyses_list`, orders analyses written at one instant by id, greatest first, after `created_at`; the reported analysis is the first live one of that order.",
    "A change's or a choice's `CampaignReadings` gains `aggregate` (`CampaignAggregate`, new: `weighting` {`basis` `equal`, `weights` by aspect label summing to 1, `intervals` `aspects_independent`}, `level` 0.95, and `arms`, one `ArmAggregate` per arm a Scorecard column holds: `arm`, `arm_label`, `pass_rate` (percent), `change` (points; a change's candidate only, else null), `cost` (US dollars per reply), `cheaper_on` and `dearer_on` (a change's candidate only, else null), each figure an `AggregateFigure` of `value`, `interval` and `missing`, value and interval null exactly when `missing` names the aspects lacking it); it is null for a measurement and where fewer than two arms are compared, and it rides in the page JSON's `readings` (`CAMPAIGN_JSON_SHAPE` stays 5) and the campaign bundle. `campaign_aggregate(readings, bundles)` reads it. A reader of `readings` in the JSON or the bundle meets the new key; nothing else in the readings moves. The page's Scorecard matrix gains a last row `All aspects (equal weight)` over two or more aspects (its cells keyed as the matrix's; a withheld one null, flagged `withheld`); a `cost_quality` chart (`ChartBlock.points`, now drawn by `chart_svg`) sits in `scorecard` where the campaign compares more than one pair of figures, and one methods line says how aspects are weighed. `CAMPAIGN_BUNDLE_SHAPE` is 3: `CampaignBundle.from_dict` and `from_frame` read a shape-2 document as shape 3, its aggregate read off its own readings and aspects' bundles, and refuse any other earlier shape as before; the campaign fingerprint and `campaign_evidence_digest` read a shape-3 bundle as shape 2 without `readings.aggregate`, so every fingerprint recorded at shape 2 (an analysis's, a reporter case's) still matches the same evidence, and a reporter case frozen at 2 rebuilds with its recorded fingerprint and keeps its labels. No pooling or identity input moves.",
    "The campaign writer's view changes shape (`writer_view`, and so `build_campaign_user_message`; no reading, identity, digest or fingerprint moves). `aspects[].readings[].cases_to_settle` is replaced by `to_settle` (`{if_none, if_observed}`, each `{kind, cases?, usd?}`, `kind` one of `more`, `enough`, `lost`, `never`, `beyond`). `floors` is a rollup per arm, `[{arm, broken?, unclear?, held?}]`, each floor `{floor, aspect, reads, interval, worst_drop, margin, short_by, why, to_settle}` with what it lacks left out (`status`, `reading`, `speaks_for` and `reason` go). New: top-level `aggregate` (two or more aspects), `disclosures` (`late_criteria` with `aspects`; `latency_contended`, `request_settings_disclosure` and any disclosure two or more aspects carry alike, each `[{aspects, said}]`) and `confound_catalog` (what two or more aspects explain alike, each wording `[{aspects, said}]`); per aspect, `short_name` (declared only), `control_floor` and `measures[].name`. `aspects[].late_criteria` is gone, and a disclosure the campaign states is no longer in the aspects' `disclosures`. Each `precision` drops `means`; the definition it carried is said once, in a top-level `precision_means`, wherever a reading or pair carries a precision. Figures in points read to one decimal. A reader of the view by key re-pins; a reporter case frozen at either campaign-bundle shape renders the new view, and its recorded writer message is unchanged. `threetears.evals.analysis.report.decision.control_cannot_show` (new, not a public root) is the rule both the Scorecard's control mark and the view's `control_floor` read.",
    "The seeded writer prompt (`EVAL_ANALYSIS_GEN_DEFAULT`) moves to read the writer view's new fields: `to_settle` (quoted with its kind; `never` calls for a change to the candidate), the per-arm `floors` rollup, `aggregate`, the campaign's `disclosures` (said once by the page, never per finding), `control_floor` (a validity finding, raised first), `short_name` and each measure's `name`. Rule 11 drops its request that the summary name each late criterion, and keeps never discounting a reading for when its runs ran. It stays within its character budget. A deployment's stored `eval_analysis_gen` preset is store-master and still names `cases_to_settle` and `late_criteria` on an aspect, which the view no longer carries, so every host pushes the new seed (`eval_prompt_reset`).",
    "A campaign's page that prints any cost figure says once, on its first screen after the other report-wide caveats, that each cost figure reflects the provider routing of the runs it was measured on, not the model alone (owner, 2026-10-25): a `warnings` `DisclosureBlock` with source `cost` and anchor `caveat-cost`, whose text is `COST_ROUTING_CAVEAT` (`report.campaign.provenance`). An aspect's own page that prints a cost says it once too, as a `header` `DisclosureBlock` with the same source and anchor among its report-wide caveats; a campaign's fold of that aspect does not repeat it. A page whose arms carry no cost on any aspect does not say it. The glossary's `cost per reply` (`GLOSSARY`) reads `What production would spend per reply on the models the arm runs, as its runs were routed.`, so a host pinning a rendered page's glossary text moves. The writer's view (`writer_view`, so `build_campaign_user_message`) hands the same sentence once, as `disclosures.cost_routing` (`[{aspects, said}]`, the priced aspects), on a campaign of one aspect too, never in an aspect's part; a reporter case or recording keyed on the writer's message moves. No reading, ranking, identity, digest or fingerprint moves, and no provider is named: the package does not record which provider served a token-metered call.",
]

