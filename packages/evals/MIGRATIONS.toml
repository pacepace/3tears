# Every name that left a public root of 3tears-evals, per release: its new home or "removed", and why.
#
# A public root is a module in threetears.evals.PUBLIC_ROOTS, and its public names are its __all__. When a name
# leaves one (moved to another root, renamed, or removed) it is recorded here, and there is no compatibility shim:
# a porter reads the release notes, which are printed from this file:
#
#     uv run python packages/evals/scripts/release_notes.py v<version>
#
# tests/test_api_surface.py fails while a name is missing from the checked-in snapshot (api/surface.json) without
# being recorded in the FIRST section below, and scripts/generate_api_snapshot.py refuses to write a snapshot that
# drops one. Sections run newest first; the first is the release being prepared. Older sections are history and are
# not checked against today's surface.
#
# Before tagging a release, rename the first section from "unreleased" to its version; after the tag, the next
# release's work goes in a new "unreleased" section since that tag. tests/test_api_surface.py fails once the tree
# follows a tag with no section of its own, or while the unreleased section starts at an older tag. The tree follows
# the newest final release tag at or below its pyproject version, on any ref (a release is tagged on main, which
# develop never merges back), and a pre-release tag only where HEAD has it.
#
# Each [[release.change]] is one move for one reason:
#   from     the root the names left, in full
#   to       the root that exports them now, in full, or "removed"
#   names    names that keep their name in `to`
#   renamed  { old = "new" } for names renamed on the way
#   why      what a porter needs to understand the change
# A section's `notes` carry breaking changes that are not a public name: a field, a submodule, a version.
# A section's `since` names the tag of the release before it. The test then reads both surfaces from git and holds
# the section to exactly the names that left a root between that tag and this version's (or the working tree,
# before this version is tagged).
# A signature change alone needs no record here (the snapshot diff is its record); put it in `notes` when it breaks
# callers.

[[release]]
version = "unreleased"
since = "v0.66.0-evaladopt.9"
summary = """
What adopting .8 found, continued (gap 39): the FastMCP transport answers a resolver's refusal as a refusal, reads its
call timeout per call from a function where a host mounts one, and takes an `annotate` hook that appends a host's
note to what a call returns.
"""
notes = [
    "`transports.fastmcp.ToolBinding.call` returns a caller or host resolver's `kernel.EvalServiceError` as a refused `ActionOutcome` (its kind, status and remedy) where it propagated: a host that caught it around `call`, or that answered it as a transport error, now receives the refusal. Anything else a resolver raises still propagates.",
]

[[release]]
version = "0.66.0-evaladopt.9"
since = "v0.66.0-evaladopt.8"
summary = """
What adopting .8 found (gaps 35–38): a subject is asked of its kind, the engine's remedies are public, the router's
refusals hold their fault and remedy apart, and a host's authoring check refuses a kind's ignored fields through the
dispatch's own call.
"""
notes = [
    "`LaunchHost` no longer takes `resolve_subject`; each `LaunchableKind` takes a required `resolve_subject` (`run.SubjectResolver`, unchanged in shape) in its place. Move the host's resolver onto each kind it registers, splitting it by what that kind's subject id names. `launchable_judge_kind` brings its own, which admits any non-blank label. The subject is now refused once the template's kind is known (after a missing template, a kind with no launcher and the kind's argument refusals, still before any arm is priced); a battery asks each kind it launches.",
    "`storage.RouteChanged` and `storage.MisplacedDocument` are constructed as `(fault, *, remedy)` and carry both as attributes; `str()` reads `fault; remedy` as before, and both are still `RuntimeError`s.",
]

[[release]]
version = "0.66.0-evaladopt.8"
since = "v0.66.0-evaladopt.7"
summary = """
Every refusal names a remedy its caller can reach, and a run's spend, figures and comparisons say what they
measured; report v7 serves its words. What a consumer's end-to-end test of .6 found, the import check's wider
reach, the font table's provenance and kind-declared cell width.
"""
notes = [
    "`actions.ActionOutcome` takes `refusal: Refusal | None` in place of `is_error: bool`; `is_error` is now a property (`refusal is not None`). A host constructing an outcome passes `refusal=Refusal(kind=..., status=...)`, or `Refusal.of(error)` for an engine error.",
    "`transports.fastmcp.ToolBinding` takes everything after `mounted` by keyword, and exactly one of `host` and `host_resolver`; `around` and `call_timeout_s` are keyword too. A refused call's structured content is `{\"refusal\": {\"kind\": ..., \"status\": ...}}`.",
    "`threetears.evals.vega.palette.load_palette()` (the packaged artifact, read as a dict) is `packaged_artifact()`; `vega.load_palette(path, theme)` now reads a host's own palette artifact as a `ChartPalette`. A palette artifact whose `series_slots` is not `SERIES_SLOTS`, or whose `validated_slots` is below `VALIDATED_SLOTS`, is refused.",
    "`testing.BoundaryFinding` (was `NonPublicImport`) carries `rule` (a `BoundaryRule`, one of `BOUNDARY_RULES`) and `target` (the dotted name reached) in place of `module` and `name`, and its `str()` reads `path:line: rule: target — reason`. `nonpublic_evals_imports` now also reports dynamic imports, undeclared attribute chains, private reach and patches into the package, so a host suite that passed may fail.",
    "Font metric tables are format 2 and record `font_files` (the SHA-256 of each file declaring the family); `load_chart_font` refuses a format-1 table, so re-measure every host table with `python -m threetears.evals.vega.measure_font` (the `[vega]` extra; `packages/evals/scripts/measure_font_metrics.py` is gone). `vega.write_font_metrics` takes a required `font_files`, and `ChartFont` gains `font_files`. A renderer built with a `font_dir` refuses a font whose recorded files are missing or changed.",
    "Report version 7 (schema `$id` `urn:threetears-evals:report:v7`). A `TableBlock` row keys every column to a `TableCell` (`value` and its `text`) in place of a bare value; `TableBlock.values()` reads a table as values. The report serves `title` and `byline`, and every block its `section_title` and `finding_number`, as computed fields re-derived on read; the functions `report_title`, `report_byline` and `finding_number` in `analysis.report.model` are gone, and `chart_table_columns` is private (a chart block serves its values table as columns and rows of cells).",
    "`EvalSummary`'s JSON carries every line `render()` prints, as computed fields re-derived on read. `dollars_text` takes `None` and returns `UNPRICED` (`\"unpriced\"`) for it, never `$0`.",
    "A kind declares how many cells it drives at once: `CandidateKind.max_concurrent_cells` (an int of at least 1, or `None` for no limit of its own), which its launcher hands to `KindWiring.max_concurrent_cells` (default `1`). `LaunchSettings.max_concurrent_cells` is now a ceiling: a run not measuring latency executes at the narrowest of the kind's declaration, the host's setting and its matrix, so a host whose kinds declare nothing now runs serially; the runner refuses a kind declaring less than the run executes at.",
    "`CellSink.cost_cap_reached()` takes no argument: a kind reports its spend with `CellSink.add_spend(source, cost_usd)` (one running total per source, never overwritten) and reserves a priced call with `CellSink.reserve(source, ceiling_usd)` (a `CellReservation`, settled or released), or wraps its client in `kernel.CappedCompletion`. A host's own `CellSink` implementation must provide both. A reservation the cap has no room for raises `CostCapReached`, which out of a `drive_conversation` callback ends the conversation `budget_stopped`.",
    "`EvalSummary` states every role's spend: `spend` (a `RoleSpend` per role the results' usage rows name — calls, cost or `None` when any call went unpriced, and the `external` role's `ProviderUnits` per provider) and `total_cost_usd` (the results' cost summed) replace `judge_calls`, `judge_cost_usd`, `candidate_calls` and `candidate_cost_usd`; read one role with `role_spend(role)`. The served lines `judge_spend_text` and `candidate_spend_text` are `spend_lines` and `total_spend_text`. A capped run whose results reported no spend says \"no result reported any\", not that the candidate reported none.",
    "`format_number` writes a value below 1000 to four significant figures in full, never as an exponent (`0.00005165`, was `5.165e-05`), and a non-zero value below one millionth (`WRITTEN_FROM`) as the bound it is under (`< 0.000001`, `> -0.000001`). `tests/fixtures/number-format-cases.json` records it: a browser renderer that restates the rule moves with it.",
    "Report v7: a `TableCell` carries `unit` (empty for words and unitless numbers), and its `text` joins the number to it. A measure's figures read on one ruler per report (`analysis.surface_table.measure_rulers`): the contrasts, guardrails and strata tables restate a measure's means, delta and interval onto the decision surface's unit for it (a latency in s where it reaches a second), so a client reading `TableCell.value` there reads the restated number.",
    "`runs_compare`'s arm row: `paired` is True only over at least one case both runs scored, and `n_pairs` is `None` when nothing was paired; `composite_untested_reason` says why no composite test ran. It gains `pass_hat_k_n_cases_{a,b}` (the cases each pass^k averaged at `k`) and `pass_criteria_{a,b}`. `kernel.host.pass_threshold_label` takes a required `criteria` (`PassCriterion`s: `goal_checks`, `rubric`).",
    "Every refusal carries a remedy: `EvalServiceError.remedy` is a required keyword on `EvalServiceError`, `NotFoundError(resource, resource_id, *, remedy)`, `ConflictError(message, *, remedy)` and `ValidationFailedError(message, details=None, *, remedy)` — a host raising or subclassing any of them passes one, and a blank one is refused. `StorageError`, `ProviderRefusedError` and `AdmissionRefusedError` supply their own (an admission refusal's message no longer carries what to do; its `remedy` does). `str()` is the message, then the remedy; a refused call states the remedy on a `remedy:` line. `NotFoundError` carries `resource` and `resource_id`.",
    "A lower layer's refusal is a `kernel.RefusedInput` (a `ValueError` carrying `fault` and `remedy`, read by `str()` as both), which a surface translates into a `ValidationFailedError` with the same halves: `kernel.DesignRefused` (the declaration gate's refusals and `reconcile_question_edits`'), `UndeclarableAxisError`, `run.CeilingRaisedError`, and the lenses' `PivotError`, `HistoryError`, `ExportError`, `FrontierError` and `StatusFilterError`, each now constructed with a required `remedy`. A host catching one reads `fault` and `remedy` rather than parsing `str()`.",
    "A priced arm's refusal is two halves: `run.ArmVerdict` and `ops.ArmEstimate` carry `remedy` beside `refusal`, and the estimate's text prints it on its own line.",
    "A judge temperature comparison in which either setting scored no case it answered at least twice on some dimension (every call failed, or every answer was \"cannot tell\") reads `comparable=False`, its `incomparable` saying on which dimension and setting and how the calls ended.",
    "`LaunchHost` takes a required `resolve_subject` (`run.SubjectResolver`: `None` when the host holds the subject, an `run.UnknownSubject` naming how to find one when it does not). Asked at admission by `quote_launch`, every launch and the battery, before pricing; a launcher no longer meets an unknown subject.",
    "`LaunchableKind.ignored_template_fields` (`run.TemplateField`s) declares the template fields a kind never acts on; the dispatch refuses a template stating one. `launchable_judge_kind` ignores every one: a judge template carrying a world seed, goal checks, preconditions, tools or a rubric is now refused.",
    "`run.judge.sent_temperature` takes a `CompletionResult` and refuses one with no `temperature` (a `TypeError` naming `check_completion_conformance`), where it recorded the judge at no temperature. A host completion type must carry it; a judged dim of such a client now errors instead of storing an unrecordable score, its error naming `check_completion_conformance`. `run.judge.run_judge_llm` returns that refusal as an error carrying the call's `judge_usage` rather than raising, so the call's spend reaches the result and the run's cost cap, and a judge-kind trial on such a client is a harness fault whose telemetry carries what the call cost.",
    "`campaign_create` (and `ops.CampaignDefinition`) take `template_id`; a campaign naming none whose runs all ran one template is over it. A tool reads a nullable parameter as meaning what its value means, so an optional and a required parameter of one name share it.",
    "`analysis.lenses.frontier.compute_frontier` takes `tiers`, and `FrontierVerdict` carries `judge_evidence_tier` for a verdict made on a judged pass^k. `analysis.reads.LensStore` gains `query_calibration_ratings`, `query_judge_profiles` and `load_template`, which a scope's frontier reads its judges' tiers through.",
    "`JudgeEvidenceTier` carries `consulted_profile` (`kernel.JudgeProfileConsulted`) when a stored judge profile was read for an undetermined judge and decided nothing either.",
    "A font metrics table records `probe_digest`; `load_chart_font` refuses one recording another or none. Re-measure every host table with `python -m threetears.evals.vega.measure_font`. `check_font_files` is exported from `threetears.evals.vega`.",
    "Every out-of-run model call is planned, admitted by its caller, then made, and no package function does all three. `gen.propose_draft(client, admitted, *, budget, axis, subject_id)` makes a call its host admitted: plan it with `gen.plan_draft(system_prompt=, subject_feed=, catalog_feed=)`, admit it in your call with `budget.admit(client, \"proposer\", [call])` (refusing there what the cap cannot pay for), and make it in your job; it refuses an admission for another purpose. `system_prompt`, `subject_feed` and `catalog_feed` left `propose_draft`, and a client admitted and never made is yours to release.",
    "`gen.generate_variations` takes `generation: kernel.AdmittedGeneration | None` (the writer, the budget that admitted the calls, each `llm` axis's `AdmittedCall`) in place of `llm` and `budget`, and admits nothing: plan with `kernel.plan_variation_calls`, admit with `OutOfRunBudget.admit`. A launch admits its generation in its call on a writer it builds, and each request carries it as `LaunchRequest.generation`: a launcher hands `generation=request.generation` to `generate_variations` and builds no writer of its own (the launch holds the writer open around its launchers). The launch tail still refuses a generation its budget ledgered nothing of.",
    "Every package call whose reply is read into a typed shape sends that shape as a strict `json_schema` `response_format` (`kernel.strict_response_format`): the proposer (`RubricProposal`, each dimension's `scoring_guide` sent as every scale level, null where unwritten), the variation writer (`{\"values\": [string]}`) and the judge (`run.judge.judge_reply_format`, built from the criteria `run_judge_llm` reads; `JudgeRequest.response_format`). None sends `{\"type\": \"json_object\"}` any more. A host client that handled only JSON mode passes the directive to a provider that enforces structured output, or translates it; a capture or cassette keyed on the directive records anew.",
    "Every `EvalStorage` read of a leased job record settles it as `job_poll` does: a record that has not ended and whose lease lapsed (or which carries none) is written lost by the read (`load_eval_run`, `query_eval_runs`, `load_eval_runs`, `load_sweep`, `list_analysis_attempts_by_campaign`), so a read may now write, and `query_eval_runs(status=...)` filters on the settled status (`running` leaves out a lapsed run; `cancelled`, `RUN_LOST_STATUS`, includes it). `load_job_record`, the reads that return an etag and `query_non_terminal_eval_runs` stay raw. Every `LeasedJobKind` registers itself by its model as it is constructed (`kernel.job_leases.leased_kind_of`), a host's own kinds included, and takes `named_runs`: a launch or a sweep written lost settles the runs it names.",
    "`storage.RoutedDocumentStore(children, route, *, routing_scope)` and `RoutedDocumentStore.relocate(..., routing_scope=...)` take a required `routing_scope`: the scope the placement record is kept in, which the host names (a partition of shared stores names its own). `ROUTING_SCOPE` is gone. A host upgrading in place passes `routing_scope=\"threetears.evals.routing\"`, the scope its records were written in; one choosing another scope runs `relocate` with it before starting. A router built with another scope than `relocate` was given refuses to start (`RouteChanged`), and `relocate` refuses a routing scope among its `scope_ids`.",
    "Core schema v11: a job record keeps the engine refusal its work ended on as data — `refusal` (`schema.JobRefusal`: `kind`, one of `REFUSAL_KINDS`, and `status`), optional — on `EvalLaunch`, `EvalSecondJudgePass`, `EvalJudgeTemperatureCheck`, `EvalActionJob`, `EvalSweep` and `EvalAnalysisAttempt`, and `job_poll` serves it as `JobStatus.refusal` (in its text, a `refusal: <kind> (<status>)` line). The v10 step is the identity, and a v10 record reads with none. A build before this one refuses a v11 record as newer: stop every process sharing a store, then upgrade them together. `RefusalKind` and `REFUSAL_KINDS` are defined in `schema` and still exported from `actions`; `kernel.refusals.refusal_kind`/`job_refusal` are the one mapping from an engine error to its kind.",
    "A strict `json_schema` the package sends carries only the portable strict subset (`kernel.PORTABLE_STRICT_KEYWORDS`: `type`, `properties`, `required`, `additionalProperties`, `items`, `enum`, `anyOf`, `$ref`, `$defs`, `description`): `kernel.strict_schema` leaves out every bound, length, pattern, format and item count (enforced on return by the reply's validation, as before), sends a `const` as its one-value `enum`, and refuses any other keyword with `kernel.UnportableSchema`. The proposer's schema no longer carries `minLength`, `minimum` or `maximum`, and the judge's directive goes through the same projection; a capture keyed on a directive records anew.",
    "`transports.fastmcp.ToolBinding.call` holds the call timeout itself and raises `CallTimedOut` (its `timeout_s`) when the call outlives it before its action finishes; a host calling a binding directly catches that in place of a `TimeoutError` from a timeout of its own. The timeout ends with the action's outcome: an `around` hook's code after its yield, and closing a hook whose call was stopped, are held to `HOOK_TAIL_TIMEOUT_S` (10 s) instead, and a hook that overruns is cut short and logged while the outcome stands.",
    "A store read that settles job records settles each on its own (`kernel.job_leases.settle_tolerantly`): a record that cannot be written lost — another writer keeps moving it, or a model refuses a value — is returned as stored and logged, and the rest of the list is read; a storage failure still propagates. A run written lost whose stored results cannot all be read is settled with `completeness` None (unknown) rather than failing the read, and a lost launch or sweep settles every run it names that it can.",
    "`ops.report_charts` reports a chart as refused only when its renderer raises `analysis.viz.ChartRefused` (a `ValueError`); any other exception, a plain `ValueError` included, is a defect and propagates. A host renderer refusing a chart raises `ChartRefused` (or a subclass). The Vega adapter's `SpecPolicyError` is one, and `vega.render_png`/`render_svg` (and `VegaRenderer.png`/`svg`) raise `vega.RasterRefused`, another, for vl-convert's own conversion failure only; any other `ValueError` vl-convert raises (a spec it cannot parse) propagates unchanged.",
    "A font metrics table is held to its face's whole file set and to the type scale: `check_font_files` (and so a renderer built with a `font_dir`) also refuses a font when a file the table did not record declares its face in the directories (a weight added to the family), a font recording no files included, and `load_chart_font`/`write_font_metrics` refuse a table measured at weights other than the chart type scale's (`vega.palette.drawn_weights()`). Re-measure such a face with `python -m threetears.evals.vega.measure_font`. `font_families`, `resolving_files` and `FONT_SUFFIXES` moved from `vega.measure_font` to `vega.text_metrics`, which reads them without the rasteriser.",
    "`testing.nonpublic_evals_imports` refuses a check that would read nothing: called with no source, or naming a directory that holds no `.py` file, it raises `ValueError` (a missing path still raises `FileNotFoundError`). It now reads `from threetears import evals` as binding the package, so every reach through `evals` is checked, and `import importlib.util` (or any `importlib` submodule, unaliased) as binding `importlib` for `importlib.import_module`; a host suite that passed may fail on either.",
    "`RoleSpend.cost_usd` is what a role's priced calls cost (`None` only when none was priced), no longer `None` the moment one call went unpriced; it gains `unpriced_calls`, `counted` (whether the run's total sums the role: the `external` role only where the run declared external rates), `unpriced_because` and `money_text()`. A role line states its priced dollars and how many calls are unpriced and why (`judge spend: $0.00200 over 2 call(s), 1 of them unpriced: its client reported no price for them`), and an unknown total states the counted roles' priced dollars and unpriced calls (`total spend: unknown in full: $0.00400 over the priced calls, plus 1 call(s) unpriced`), so the counted roles' lines add up to the total.",
    "A measure reads on its one ruler (`analysis.surface_table.measure_rulers`) on every surface of a report, charts and words included: a chart compiled from a reference records the ruler's unit on its payload (`stated_unit` on the distribution, null-result, timeseries, breakdown and attribution payloads, on each delta-table row and sweep measure, and `latency_stated_unit` on a frontier) and is drawn in it, so a browser mirror of the payload contract restates onto it too; a payload naming none chooses over its own values as before. A figure in prose, an evidence row's value (now carrying its unit) and spread, and a contrast's margin are stated on it. `RunMeasureSummary` gains `unit` (the host's declared unit), and a run summary's measure line states its mean, minimum and maximum in it on one ruler (`mean 0.95 s (n=3, min 0.7 s, max 1.2 s)`).",
]

[[release.change]]
from = "threetears.evals.testing"
to = "threetears.evals.testing"
why = """The import check reports more than imports now — attribute chains, private reach, patches — so its finding is renamed, and names the rule it breaks (see the notes for its fields)."""
renamed = { NonPublicImport = "BoundaryFinding" }

[[release.change]]
from = "threetears.evals.storage"
to = "removed"
why = """A fixed routing scope put every partition's placement record under one key in shared stores, so only one partition could write it. The host names the scope now (`routing_scope`, required on the router and on `relocate`)."""
names = ["ROUTING_SCOPE"]

[[release]]
version = "0.66.0-evaladopt.7"
since = "v0.66.0-evaladopt.6"
summary = """
A public name has one home: the root holding its defining module. A name another root also exported is dropped
from that root, unless the root needs it and api/reexports.toml says why (`ops` keeps the analysis results the
action catalogue names, since `actions` may reach `analysis` only through `ops`).
"""
notes = [
    "Every model-calling action runs as a job: `run_launch` returns one `launch:<id>` job whose `JobStatus.run_ids` names its runs; `judge_second`, `judge_drift_check` and `judge_temperature` return `JobsStarted`, and their read is `job_poll(...).result`. So does the host-facing `ops.judge_repeat`: one `action:<id>` job (target `judge_repeat`) whose result is the `JudgeRepeatReport`. Poll with `job_poll`; a transport call never waits on a model.",
    "A host action that calls a model must run as a job (`ops.start_action_job`, recorded as `EvalActionJob`), and every `spend` action declares a `happy_path`; `threetears.evals.testing.jobs_conformance_cases` proves both over a host's catalogue.",
    "`DocumentStore.upsert` takes `create_only`: a host's own store adapter must implement it (write only when nothing is stored under the id) and pass the conformance kit's `create.*` cases.",
    "A job's liveness is its record's lease, the same in every process. `EvalRun`, `EvalSweep` and `EvalAnalysisAttempt` carry `lease`, `cancel_requested_at`, `cancel_request_reason` and `lost`; a non-terminal record with no lease reads as lost. `LaunchHost.job_lease_s` sets the lease (default 60s).",
    "A job's work stopped by its own time budget ends `timed_out` (`run.JobOutcome`), which `job_poll` reads as state `stopped` with status `timed_out` and a detail naming the budget; `cancelled` means only that it was asked to stop, shut down or lost. `eval_launch`, `eval_second_judge_pass`, `eval_judge_temperature_check` and `eval_action_job` may store it (core v10 is unreleased, so its shape pins moved, not its version). The budget is entered by the work itself: `JobWork.budget_s` and `EvalJobManager.start_task(budget_s=...)` take `None` for work that bounds itself, and `EvalJobManager.job_timeout_factory` is what it enters.",
    "A sweep and an analysis generation whose own budget runs out end `timed_out` too (`EvalSweep.outcome`, `EvalAnalysisAttempt.outcome`; core v10 is unreleased, so their shape pins moved), read as state `stopped`, the detail (an attempt's `error`) worded by `kernel.timed_out_detail` as every job kind's is. Each enters its own budget: a sweep `(arms + 1) x ops.sweeps.SWEEP_ARM_BUDGET_S`, its arms in flight stopped with `SWEEP_TIMEOUT_REASON`; a generation `AnalysisGeneration.budget_s`, around its generator calls (`run_analysis_generation(deadline=...)`).",
    "One rule fences every leased job kind once its process lets its lease go (a renewal finds the record ended elsewhere, or renewals fail for a whole `job_lease_s`): `JobLeases.let_go` marks it, `JobLeases.fenced` answers it until the job ends (`JobLeases.forget`), and every own write refuses it — a run's status write, `write_held_record(..., leases=)` and `require_held(..., leases=)` for sweeps and job work, `run_analysis_generation(..., leases=)` for a generation — even when the store would still take the write. The record reads lost to the next reader.",
    "A launch's job is bounded only while it prepares (`run.LAUNCH_PREPARATION_BUDGET_S`, the engine's per-run job cap); the wait for its runs is bounded by each run's own budget, so time a run spends queued for a concurrency slot no longer counts against the launch.",
    "A launch that generates its cases (`n_variations` > 0) prices the generation's calls on its writer against the out-of-run cap in the call, as the battery's pre-flight does, so `run_launch` refuses one the cap cannot pay for before it returns; the host's client factory is asked for one more `variation` writer, priced and never called.",
    "`EvalJudgeTemperatureCheck.answers` is written as each call returns, so a comparison cancelled, timed out or failed part-way keeps every answer it paid for; read `answers.calls_made` beside the outcome. A job's ending write the store fails is tried again (`run.job_work.ENDING_WRITE_RETRY_DELAYS_S`); one never written is logged at ERROR with the whole ending, and the record reads lost once its lease lapses.",
    "A `JobWork` runs once: a second `start_job_work` or `run_job_work` of the same admitted work raises `RuntimeError` before anything is written or spent, and the record's first write is create-only, so `JobRecordStore.save_job_record` takes `create_only` (a host's own job record store implements it: write only when nothing is stored under the id, else `ConflictError`).",
    "A run another process wrote lost (or this process's shutdown did) takes no later write from its old holder, its own `cancelled` ending included: the loss's `completed_at` (store time) and `cancellation_reason` stand, and the old holder neither broadcasts the ending nor calls `on_run_end`. A holder whose lease renewals fail for a whole `job_lease_s` stops its job as lost. A sweep checks it still holds its record before each arm (`kernel.require_held`).",
    "`analysis.AnalysisStore` gains `delete_analysis` and `delete_insight` (`EvalStorage` has both): a generation whose attempt is written lost while it stores withdraws the analysis and insights it stored, so a host's own analysis store implements them.",
    "The jobs conformance kit now fails an action whose call waits on its own job: while a call runs, a job's request waits for it to return, at most `call_return_timeout_s` (`jobs_conformance_cases(..., call_return_timeout_s=)`, default `DEFAULT_CALL_RETURN_TIMEOUT_S`), then is refused with `JobAwaitedByItsCall`. A host action that started its job and awaited it, and passed before, fails now: return `JobsStarted` and let the caller poll.",
    "Upgrade with no job running, never rolling: stop every process that shares the store, then start them all on this release. A job an older build started carries no lease and is read lost (and written lost) by the first process on this release that polls it, while the older build's own reclaim reads every job it is not running as abandoned. There is deliberately no grace for a lease-less record: none could tell a live old-build job from a dead one.",
    "Core schema v10. `eval_campaign`, `eval_sweep`, `eval_analysis_attempt`, `eval_generation_slot`, `eval_launch`, `eval_second_judge_pass`, `eval_judge_temperature_check` and `eval_action_job` are kept (core) documents and upgrade on read; nothing a host stored is refused.",
    "`EVAL_DOC_TYPES` and `CORE_DOC_TYPES` are derived from `schema.DOC_TYPE_FACTS`; a host partitioning storage reads the facts (origin, lifecycle, suppresses), or uses `storage.RoutedDocumentStore`.",
]

