to = "threetears.evals.schema"
why = """The stored-document version is split by what it versions (#703): the evidence core every later release reads (`CORE_SCHEMA_VERSION`) and the documents the engine regenerates, whose version `EVAL_SCHEMA_VERSION` was and which keeps its value."""
