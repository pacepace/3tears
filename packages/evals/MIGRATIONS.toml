# Every name that left a public root of 3tears-evals, per release: its new home or "removed", and why.
#
# A public root is a module in threetears.evals.PUBLIC_ROOTS, and its public names are its __all__. When a name
# that shipped in a final release leaves one (moved to another root, renamed, or removed) it is recorded here, and
# there is no compatibility shim: a porter reads the release notes, which are printed from this file:
#
#     uv run python packages/evals/scripts/release_notes.py v<version>
#
# tests/test_api_surface.py fails while a name is missing from the checked-in snapshot (api/surface.json) without
# being recorded in the FIRST section below, and scripts/generate_api_snapshot.py refuses to write a snapshot that
# drops one. A name that no final release exported is not recorded: it never shipped, so it can leave with only a
# regeneration of the snapshot. Sections run newest first; the first is the release being prepared. Older sections
# are history and are not checked against today's surface.
#
# Only final releases (tags v<x>.<y>.<z>) count. A pre-release tag, with any suffix, is never followed and never
# measured from, and has no section here. 0.66.0 is the package's first release: v0.65.0, the release before it,
# had no 3tears-evals, so nothing can have left a root before 0.66.0 and its section records no names.
#
# Before tagging a release, rename the first section from "unreleased" to its version; after the tag, the next
# release's work goes in a new "unreleased" section since that tag. tests/test_api_surface.py fails once the tree
# follows a tag with no section of its own, or while the unreleased section starts at an older tag. The tree follows
# the newest final release tag at or below its pyproject version, on any ref (a release is tagged on main, which
# develop never merges back). A release from before the package existed needs no section.
#
# Each [[release.change]] is one move for one reason:
#   from     the root the names left, in full
#   to       the root that exports them now, in full, or "removed"
#   names    names that keep their name in `to`
#   renamed  { old = "new" } for names renamed on the way
#   why      what a porter needs to understand the change
# A section's `notes` carry breaking changes that are not a public name: a field, a submodule, a version.
# A section's `since` names the tag of the final release before it. The test then reads both surfaces from git and
# holds the section to exactly the names that left a root between that tag and this version's (or the working tree,
# before this version is tagged).
# A signature change alone needs no record here (the snapshot diff is its record); put it in `notes` when it breaks
# callers.

[[release]]
version = "unreleased"
since = "v0.65.0"
summary = """
The first release of 3tears-evals. No earlier release shipped the package, so no public name has moved or been
removed: every name on the surface is new, and api/surface.json is the baseline later releases are measured from.
"""
notes = [
    "The public API is still changing: until a release says otherwise, any release may break it. Every name that leaves a public root from here on is recorded in this file and printed in that release's notes, with its new home or `removed`.",
    "The `v0.66.0-evaladopt.N` tags are pre-releases, never published to PyPI, and nothing here is measured from them. A host that ran one imports each name from the root `docs/reference.md` lists it under; each pre-release tag's own `MIGRATIONS.toml` and `CHANGELOG.md` still describe the moves between them.",
    "A store a pre-release wrote is not read. Core schema v14 is the baseline: a core document at v8 to v13 is refused by name as pre-release, and regenerable documents (schema v9), bundles (shape 50) and cells (model 12) are refused or re-assembled at their new versions. Delete every eval document a pre-release wrote before deploying this release.",
    "Since `v0.66.0-evaladopt.20`, fields every writer sets are required: on `EvalRun`, `judge_temperature` exactly when `judge_model` is, `goal_check_proof_rules` exactly when `goal_check_proofs` is, and `cell_concurrency` (default 1); on `RubricScore`, `axis`; on `EvalAnalysis`'s provenance, `bundle_schema_version` and `host_declarations_digest`; on `EvalInsight`, `invalidation_trigger`; on `BarVerdict`, an interval beside any decision. A recorded judge identity is a `builtin:<sha12>` id or `<config id>@<sha12>`; a bare config id is refused. `__retired_fields__` and the stored-read context are gone, `GuardrailReadings.unstamped_dimensions` and `BarVerdict.decided_on_the_mean` are removed, `BundleInspection.mismatch_cause` loses `cannot_say`, and a cell id now digests every apparatus dimension (`judge_temperature` included).",
    "Since `v0.66.0-evaladopt.21`, every core document carries `schema_minor` (0 in this release) beside `schema_version`, which is now the core major: a read accepts any newer minor of its own major, keeps every field it does not declare and writes it back, and constructing or validating a core document at a newer minor is refused (`CoreSchemaMinor`).",
    "`schema_minor` is a server field on every authoring surface (`TEMPLATE_SERVER_FIELDS`, `RUBRIC_DIM_SERVER_FIELDS`, `JUDGE_CONFIG_SERVER_FIELDS`, `CAMPAIGN_SERVER_FIELDS`), ignored if sent.",
    "`UsageRole`, `SimulatorPurpose`, `CostCapOrigin`, `MeteredCallOrigin`, `CellTimeoutOrigin`, `ModelRoleOrigin`, `RoleModelOrigin`, `ReasoningEffort`, `OutOfRunPurpose` and `RefusalKind` are `str` rather than a `Literal`, so `get_args` on one returns nothing: read the values this build knows from `USAGE_ROLES`, `SIMULATOR_PURPOSES`, `COST_CAP_ORIGINS`, `METERED_CALL_ORIGINS`, `CELL_TIMEOUT_ORIGINS`, `MODEL_ROLE_ORIGINS`, `ROLE_MODEL_ORIGINS`, `REASONING_EFFORTS`, `OUT_OF_RUN_PURPOSES` and `REFUSAL_KINDS`; a stored value outside one is refused except on a newer minor's read.",
    "A role spend line (`RoleSpend`) can name a usage role this build does not know (`RoleSpend.known` is False), listed after the known roles.",
    "`CoreDocumentModel.from_json` is the stored read (`from_dict` of the decoded object, which upgrades and keeps a newer minor's fields), and `to_json` encodes `to_dict`.",
]
