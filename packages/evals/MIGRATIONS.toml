[[release]]
version = "0.78.0"
since = "v0.77.0"
summary = """
The spend ceiling is no dimension of the rig: two launches on one template that differ only in the `max_cost_usd` they
were given are one test setup, so their arms pool, pair and read an interval. Each arm's depth is stated beside every
reading and frontier point, a comparison of pass^k names the depth it is read at (min(k), owner 2026-10-24), the arms
it is unmeasured for and whether they share a case, and each floor its worst case and margin, all as structure the
page and the writer read. Code no longer reads the memo writer's prose: the page prints the memo's words as written,
and the generator's repair round refuses on structure only. No public name has moved or been removed since 0.77.0,
and no judge wording changed. The bundle shape (63, then 64), the cell model, the page and campaign-bundle shapes, the
seeded writer prompt and the opt-in model are in `notes`. A resumed run is no longer refused when its candidate kind or
its cells' or turns' deadlines moved (0.77.0 pinned them; a take-up wires them as a launch would now).
"""
notes = [
    "Removed with the prose gates, no replacement (code no longer reads writer prose; owner, 2026-10-24): the submodules `threetears.evals.analysis.null_claims`, `threetears.evals.analysis.arm_mentions` and `threetears.evals.analysis.report.memo_style` (`MemoStyle`), and `threetears.evals.analysis.style.fix_prose`, `style.discounts_by_age` and `style.LABEL_CLAIMS` (the word list the 0.70.0 note pointed hosts to). None was on the declared surface (`api/surface.json`); a host importing one gets an ImportError and drops the import. The rules they enforced stay in the seeded writer prompt, and a host measures them with its own reporter rubric.",
    "A reporter label's form follows its dimension's scale (owner, 2026-10-24; durable v16.2). `ReporterLabel` gains `verdict` (`LabelVerdict`, new in `threetears.evals.analysis.reporter_kind`: `pass` or `fail`) for a pass/fail dimension, and `direction` is now optional (default null), kept for an ordinal one. Exactly one is set, and a label holding both or neither is refused when it is built. The freeze refuses a label whose form is not the scale of the criterion it stamps (`LabelCriterion.scale`). No 5-to-2 mapping is added, so a label stored with a direction on a pass/fail dimension keeps reading, and its agreement reads null. `label_agrees(label, score)` now takes the `ReporterLabel` in place of its `LabelDirection`, which breaks a caller passing a direction: pass the label. A verdict agrees with a pass/fail score that reads as it. `ReporterLabel.memo_excerpt` (new, default null) is the recorded memo's passage a verdict is about. The freeze refuses one that is not a substring of the case's `recorded_memo`, compared after collapsing whitespace runs on both sides and trimming the excerpt's ends, and nothing else, so a passage copied from the page matches only where the page prints the writer's words as the memo does. It is no part of the verdict, but a re-freeze of the pair's verdicts quoting other passages than its live case is refused unless `supersedes` names that case, so a corrected excerpt is stored by superseding, never dropped. `LabelCriterion.scale` is now `RubricScale` (`ordinal` or `pass_fail`, the only scales a freeze ever stamped): a stored criterion naming another is refused on read, so its case is listed as unreadable by name. `LabelReading` gains `verdict` and `memo_excerpt`. `direction`, `verdict` and `memo_excerpt` are written to a case's payload only when set, so a direction label quoting no passage is stored byte-identically to v16.1. During a rolling deploy across 16.1 and 16.2, the first freeze carrying a verdict or an excerpt stops that reporter template on the 16.1 pods (its launches, prices, freezes, calibration reads and restores) until they upgrade.",
    "Code no longer reads the memo writer's prose (owner, 2026-10-24: \"as long as it does not bring back code checking prose. Bad judgment is fixed by improved prompts and/or oversight and calibration, not by code\"; and the same day: an English word list cannot read a French or Arabic memo). The page prints every memo sentence as written, whitespace aside: it no longer drops a sentence discounting a reading for when its runs ran or how far apart its arms were measured (#919), drops or replaces one proposing a sample size, `k` or cost no projection states (#846), replaces one disputing a reading a floor read either way with code's counts, drops a body sentence or replaces a title restating a measured number, drops one carrying a banned phrase or the repeated question, or rewrites a raw model id into its arm's label. The generator no longer refuses a finding title in an English null phrasing that cites no established null, or one naming an arm its finding cites nothing of, so neither buys a repair. Every rule those enforced stays in the seeded prompt, and the facts they rest on stay in the writer view (`readings[].cases_to_settle`, `runs[].k_runs`, cells' `repeats_per_case`, `late_criteria`); the package ships no reporter rubric for them, so a host catches each guard now only through its own reporter cases: a reporter template that declares a rubric dimension, or calibration labels, for the rule (the package provides mechanisms, never the rubric), and `AsRecordedReporterKind` judges the memo a campaign actually got (the per-page oversight path). A host that relied on the page dropping these sentences adds those dimensions. Structural checks are unchanged: references, the schema, and the recommendation's fields against code's readings.",
    "These Methods lines no longer appear on an aspect's or a campaign's page: 'The memo said \"…\", which discounts a reading for when its runs ran, so the page does not print it.'; 'The memo said \"…\", a sample size or cost no code computed, so the page does not print it.'; 'The memo said \"…\", which disputes a difference a floor read either way; code's sentence on that reading replaced it.'; 'N memo sentence(s) restated a measured number, described the page or repeated the question, and the tables say it instead.'; and the Methods fold `Style`, which listed each memo sentence breaking a style rule. The Methods table's `Memo style` row (`style: N violations`, `no violations left`) is gone. The page JSON shape does not move: these were rows and blocks of shapes the page already had.",
    "The first screen no longer prints a line for an arm whose label a comparative word in it contradicts (`'cheaper candidate' is not cheaper: it cost more per reply than production.`): an English word list over a host's labels. The scoreboard states each arm's cost and the readings its time.",
    "The seeded writer prompt (`EVAL_ANALYSIS_GEN_DEFAULT`) moves: rule 9's style list no longer says code lints it, and rule 7 says a label is a name, not evidence of what its arm did. It stays within its character budget. A deployment's stored `eval_analysis_gen` preset is store-master, so every host pushes the new seed (`eval_prompt_reset`).",
    "The writer view, the campaign bundle and the aspect bundle do not change shape for this.",
    "`max_cost_usd` stays a core apparatus declaration, so a kind still seats it (`JUDGE_KIND_CONTRACT`, the reporter's seats), but it carries the new `Sweepable.no_rig_coordinate` (prose: why the input contributes no coordinate to the rig) and no longer `confounds`. An apparatus input carrying it is left out of the apparatus class, so runs that differ only in their cap (two launches at 0.75 and 3 dollars, or an `Eval` arm capped at a half and at a third of one figure) are one cell, and no confound list (`apparatus_confounds`, `coverage[].confounded_by`, a divergence's), factor-aliasing read or confound catalog names a cap difference, an unrecorded cap included. The bisection still compares the cap as a plain fact, each run's summary still states it, and a run the cap stopped part-way is still marked by its status and completeness. A run resumed with a raised cap (`job_resume`) no longer moves to another rig. Registration refuses `no_rig_coordinate` on a lever or a label, blank, or beside `confounds`; `SweepableRegistry.confound_reason` raises `KeyError` for such an input, as for any that states no reason.",
    "The bundle shape moves from 62, which v0.77.0 shipped, to 63, and `CELL_MODEL_VERSION` from 13 to 14: every apparatus class id, cell and bundle fingerprint moves over unchanged runs, and `host_declarations_digest` reads whether each sweepable is a dimension of the rig, so it moves for every host. A stored analysis frozen over a shape-62 bundle still loads and is listed, with `AnalysisLine.needs_regeneration` set and its verdict reading `Needs regeneration: ...`; its report and page are refused, naming the bundle's shape, until it is generated again (`analysis_generate`). A host regenerates each such analysis and drops nothing else: `REGENERABLE_SCHEMA_VERSION` stays 13, so insights and judge profiles keep reading. A frozen reporter case holding a shape-62 bundle is refused on rebuild and is frozen again.",
    "Whether an input is a dimension of the rig has one owner: `Sweepable.rig_dimension` (apparatus, and no `no_rig_coordinate`), with `SweepableRegistry.rig_dimensions` listing them; the apparatus class, the apparatus-confound registration rule and `host_declarations_digest` all read it. The digest's per-sweepable flag is now `rig_dimension` (false for a lever or label, which are no part of the rig), so every host declarations digest moves once over unchanged declarations. Registration refuses `no_rig_coordinate` on an input a `RolePins` pins: a role pin identifies who filled a seat in the rig.",
    "Depth is stated, and nothing read changes (owner, 2026-10-24): the bundle shape moves from 63 to 64 (after the spend ceiling's 63 above), so a stored analysis frozen over a shape-63 bundle is listed as needing regeneration and its report is refused until it is generated again. Added, each defaulted: `ArmScoreboard.depth` (`Depth`, exported from `threetears.evals.analysis` with `Precision` and `ModelPassHatK`: usable `cases`, `trials`, and `repeats_min` / `repeats_median` / `repeats_max` per case), `FloorContrast.case_trials` (each side's usable trials per case, aligned with `case_values`, on the overall pass rate) and `FloorContrast.case_passed` (each side's trials passed per case beside them; a misaligned pair of either is refused), `AspectReading.control_depth` / `arm_depth` and `PairReading.first_depth` / `second_depth`, `depth_differs` (the paired cases the two arms ran a different number of times) and `precision` (`Precision`: the interval's half-width, each side's own, `limited_by`, and `within_case` / `between_case` / `between_share` from `stats.variance_components` and `stats.paired_case_variance`), and on the frontier `FrontierPoint.depth` (what its headline cell delivered), `n_cases_short_of_k`, `common_pass_hat_k`, `n_common_cases`, `n_cases_left_out`, and `SubjectFrontier.common_depth` (the fewest runs any point gave a case every point shares, over those cases) and `unmeasured_for`. The pass^k row (`compute_pass_hat_k`, `pool_pass_hat_k`, a run summary's rows) gains `n_cases_short_of_k`, described in the measure catalogue. `stats.bounded_mean_interval` and `stats.contrast_cases` are new. Every existing field keeps its value: the frontier still ranks at the planned `k`, and a reading's interval, change and counts are unchanged.",
    "Depth on every surface (owner, 2026-10-24). The campaign page adds three tables after the kind's own: `Depth` (each arm's cases, trials and fewest / median / most repeats per aspect), `Pass^k depth` (each frontier point's planned depth, cases short of it, the common depth, its pass^k there and the cases it leaves out) and `Precision` (each comparison's half-width, each arm's own, the arm limiting it and the between-case share), each with one sentence under it where it applies; the Methods add how a pass-rate interval weighs its cases. The glossary gains `depth`, `common depth` and `between cases`. No code checks the memo's prose for depth (owner, 2026-10-24: bad judgment is fixed by prompts, oversight and calibration); the page states it itself, and a subject whose arms share no case says so (`SubjectFrontier.shares_no_case`). The writer's view of each aspect gains `depth` (`arms`, `differ`, `said`, `pass_k`: one entry per frontier subject with `where`, `k`, `common_depth`, `shares_no_case`, `unmeasured_for`, `said`, and, where the host asked for the model, `pass_k_model`: by subject (its `where`, as each `pass_k` entry is), then arm) and each reading and pair `precision`. Rule 5 of the seeded writer prompt now reads the aspect's `depth` and forbids comparing on pass^k above the common depth, so every host pushes the new seed to its `eval_analysis_gen` store (`eval_prompt_reset`). The frontier text states each contestant's delivered depth and its subject's common depth. Shapes: `CAMPAIGN_JSON_SHAPE` 4 (`readings` carries the new reading fields) and `CAMPAIGN_BUNDLE_SHAPE` 2 (a frozen campaign bundle or frame of shape 1 is refused, as an aspect bundle of an older shape is). The to-settle note under the page's table is split into shorter sentences.",
    "One opt-in model (owner, 2026-10-24): `HostProfile.model_pass_hat_k` (new, default `False`) asks the frontier for a beta-binomial pass^k at each contestant's unreached planned depth, fitted by the method of moments over its per-case pass shares (`ModelPassHatK`, exported from `threetears.evals.analysis`: `basis: \"model\"`, `k`, `pass_hat_k`, `alpha`, `beta`, `cases`, `assumes`). It sits on `FrontierPoint.model_pass_hat_k` (part of bundle shape 64), is read after dominance, and nothing ranks, bars or gates on it; a contestant every case of which ran once is not fitted. The page shows it in its own `Model-based pass^k` table with what it assumes, the writer's view under `depth.pass_k_model`, and the frontier text beside the contestant, each labelled a model. A host that leaves it off sees nothing change.",
    "Floors are read apart from the aspect they sit on (owner-approved, 2026-10-24): `FloorStatus` gains `margin` (a rate floor's points), `worst_drop` (the largest drop its deciding rate's interval allows) and `short_by` (for an `unclear` floor only: `worst_drop` less `margin` where positive; null for a held floor, for a broken one, whose breach its interval and reason carry, and for a cost floor; `margin` and `worst_drop` are null for a cost floor). The writer's view lists `pass_rate_verdicts` (each arm's pass-rate reading per aspect, with its change) before `floors`, and each floor carries `speaks_for` (the rate it read, or the cost per reply for a cost floor), `worst_drop`, `margin` and `short_by` beside its status. Rule 11 of the seeded writer prompt says an `unclear` floor is not yet shown within the margin, never failed, and speaks for its check alone. Part of `CAMPAIGN_BUNDLE_SHAPE` 2 and `CAMPAIGN_JSON_SHAPE` 4.",
]

[[release]]
version = "0.77.0"
since = "v0.76.0"
summary = """
A change's row reads `within_margin` ("no worse than the margin") where its floor holds, and the seeded writer prompt
names the new reading, so every host pushes the new seed (`eval_prompt_reset`). An interrupted run, sweep or launch
resumes as the same job (#918): `job_resume` takes it up under its lease's next
epoch, runs only the cells it has not measured, in their original order, and it ends as an uninterrupted run would
have; `jobs_resumable` lists what it would take up, for a host to offer at boot. Past runs that are still valid count
as evidence (#919): a campaign adopting them (`aspects_from`) reads exactly as one declared before them, each criterion
set after its readings were visible is disclosed on its own, and neither when the runs ran nor how far apart they ran
is said or read as a defect. One public name has been removed since 0.76.0 (`QuestionAfterRuns`, provisional, for
`LateCriterion`), and no judge wording changed. The new names are provisional. The stored shapes (core v15.7,
additive), derived cell result ids, epoch fencing, the bundle and page shapes and the behaviour a host sees are listed
in `notes`. Runs pool across case sets and across an identity bump (#919): `IDENTITY_VERSION` 25 takes the case set out of
the context key, and a frontier point names every pass^k cell beside its headline, each with its reading and why.
"""
notes = [
    "A change's row reads `within_margin` where its candidate is neither shown better nor shown worse and its drop is shown to stay within the aspect's margin: `AspectReading.reading` (`ShownReading`, provisional) takes that fourth value, the page's By aspect table reads it `no worse than the margin` (`campaign_page.READING_WORDS` gains the key), and an analysis listing's verdict line says it the same way. A host matching on `reading` handles the new value. It is read at the nominal 95% with no correction, by the floor's own reading of the pass rate, so an aspect whose `RateDrop` floor on the pass rate holds at the margin's points no longer reads `unclear` in the headline table beside a `held` floor (Discodon, 2026-10-22); where a floor and a row still part, on the points or on a check's rate, a line under the table says which. `AspectReading.within_interval` (new, default `None`) carries the nominal interval the reading is read on; the writer's view of each reading carries it as `within_interval`. An unclear row's `projection` (the `To show no worse than the margin` table) is counted at that same level, not the row's corrected drop level, so its count is its floor's count where the two read the same rate and points. A row no worse than the margin licenses nothing by itself: the switch still turns on the declared floors. The seeded writer prompt's description of `readings` names the new value (no rule changed; with #919's rule-11 changes the prompt is 24,253 of the 24,300 characters), so every host pushes the new seed to its `eval_analysis_gen` store (`eval_prompt_reset`), or its writer is told readings are only `better`, `worse` or `unclear`.",
    "`IDENTITY_VERSION` 24 -> 25 (#919): `ContextComponents.case_basis` digests the subject and the template, no longer the frozen `test_case_ids`, so every stored run's context key re-derives on read (`resolve_context_identity`) and nothing stored is rewritten. A host that pins context-key or `case_basis` goldens re-derives them at 25. Two runs of one variant and context over different case sets now pool into one pass^k cell, covering the union of their cases. A frontier or history contestant whose run recorded its lever map is placed at this version where today's predicate reproduces its key, so the bump splits no contestant. A run whose cases were written by a different `variation_model` pools too: its cases are cases of their own ids. A host that groups on the stamped `context_key` itself (a pivot on it) separates runs stamped before the bump from runs after it; pivot on `context_identity_version` to read them apart.",
    "The pass^k cell is one typed record, `PassHatKCell` in `threetears.evals.kernel.scoring` (not a public root), built by `pass_hat_k_cell(run, profile, served=...)`: the context resolved at this version, the template id and the run's frozen `template_digest` (a template edited in place keeps its id), the apparatus provenance and the models the provider's responses named for the candidate's calls (`RoleUsage.served_model`). A run that froze no digest (every run stored before `EvalRun.template_digest`), or whose responses named no model, is a cell of its own, keyed by its run id as a run with no `context_key` is, and is kept out of its point's headline with the reason `no_recorded_template` or `no_recorded_served_model`: a silence is never evidence of a match, so such a run pools with nothing, and only runs that record both pool. A run stamped before the bump that froze its digest and named its served model pools by re-derivation. A run with one candidate call whose response named no model stands apart whatever its other calls named; a run whose candidate made no model call recorded that, and pools on its other fields. A candidate requested by a floating alias the provider echoes back (an OpenRouter `~`, `-latest` or `openrouter/` id records no `served_model`), or called through a host client whose `CompletionResult` reports no model, stands apart run by run: a host that wants its runs to pool requests a concrete model id, or reports the served model. A headline that is itself a cell of one run (every run of the contestant silent) says so on its own line where other cells are kept out beside it; a point of one cell says nothing of its cells; `model_identity_disclosure` still names the unconfirmed identity. A run whose context can no longer be re-derived (subject state its host no longer declares) is a cell of its own rather than failing the frontier read. `pool_pass_hat_k_attempts` keys a unit `(cell, variant_key, model, test_case_id)`.",
    "A frontier point's `pass_hat_k`, curve, interval, bar decision, dominance and verdict read its headline cell alone, chosen in the one order `PassHatKCellReading` states (a recorded, resolved context first, then a cell that pools before a cell of one run, then most runs, most results and the first run id): a run of another cell no longer counts in them. `FrontierPoint.pass_hat_k_cells` (`PassHatKCellReading`, `UnpooledReason`: `changed_context`, `no_recorded_template`, `other_template`, `no_recorded_served_model`, `other_served_model`, `no_recorded_context`; provisional, from `threetears.evals.analysis`) lists every cell, the headline first, each other with its own pass^k and its reason; `frontier_text`, the report page's run disclosures (`DisclosureBlock` source `runs`) and the campaign bundle's writer view (`disclosures.pass_k_unpooled`, `{reading, by_arm}`) name each through `pass_hat_k_cell_lines` (the writer view through `pass_hat_k_cell_lines_bounded`, one line per reason per arm where several cells share a reason, naming the first run ids and how many more), after one sentence saying what kept out covers (`PASS_HAT_K_CELL_READING`): the frontier's pass^k, bar and verdict only, since the arm's tables, cells, composite, cost and latency still pool every run of the variant under one rig. The writer view keys `pass_k_unmeasured` and `pass_k_unpooled` by arm, so two arms on one model stay apart. The bundle shape is in the shape note below.",
    "One case-set comparison, `case_set_fingerprint` (template and sorted `test_case_ids`, `threetears.evals.kernel.identity`): `CaseSetIdentity.fingerprint` is it and never None, the `case_set_unresolved` badge (`BADGE_CASE_SET_UNRESOLVED`, not a public root) is removed, a case-only difference badges `case_set_differs` and no longer `context_differs`, a history's suite boundary reads it, and a take-up compares the same sorted ids: one whose launch would run other cases is refused naming those left out, added or listed another number of times, while the same cases in another order are no change.",
    "Core schema v15.7, additive, so a store written at v15.6 is read as it is and needs no upgrader: `JobLease.epoch` and `JobLoss.epoch` (0 on one stored before), `EvalResult.lease_epoch` and `EvalResult.superseded_spend_usd` (0 on a row stored before), `EvalResult.metered_calls` (None on a row stored before) and `EvalResult.account_refused` (False on a row stored before), `EvalRun.lifetimes` (`RunLifetime`, empty until the run is first resumed) and `EvalRun.template_digest` (None on a run stored before), and on `EvalSweep` `arguments` (`SweepLaunchArguments`), each arm's `arguments` (`SweepArmArguments`), `launch_group_id` and `lifetimes` (`SweepLifetime`).",
    "A run's cell result takes an id derived from (run id, case id, model, k), `cell_result_id` in `threetears.evals.schema.models`, no longer a fresh uuid7, and the store writes a run cell create-only, so each cell has one row however many processes write it. Readers order a run's results by insertion, never by id. A host that sorts results by id to get them in time order must sort by when they were stored instead.",
    "A lost or superseded holder writes nothing more: once a run is written lost, or taken up at a higher lease epoch, the old holder's cell writes and record writes are refused. This fixes cancelled rows landing in a run already written lost, which a fenced or shut-down holder used to write as its in-flight cells unwound. A graceful shutdown no longer writes lost over a record whose lease has passed to another holding.",
    "A pod from before epochs that is still alive during a rolling deploy does not enforce epoch fencing: it can still write a cell into a run another pod has resumed. Finish the rollout before resuming a run that pod held, or let its lease lapse first.",
    "`job_resume` (spend; `job_id`, optional `max_cost_usd`) takes up a lost, cancelled, `budget_stopped` or `exhausted` run (`run:<id>`), and a lost, cancelled or timed-out sweep (`sweep:<id>`) or launch (`launch:<id>`), as the same job, under its lease's next epoch. A `completed` or `failed` run is never resumed. A resume refuses, naming every difference, when a launch of the run now would measure otherwise; host labels and a template edit that changes nothing measured are recorded on the run's lifetimes, not refused. Nothing resumes on its own: `jobs_resumable` (read) lists what `job_resume` would take up, for a host to offer at boot after `sweep_abandoned_runs`. `job_resume` replays the kind's launcher inside its call, so a launcher must make no model request when it rebuilds a stored run.",
    "`jobs_resumable` lists sweeps and launches under `groups`, each with its arms' states, and lists their arm runs there only, not among `jobs`. It leaves out an archived run, and a sweep or launch whose every run is archived: archiving a run is how an operator declines it. It does not check whether a run would still measure as it did; `job_resume` checks that before anything is spent.",
    "A run stored before `template_digest` resumes only while its template is unedited since the run started, since what an edit changed can't be known. A run launched at this release resumes past an edit to its template's name, description or archive flag, and records it as `RunLifetime.template_edited_at`.",
    "A sweep stored before this release that has an arm it never launched is refused as a whole by `job_resume sweep:<id>`, naming the arm: launch that arm with `run_launch`, and resume each other arm with `job_resume run:<id>`. An interleaved sweep launches every arm together, so a lost interleaved sweep has no such arm. A resumed sweep's arms run under its original launch group, interleaved arms as one group in their original order and sequential arms in order.",
    "A resumed run's cost cap counts every attempt its stored rows record (`cost_usd` plus `superseded_spend_usd`), a lower bound when a holding was lost to a hard kill (`RunLifetime.spend_lower_bound`). It runs under its stored cap, or the raised `max_cost_usd`, never the host's current cap, and a stored cap above a ceiling the host has since lowered is refused until one of them moves. Its metered-call ceiling counts the metered calls its stored rows record (`EvalResult.metered_calls`, none on a row stored before this release), and a run whose stored cells have reached the ceiling it would resume under is refused: `job_resume` cannot raise a metered-call ceiling, so raise the host's `max_metered_calls` for a run that inherited it, or launch the template again for one whose launch chose it. The cells of an `exhausted` run its provider account refused (`EvalResult.account_refused`) run again on resume, written over their rows. A shutdown releases a job's lease and keeps its epoch on the loss (`JobLoss.epoch`), so every take-up holds an epoch above every earlier one. `LaunchRequest.resuming`, `execute_run(..., stored=)` and `LaunchGroup(group_id=)` are new keyword arguments with defaults; a host's launcher passes the request through to `launch_run` as before.",
    "Criterion-selection risk is disclosed per criterion, and data age is no signal (#919; owner, 2026-10-23: \"Post hoc should not matter\"). `ReadingScope.question_after_runs` (`QuestionAfterRuns`) is replaced by `ReadingScope.late_criteria`, a list of `LateCriterion` (new in `threetears.evals.analysis`, provisional): `criterion` (`aspect`, `control`, `margin`, `bar`, `guardrail` or `floor`), `name` (a bar's measure, a guardrail's dimension, a floor's key, else null) and `set_at` (ISO-8601, or null when no orderable time is recorded). A criterion is listed when it was set after the aspect's first stored result (`first_result_at`, now over the results of the runs the aspect reads), or carries no time; when the runs were created, and when the campaign was declared, never count. Each criterion's time is read where it is stored: the aspect's `asked_at` (also the time of its bars and guardrails' margins, and of a margin or floor declared with it), `Aspect.margin_declared_at`, `Floor.declared_at` and the control's `CampaignArm.named_at`. The aspect and its control are timed only where a question asks the aspect: with none asked every reading is a lead and the control is kept, so when they were chosen decides nothing. A margin, a bar, a judged guardrail's margin and a floor are timed whatever is asked, since each reads or warns on the page either way (a guardrail breached or not yet shown safe opens the first screen); under a question a guardrail's margin carries the aspect's own time, which the aspect's line names, so it is not listed again. A control upgraded from a v15 campaign carries no `named_at`, so where its aspect is asked its pages say 'When the control was named is not recorded.' A result whose `scored_at` cannot be ordered is left out of `first_result_at` and counted in `ReadingScope.untimed_results`, and the page says whether a criterion came after it is not known. No stored campaign shape moved.",
    "Which campaigns read as declared before their runs. A campaign adopting another's aspects (`aspects_from`) keeps their times, so over runs that are still valid it reads exactly as the campaign that declared them did. Runs added to an existing aspect (`campaign_runs_add`) change no criterion's time: where their results were stored before the aspect's criteria were set, those criteria are named as set after their readings, which is true. Known gap, disclosed and not fixed: an aspect adopted from a campaign that asked no question keeps its source's `asked_at` when the adopting campaign asks one, so its being put to the question after its readings were visible is not named.",
    "An eval's campaign (`Eval(...).run()`) asks no question, so its control is never timed: one filed before this release, once its arms had run, reads as it did unless it declared judged guardrail margins (a `Judge` with guard margins), whose margins it dated at filing, after its results, and which its page now names as set after its readings; re-running the eval files it dated at launch. A new eval's campaign is written once, dated when the call launched its arms (`create_campaign`'s new keyword `declared_at`, server-side and absent from the `campaign_create` action: when the caller fixed what the create declares, where that was before now; refused unless ISO-8601 with an offset).",
    "The page says each late criterion once, under the question (`DisclosureBlock` source `timing`), grouped across aspects: 'The margin on <aspect> was set on <date>, after its readings were visible.', 'The aspect <aspect> was declared on …', 'The control was named on <date>, after the readings on <aspect> were visible.', 'The <measure> bar on …', 'The <dimension> guardrail's margin on …', 'The floor that … on …', or 'When the margin on <aspect> was set is not recorded.'. No line names the question or when the runs began, and the separate 'declared after its first result' lines under the table are gone. A campaign of no question now says its late bars too. Each aspect's own page says its own, `analyses_list` puts them after the warnings and before the verdict, and the Methods 'Design' row reads 'question declared' or 'exploratory'. The page JSON is `CAMPAIGN_JSON_SHAPE` 3: `aspects[].question_after_runs` is replaced by `aspects[].late_criteria` (a list, empty where none). `AspectDeclaration.question_declared_at` is gone, and a control named late no longer re-dates `AspectDeclaration.asked_at`.",
    "A memo sentence discounting a reading for when its runs ran (data called old or pre-existing, runs predating the question, a reading taken 'post hoc', arms measured apart) beside a discount (weaker, provisional, only a lead, owed a rerun, not one experiment, a confound) is dropped wherever it stands, a summary or a finding's title included, and listed in the methods ('The memo said “…”, which discounts a reading for when its runs ran, so the page does not print it.'). A sentence naming a real change between the arms, or a criterion set after its readings, is kept.",
    "Time apart is no confound (owner, 2026-10-23): arms and runs measured minutes, hours or days apart are one experiment while nothing that decides their result changed. `AnalysisContextBundle.measurement_window_disclosure` is gone from the bundle, the page's Methods and the writer's view (`measurement_windows`, the structured spans, stays); `launch_disclosure` is set only where a launch ran its arms `concurrent`, co-loading its providers, never for runs started in separate launches or arms run one after another. The lens tools (`runs_compare`, comparison sets) keep their `measurement_windows_disjoint` badge and their sentence as a plain fact, without its closing 'is not attributable to the runs alone'. Interleaved stays the default arm schedule: it costs nothing and absorbs a provider's bad minute, and no wording calls arms run apart a weaker experiment.",
    "The bundle shape moves from 60, which v0.76.0 shipped, to 62 (`reading_scope.late_criteria` and `untimed_results` added, `measurement_window_disclosure` and `declared.question_declared_at` removed; each frontier point's `pass_hat_k_cells`, its pass^k read off its headline cell, and a comparison set's case-set fingerprint never None). A frozen reporter case holding a shape-60 bundle is refused on rebuild and is frozen again. A stored analysis frozen over a bundle of another shape still loads and is listed, with `AnalysisLine.needs_regeneration` set and its verdict reading `Needs regeneration: ...`; its report and page are refused, naming the bundle's shape, until it is generated again (`analysis_generate`). A host regenerates each such analysis and drops nothing else: `REGENERABLE_SCHEMA_VERSION` stays 13, so insights and judge profiles keep reading. The writer's view drops `aspects[].question.after_runs` and adds `aspects[].late_criteria` (`[{criterion, name, set_at}]`, dated as the page dates them, absent where none). The seeded writer prompt (24,253 characters, #916's line included) asks the summary to name each once, never to discount a reading for when its runs ran or arms for running apart, and drops the guidance that read runs measured at different times as a soundness fact: a writer prompt, not judge wording, so no judge identity moves, but every host pushes the new seed (`eval_prompt_reset`).",
]

[[release.change]]
from = "threetears.evals.analysis"
to = "removed"
names = ["QuestionAfterRuns"]
why = """
It disclosed the aspect's question as one unit, dated against when the aspect's first run was created: data age, not
criterion visibility. `LateCriterion` (in `ReadingScope.late_criteria`) names each criterion set after the first stored
result of its aspect, or carrying no time, on its own; see `notes`.
"""

[[release]]
version = "0.76.0"
since = "v0.75.0"
summary = """
No public name of 3tears-evals has moved or been removed since 0.75.0, and no judge wording changed. The family moves
to 0.76.0 for new public API in 3tears-core, 3tears-datasources and 3tears-nats (l3.truncate, l3.tx.copy,
load_files, counted partitioned exports, KV replicas).
"""
notes = []

[[release]]
version = "0.75.0"
since = "v0.74.0"
summary = """
The campaign page opens on the writer's summary across its aspects, then the recommendation, then the aspects; the
analysis listing, the page JSON and the aspect label follow the page (Discodon's #864, #895, #880, #879); a question set
after an aspect's runs is disclosed, never demoted (#901); a candidate held on every asked floor may be recommended
(#910); a call the provider declined is excluded, never charged to the candidate, and `ProviderFailure` says whose
failure a call was in one `owner` (#849); a person's rating is recorded only when the host vouches for the person
(#848); each memo finding traces to the readings and trials behind it (#629); the job lease's numbers move to `schema`,
as host contract, and a lease holder's own writes extend its lease (#825, #811). Two public names have moved since
0.74.0 (`DEFAULT_JOB_LEASE_S` and `LEASE_POOL_WORKERS`, kernel to schema, with no shim), and no judge wording changed;
the other breaking changes are stored shapes, a page shape, behaviour, and the failure owner on `ProviderFailure` and
`ProviderError`, which every host describer must move to before it upgrades, all listed in `notes`.
"""
notes = [
    "One memo per campaign reads across its aspects: `AuthoredCampaignAnalysis.summary` is required of every kind (#864). Regenerable schema 12 -> 13: a stored analysis, insight or judge profile from before is refused on read. Run `EvalStorage.drop_derived(scopes)` once before deploying, record each returned `DroppedJudgeProfile` again with `judge_profiles_record`, then `analysis_generate`. Anything that builds or reads an `AuthoredCampaignAnalysis` handles `summary`.",
    "The seeded writer prompt asks for the summary in rule 11 (23,908 characters, 13 rules): a writer prompt, not judge wording, so no judge identity moves, but every host pushes the new seed to its `eval_analysis_gen` store (`eval_prompt_reset`). A stored prompt from before never asks for `summary`, which the response schema requires.",
    "The campaign page's first screen reads warnings, question, the writer's summary (`TextRole` `summary`; in HTML `data-role=\"summary\"` in the header), the recommendation (now above a choice's pairs), then the aspect table, pairs or measures, To settle, bars and the call, then findings and folds. The summary also leads the one-aspect page's memo and `render_memo_as_written` (which now opens `## Summary`, the question line with it). A host pinning the rendered page's order updates its pin.",
    "`analyses_list` (`analysis_verdict`) leads each analysis's line with every missed bar, then every broken floor, in the page's own words over what was frozen with the analysis (`campaign_page.campaign_warnings`), then the verdict; one aspect or several (#895). A host matching on the line's start updates its match.",
    "`report_read(format='json')` / `campaign.json` is `CAMPAIGN_JSON_SHAPE` 2: `recommendation` is `{arm, variant_key, confidence}` (#880). Match a recorded call to it by `variant_key`, not by label. `CampaignReport` gains `recommended_variant_key`, and `build_campaign_report` takes `recommended_variant_key=` and refuses a memo recommendation without it (pass `EvalAnalysis.recommended_variant_key`).",
    "A question asked after an aspect's first run no longer demotes its readings (#901; owner, 2026-10-21: disclosed, not enforced). It builds its own comparison family, scopes the reading scope and the verdict order, and its rows and pairs read `confirmatory: true`, as a question asked before the runs does; a change's memo may recommend a candidate on them. `ReadingScope.question_post_hoc` is gone; `ReadingScope.question_after_runs` (`QuestionAfterRuns`, new in `threetears.evals.analysis`, provisional: `late` (`question`, or `control` for a control named after the first result while the question came first), `at` (null when no orderable time is recorded), `first_run_at`; a time that is not ISO-8601 with an offset is refused on construction and on read) is set instead, and `question_declared` / `confirmatory` now mean the campaign asks the aspect a question, whenever it was asked. The bundle shape is 60: a frozen reporter case holding a shape-59 bundle is refused on rebuild (a field the model no longer declares) and is frozen again; stored analyses are already dropped by regenerable 13. The page says it once under the question (`DisclosureBlock` source `timing`, new; 'The question was set on <date>, after the runs began on <date>.' or 'The control was named on <date>, …', each date in its stamp's own offset, as the rest of the page dates, with times of day and offsets where the later falls on no later day), each aspect's own page does too, `analyses_list` puts the same sentence after the warnings and before the verdict, and the page JSON (`CAMPAIGN_JSON_SHAPE` 2, unchanged since it is unreleased) gains `aspects[].question_after_runs` (the flag, raw, or null). A margin or floor added after a late question is still said as declared after its first result. The Methods 'Design' row reads 'question declared before the runs' (was 'before the run'), or after them, undated, or with the control named after them. The exploratory disclosure `POST_HOC_EXPLORATORY` and its 'asked after the first run, so its readings are leads' page line are gone. The writer's view renames `aspects[].question.asked_in_time` to `asked`, drops `post_hoc`, and adds `after_runs` (`{late, at, runs_began}`, dated as the page dates them); rule 11 of the seeded writer prompt asks the summary to say it once, or that it has no date (24,050 characters), so the seed push above carries it too.",
    "A finding's trace (#629), in HTML: each figure in a finding's readings table links to a cell printing the same figure of the same reading on the same arm (a contrast's arm or control figure, a guardrail's mean, a one-arm page's reading, the scoreboard's cost per reply), never to a different number (a contrast that read fewer cases prints a paired mean and is not linked to); a figure printed only in the closed `Bars` table links to that table's fold (`<details id=\"t-bars\">`, `TableBlock.anchor`). Each trial id in a finding's `Evidence` fold links to `#trials`. On a campaign's page each finding's `Evidence` fold holds a `trace` table (`Aspect` where there are several, `Arm`, `Reading`, `Value`: the figure code filled, or a trial's id in its aspect's fold), each value linked to `#aspect-<fold id>`. No link on either page lands inside a closed `<details>` the reader has not opened (not every browser opens one for a fragment link, and the page runs no script): every `#` link is drawn to the nearest place outside such folds. Visible link changes: the nav names `#<section>` for a folded section (was `#<section>-body`) and `#aspect-<fold id>` for an aspect (was `#aspect-<fold id>-body`); a glossary term links `#glossary` (was `#g-<term>`; the `g-<term>` ids stay); a case's trial id links `#trials` (inside an aspect's fold, `#a-<fold id>-trials`; was `#T<n>`); a trial id the page does not hold is not linked. A campaign page's glossary defines a term two columns of one table link once (it was defined twice). A finding whose trace reaches nothing gets a `DisclosureBlock` (source `memo`, its `finding`, fold `Evidence`) reading `No contrast, guardrail, bar or cost on this page shows this finding's figures.` Page shape: `TableCell` gains `anchor` (the id the cell carries) and `ref` (the id it links to), both null by default; `Report` refuses a `ref` no cell or block carries and an `anchor` carried twice, and `CampaignReport` a `ref` other than a fold's section. `build_campaign_report` takes `resolutions=` (`EvalAnalysis.resolutions`) and `trial_ids=` (`CampaignBundle.trial_ids()`); without them a finding traces no reading or no trial. In `threetears.evals.analysis.report.model` (not a public root): `reading_anchor`, `fold_ids` (now numbering on until a fold id is unused, so labels like `Billing`, `billing-3`, `billing` no longer share one) and `FOLDED_SECTIONS`; in `report.words`, `UNTRACED` and `evidence_figure`; in `analysis.campaign_bundle`, `campaign_trial_ids`, the one rule `T1` … `TN` is numbered by. A host pinning the rendered page or matching on a finding's fold updates its pin.",
    "The job lease's numbers are defined once, in `threetears.evals.schema` (#825), host-contract, so a host sizing its database pool reads them without loading the kernel: `DEFAULT_JOB_LEASE_S` (60.0), `JOB_LEASE_RENEWAL_FRACTION` (1/3, new: a lease is renewed every `job_lease_s * JOB_LEASE_RENEWAL_FRACTION`) and `LEASE_POOL_WORKERS` (8). `DEFAULT_JOB_LEASE_S` and `LEASE_POOL_WORKERS` leave `threetears.evals.kernel` with no shim (recorded below): `LEASE_POOL_WORKERS` was host-contract there, and moves without a deprecation cycle by the no-back-compat ruling, which Discodon follows at its re-pin. What Discodon changes then: `discodon/evals/host.py` imports `LEASE_POOL_WORKERS` from `threetears.evals.schema`; `tests/unit/database/test_sync_pool_lifecycle.py` imports `DEFAULT_JOB_LEASE_S` and `LEASE_POOL_WORKERS` from `threetears.evals.schema`; the docstrings in `discodon/config/sections/eval.py` and `discodon/db/pool_policy.py` name `threetears.evals.schema.*` instead of `threetears.evals.kernel.*`; and the mirrors in `discodon/db/pool_policy.py` import the three from `threetears.evals.schema`, which loads no kernel, in place of their copies. The declared surface is 540 names (`DECLARED_CEILING` 529 -> 540, owner-approved): the three lease numbers, then the nine provisional names Discodon's 2026-10-22 import rescan binds to, promoted to stable: `analysis.CampaignBundle`, `analysis.assemble_campaign_bundle`, `kernel.Aspect`, `kernel.host.UNSEATED_LEVEL`, `run.quote_launch`, `schema.FailureOwner` (#849), and `testing.READER_CONFORMANCE_CASES`, `testing.ReaderConformanceCase` and `testing.ReaderSample`. Nothing moves; each name is now on the declared surface, and a move is recorded here.",
    "A lease holder's own writes of its record extend its lease as a renewal does (#811): a run's progress and status writes, and every `write_held_record` (a launch's, a sweep's, an analysis attempt's record), go through `JobLeases.write_own` (new), which, when the writing process holds the record and the stored lease names it, writes an expiry `job_lease_s` from the store's now and counts the landed write as a renewal, handing the job a cancel asked of it. A job whose renewals keep losing their race to its own writes keeps its lease and still hears a cancel. A lease the store's clock reads lapsed is never revived: the own write writes the record lost, stops the job and raises `JobFenced` (a run's write is declined). An own write reads the store's clock once more only when the lease was last extended at least half a renewal interval ago, and never on a write that ends the job; a clock that cannot be read leaves the lease as stored and the write lands. A renewal whose store call is stuck is never followed by a second one for the same record, and the lease pool it is stuck in is retired (the next renewal makes a fresh one), so a hang abandons one thread and never shrinks renewal capacity; while it stays stuck the record is kept by its job's own writes, logged each interval, and is expired only once its lease is a whole lease unextended. A store that refuses only renewals no longer starves a job writing its record; a test store meant to fail a lease for a whole lease must fail those writes too. A renewal landing more than one and a half intervals after the lease was last extended logs `eval.job_lease ... renewal landed late` with how long since, the interval, the lease, and three waits: the loop's, the lease pool's and the store call's.",
    "A change's memo may recommend a candidate shown no worse: every floor on every aspect the campaign asks reads `held` for it, each such aspect carrying at least one floor. Until now the generator accepted a candidate only with a confirmatory `better` reading or `improved` comparison, so a campaign asking \"is the candidate no worse?\" could never recommend it by holding its floors, and its memo answered \"is it better?\" instead (Discodon, 2026-10-22). A candidate neither separated nor held on every asked floor is still refused, and the refusal now names each floor not held and each asked aspect with none. Rule 11 of the seeded writer prompt says so and asks a keep to name each floor still `unclear` (24,250 characters, 13 rules): a writer prompt, not judge wording, so no judge identity moves, but every host pushes the new seed to its `eval_analysis_gen` store (`eval_prompt_reset`), or its writer keeps answering the superiority question.",
    "`AspectDefinition.label` is optional: an aspect in `campaign_create` or `campaign_update` with no label is named `aspect_label_for(<the campaign's behavior>)` (`threetears.evals.schema`, provisional; `/` written `-`), and two unlabelled aspects in one write are refused (#879). A host that copied the rule sends no label instead.",
    "`ProviderFailure.account_refused` is replaced by `owner`, one of `account`, `provider` or `candidate` (`FailureOwner` in `threetears.evals.schema`, stable) (#849; owner, 2026-10-22: one field, no second flag, no shim). A host whose describer builds `ProviderFailure` passes `owner=\"account\"` where it passed `account_refused=True`, `owner=\"provider\"` for a call the provider declined (a 429 that is not a spent quota, or a 529 overloaded or a 503 unavailable), and `owner=\"candidate\"` where it passed `False`; an owner outside the three is refused at construction. Move the describer before upgrading: one still passing `account_refused` raises `TypeError`, which the engine contains, logs once per call and reads as `withhold_failure_detail` does (`candidate`), so an account refusal then stops nothing and the run keeps paying into a refused key. A declined call is excluded (`infra_errors`, `apparatus: ... declined ...`) and the run goes on, where it was charged to the candidate (`candidate_errors`), on every path the package runs: the reporter's generator call, the judge kind's call, and a quick run's candidate (a `ProviderError` it raises) and judge, whose host now reads failures with `providers.describe_failure`, so a quick judge's account refusal stops the run too. Only `account` stops a run. A declined repair or parse retry names itself in the record (`the generator's repair call, after its first reply was refused,`; `LLM call's parse retry, after its first reply did not parse,`). The report's `infra` loss words and remedy now say a declined call needs no fix, only a rerun. `ProviderError.account` is `ProviderError.owner`, and `describe_failure` reads any 429 but `insufficient_quota` as `provider`, and a 529 (overloaded) or a 503 (unavailable) too (owner, 2026-10-22), including the in-body code OpenRouter answers with a 200; a 500 or a 502 is an error rather than a refusal and stays `candidate`. `JudgeOutcome.account_refused` (provisional) is `JudgeOutcome.owner`, and `run_judge_llm`'s error result carries `owner` in place of `account_refused`. `CandidateOutput.account_refused` is unchanged: a kind sets it for an `account` failure alone. `ErrorLedger.add_account_refusal` (provisional) is removed: nothing called it, and the ledger takes the flag from `CandidateOutput` alone. Discodon's `tests/unit/evals/test_rationed_calls.py`, which pins `ProviderFailure`'s fields and the reporter and judge kinds as the exception to its rationing rule, is expected to go red on this release until it moves to `owner`. The package's `Model` sends a call the provider declined again before raising it (owner, 2026-10-22), whether the decline came as a status or as the code a 200's body carries: at most three attempts in all, waiting the provider's `retry-after` (seconds or an HTTP date) or one then two seconds, each resend logged at WARNING. A provider that asks to wait longer than 20 seconds is not sent the call again. Every wait and resend ends within one request's timeout of the first attempt (a resend still running then is cut, and the decline before it is raised), so a call ends one request's timeout after it started, or when its first attempt does if that took longer; a host sizing a `RequestCeiling` on `Model` sizes it so. A resend cut at the bound may already have been billed by the provider, and that spend is not recorded. A resend lost on the way (a reset, a connect timeout) raises the decline before it, never a transport error charged to the candidate. `retry=DeclinedRetry(...)` on `Model` (`threetears.evals.providers`, provisional, new) sets it, and `attempts=1` sends once, as before. A `ProviderError` sent more than once carries `attempts` (new) and says `(after 3 attempts)` in its text, which is the stored error. A failure the account or the candidate owns is never sent again. No stored field records the resends. A run that measured nothing, because every cell was excluded for an `infra` fault the harness recorded on it (a provider that declined every call, a candidate that could not be built, mixed with apparatus faults or not), now ends `failed` where it ended `completed` (owner, 2026-10-22): `execute_run` raises `NothingMeasuredError` (`threetears.evals.run`, provisional, new) after the last cell is stored, beside `EveryCellApparatusFailedError`, which still names a run the rig alone excluded, and the run's error quotes up to three distinct cell errors (the status and the provider's message). So a sustained decline or an OpenRouter model no allowed provider serves reads as a setup fault, the quick command exits 1, and the page, reading the run's stored status, leads `No verdict: nothing was measured, because the test setup failed or the provider declined every call.` with a remedy to fix the cause before a rerun, never the wait a declined call otherwise gets; a run a cap, a cancel or an earlier build ended keeps its own words, and a run the account stopped (`exhausted`) is told to top up the account or fix its key. A run lost only to judge-call errors still completes, since a re-judge recovers it, as does a run lost entirely to a judge that could not tell or to judge replies cut off at their cap. The run records why on a new field, `EvalRun.failed_because` (core v15.6, additive: an open vocabulary, today only `nothing_measured`; None on every other run), written by the job manager; an older build reads such a run and keeps the field unread. A sweep reads the field and goes on past an arm that measured nothing, naming it on the completed sweep's detail (`job_poll` now shows a completed sweep's detail); any other failed arm still ends it. A host test running a single cell that ends excluded by the harness now sees the run raise.",
    "A person's rating relayed by a caller is recorded as the person's through a new action, `result_rate_person` (`write`; `result_id`, `rubric_dim`, `score`, `rating_reason`, `person`, `rating_source`, optional `rated_at`; #848), only when the host vouches for it. To enable it, build the host with `EvalHost(attests_person=<check>)` (new field, default `None`), a callable `check(*, scope_id, caller, person) -> str | None` (`AttestsPerson`, new in `threetears.evals.kernel.host`, provisional) that returns the host's own name for `person` when `caller` (the call's `Caller.identity`) relays their ratings in that scope, and `None` to refuse; the rating is stored under the returned name, so one person spelled two ways is one rater. With no check, or on `None`, the action is refused (`refused`, status 403) before the result is read, a warning names the caller, the person and the scope, and nothing is written; a check that raises propagates as the host's defect, and one returning anything but a non-blank name or `None` (an empty or whitespace-only name included) raises `TypeError`. A host that relays no one's ratings changes nothing. `result_rate` is unchanged: still the agent's own rating. `CalibrationRating` gains `source` (where the person gave it) and `collected_by` (the relaying caller), both default `None`, set together and on a person's rating only (durable v16.1, additive: a rating stored before reads with neither). `rate_result` takes them as keywords (`source=`, `collected_by=`) beside `rated_at=` (when the rater rated, ISO-8601 with an offset and no later than now, stored in UTC; default now), so a relay dates the rating when the person gave it. A rating's id is unchanged, and a rater holds one rating of one dimension of one result. A write that names `rated_at` replaces the stored one when that was given at the same time or earlier (directly or relayed from another source), and is refused as a conflict (`ConflictError`, 409, naming the stored rating's `rated_at` and source) when it was given later, which then stands; nothing is written. A stored `rated_at` that is not an aware ISO-8601 instant does not block the write, which is recorded as contained. A write without `rated_at` is dated now and replaces as before, `result_rate` included. A dated write reads the stored rating through its store, so `threetears.evals.run.RatingStore` (provisional) gains `query_calibration_ratings(scope_id, /, *, result_id=None)`; `EvalStorage` has it, and a store of a host's own adds it. `ResultRated` (both rating actions) gains `source`, `collected_by`, `rated_at`, `replaced` (whether an earlier rating by the same rater was replaced) and `replaced_source` (its source), and a replacement is logged naming the replaced source. An authored judge case is a person's verdict too (its one label reads as its author's rating in a judge campaign and a judge profile), so `judge_case_author` asks the same check before it reads either template (owner, 2026-10-22). The operation itself asks, on every call from any surface: a host's own direct call is refused too when the host supplies no check. `JudgeCaseAuthor` gains optional `person` (whose verdict it is; omitted, the caller authors as itself), the host is asked `check(scope_id=, caller=<the call's Caller.identity>, person=<person, or the caller>)`, the case's author and its label's rater is the name it returns, and the refusals, the warning and the `TypeError` are the rating's. A host with no `attests_person` can no longer author a judge case through the action. Do not restore it with a check that attests every caller as itself: that makes an agent's verdict a person's, the hole this closes. Attest a caller as itself only when its identity is a person's own account; an agent names, in `person`, the person whose verdict it relays, and the check vouches for that pairing. The operation `judge_case_author(host, case, scope_id, *, author=)` becomes `judge_case_author(host, case, scope_id, *, collected_by=)`, the calling identity, which it records: `JudgeCaseAuthoring` and `AuthoredJudgeCase` gain `collected_by` (default `None`), stored on the judge case a test case carries (durable v16.1) only when set, and left out of the case's content digest, so a case's id and `content_hash` do not move and the same case relayed by another caller, or seeded, names the stored one. The freeze receipt (`FrozenJudgeCase`, the relay this write recorded) and `judge_cases_list` (`JudgeCaseEntry`, the stored relay) gain `collected_by`. A host's own code that names its people itself asks nothing, through the public door: an `AuthoredJudgeCase` frozen with `freeze_judge_cases(authored=)`, a seed corpus's `judge_cases`, and a quick-path `Judge`'s examples, all with `collected_by` `None`. An unrelayed authored case is stored exactly as before, so a build at durable v16.0 reads it; it refuses, by name, only a relayed one. Cases agents already authored through the action stand: their label is still read as a person's. Find them with `judge_cases_list` on each judge template (an authored case whose `authored_by` is an agent's identity, and `collected_by` `None`, since it was stored before relays were recorded). Keep them out of a launch by minting a case set without them (`case_set_mint`) and launching with it, or retire them in the host's own code by saving the stored `EvalTestCase` with `archived=True` (`EvalStorage.save_test_case`), which a launch naming no case set skips (`live` false); re-author any you want kept under an attested person. A judge profile already recorded from a campaign that ran them still counts them: record it again from a launch that does not. `result_rate_person`'s `person` parameter takes the description both actions now share.",
    "A reporter case's labels are readers' verdicts, read as people's (the judge's agreement with readers), so the `reporter_case_freeze` action asks the same check for them (owner, 2026-10-22). Each label dict may name `reader` (omitted, the caller); every distinct reader is asked once, before anything is read, and one refusal refuses the freeze (403, nothing written); a freeze with no labels asks nothing. The operation `reporter_case_freeze(host, freeze, scope_id)` becomes `reporter_case_freeze(host, freeze, scope_id, *, collected_by=)`, the calling identity, and asks on every call with labels, a host's own direct call included; a label sent with `collected_by` is refused. `ReporterLabel` (stable) gains `reader` and `collected_by`, both default `None`, stored only when set (durable v16.1), so a label naming neither is stored as before and a build at durable v16.0 reads it. A v16.0 build cannot read a case with a label naming either, and a reporter template's bank is undecidable while any of its cases is unreadable, so on a v16.0 pod one relayed label stops that whole template: its launches, their prices, its freezes, its calibration reads and its restores refuse until the pod upgrades. During a rolling deploy across 16.0 and 16.1, the first labelled freeze through the action stops that template on the 16.0 pods; finish the deploy before agents freeze labelled cases. Neither is part of what makes two freezes the same case: re-freezing the same verdicts returns the stored case and its stored reader stands, so an existing case needs no `supersedes`. The freeze receipt (`FrozenReporterCase.labels`) shows both; the calibration read (`LabelReading`) is unchanged. A host's own code stays the trusted door: `freeze_reporter_case` asks nothing and stores each label's `reader` and `collected_by` as given, or none, except that `ReporterLabel` refuses a blank or whitespace-only `reader` or `collected_by`, and a `collected_by` with no `reader`. Cases agents already froze with labels stand, and their labels keep reading as readers' verdicts. Find them with `reporter_cases_list`: a live case whose receipt's labels name no `reader`, which a case the host froze itself through `freeze_reporter_case` without naming readers also is, so tell the two apart by who froze it. Retire one for good by superseding it: freeze its campaign and memo again (`recorded_analysis_id`) with `supersedes=[<its id>]` and either no labels, which asks nothing and invents no verdict, or the readers' attested verdicts. A superseded case is never live again, whatever its archive flag says. `supersedes` accepts only a live case, so an operator who already archived an agent-frozen case restores it first (`reporter_case_archive`, `archived=false`), then supersedes it. Superseding retires a case and every reader verdict on it for good, and asks no one, so supersede only a case you mean to retire. Do not rely on `reporter_case_archive` alone: any action caller can restore an archived case (`archived=false`), and its unattested verdicts then count again.",
    "A bundle fingerprints alike across Python builds, except, rarely, a value that falls exactly on a 12th-figure rounding boundary. It was the sha256 of the bundle's canonical JSON with every float in full, and the bundle's intervals and multipliers come from C maths (`math.lgamma`, `math.exp`, `NormalDist().inv_cdf`) whose last bits differ between two builds of one Python (a uv-managed CPython 3.14.6 and Debian's, on one architecture), so one evidence fingerprinted differently on a laptop and in a container: a reporter case re-frozen on another machine was refused as moved evidence and needed `supersedes`, a new freeze recorded a false 'does not reproduce' limit, and `inspect_analysis_bundle` read `mismatch_cause` `evidence`. A fingerprint is now `v2:` and the sha256 of that JSON with every float rounded to twelve significant figures (`schema.hashing.identity_json`, new, beside `round_figures`, `round_floats` and `identity_digest`; `AnalysisContextBundle.fingerprint`, `CampaignBundle.fingerprint` and `frame`, `evidence_digest` and `campaign_evidence_digest` take `like=`; `fingerprint_digest` and `FINGERPRINT_PREFIX` are new in `analysis.bundle.schema`). The bundle itself keeps its figures as computed. Every stored fingerprint is compared in its own version: an unprefixed one (every analysis, frame and reporter case recorded before) is matched by the unrounded digest, so stored cases and analyses keep matching on the build that recorded them, and a frozen bundle still digests to its case's fingerprint. A host that displays or parses `bundle_fingerprint` expects the `v2:` prefix; one that recomputes a page's fingerprint from its `bundle.json` passes the named one as `like=`. The page JSON (`campaign.json`, `report_read(format='json')`) serves every float to twelve significant figures, and so does the writer's message (one pass over the whole view, as it is sent; the figures the view already keeps to four are unchanged, and a bar verdict's value, SEM and interval and a scoreboard row's costs are now among them), so one campaign serves one JSON and sends one message across Python builds, with the same rare exception. A declared value (`alpha`, a bar, a margin) has fewer figures and is unchanged. A stored reporter case whose writer message held a figure past the twelfth, or one of the newly four-figure ones, is refused on re-freeze as 'pinning a different writer message over the same bundle' until it is frozen again with `supersedes`. Durable v16.1 (no bump): a v16.0 build cannot rebuild a reporter case frozen with a `v2:` fingerprint. During a rolling deploy, a pod on the previous build can't render analyses this build generates, or rebuild its reporter cases, so finish the deploy before generating.",
]

[[release.change]]
from = "threetears.evals.kernel"
to = "threetears.evals.schema"
names = ["DEFAULT_JOB_LEASE_S", "LEASE_POOL_WORKERS"]
why = """
The job lease's duration, its renewal fraction and the lease pool's width are defined once, in `schema`, which a host
sizing its database pool imports without loading the kernel. Both move without a shim, `LEASE_POOL_WORKERS` too though
it was host-contract: evals keeps no back-compat on this line (owner, 2026-10-22), and Discodon, the one host, re-pins
by hand (the notes above list what it changes). Import both from `threetears.evals.schema`.
"""

[[release]]
version = "0.74.0"
since = "v0.73.0"
summary = """
No public name of 3tears-evals has moved or been removed since 0.73.0, and no judge wording changed. The family moves
to 0.74.0 for new public API in 3tears-models (the circuit breaker's probe fix).
"""
notes = []

[[release]]
version = "0.73.0"
since = "v0.72.0"
summary = """
A campaign is a campaign of aspects: one question, its arms, one or more aspects each read on its own runs, and
floors that warn. Code reports each aspect, one memo per campaign recommends, and a person records the call. Also
the burndown of Discodon's 0.70.0 adoption findings. The old declaration and memo types left `kernel` (recorded
below); the rest of the breaking changes are signatures, shapes and behaviour, listed in `notes`.
"""
notes = [
    "A model lever read off what ran (`observed_model_levers`) is a level only where at least two ARMS observed it, not two results: a role one arm ran in any number of results and the other never ran is unexercised, so it aliases with nothing, is in no factor pair, divergence or coverage row, and Not tested says `observed in one arm only` (#840). A single-arm campaign keeps the result count. Bundle shape 58 (a stored bundle still loads, its fingerprint moving on reload); `UnexercisedFactor.results` is no longer capped at 1. A run that never observed a recovered lever is unknown for it in the coverage map, not a level of its own. Not tested gains one sentence: `<lever>: N results made <role> calls, all on <arm>, and none on the other arm, so it was observed in one arm only and is not a level.`",
    "In a campaign whose every result has `candidate_kind` `judge` (a mixed campaign keeps the old names; `subject_kind` decides nothing) the catalog's reader names for `cost_usd`, `program_cost`, `total_cost_usd` and `mean_cost_usd` read `Spend, all roles`, `Program spend`, `Total spend` and `Mean spend per result` instead of their measuring-spend names, and `measure_title` adds no `, measuring spend` to them: there those dollars are the subject's own spend (#830). `MetricDescriptor` and `MeasureFacts` gain `subject_spend` (default false), and `measure_title` takes `subject_spend`.",
    "`LaunchHost` takes no `kinds`: the kind registry is `TemplateChecks.kinds`, and `LaunchHost.kinds` is a read-only property over `eval_host.template_checks.kinds` (#816). A host-contract signature change without a deprecation cycle, by owner ruling (2026-10-16): Discodon, the only host, builds the registry once already.",
    "`kernel.production_replicating_cost` takes `candidate_kind` (keyword, required): pass `candidate_kind=result.candidate_kind`. A judge-kind result now sums the judge role (#828).",
    "Both per-run ceilings stop a run between cells, never inside one: `CapBreach.refused_call_usd` is gone, the engine no longer raises `CostCapReached` (it still imports), and `MeteredCallLedger.refusal_message` raises for a host that declared metered tools. A stopped run ends `budget_stopped` with `EvalRun.budget_stops`.",
    "The analysis generation's input-size log line puts its basis in parentheses between the figure and `max_output_tokens` (#827).",
    "A floor's `RateDrop` clause is broken only where a rate it reads is shown to break it: every arm at the case floor and the drop's bounded interval wholly past `max_points` (#845). A drop past the margin on its point estimate alone, at any number of cases, is unclear, never broken; held is the interval within the margin. Each rate a clause reads gets its own row and status in the floors table, about that reading alone, so a clause that reads every pass/fail rate the arms share no longer puts one outcome on the pass rate's row whichever rate decided it. Below the case floor no floor is broken: a rate floor reads unclear, and a cost floor needs every arm at the case floor to break too.",
    "A launch of several arms no longer runs them side by side, each at its own width (#841). `run_launch`, `start_run`, `admit_launch` and every `LaunchGroup` (a host's own `launch_as_group` included) default to `arm_schedule` `interleaved`: every arm runs at once, their cells taken in turn case by case under one width shared by the launch (the widest of its runs alone), and every arm plays its cases in one order derived from the launch group's id. A launch of N arms therefore loads its providers as one run would and takes about N times as long; pass `arm_schedule='concurrent'` for the old side-by-side behaviour. A launch declaring latency under test runs its arms `sequential`, as before, and refuses `interleaved` or `concurrent` beside it. An interleaved run's job budget is the sum of its launch's runs' budgets, held to the engine's cap on one job (`JOB_TIMEOUT_CAP_S`).",
    "`sweep_launch` (`SweepSettings`) no longer takes `max_concurrent_arms`; it takes `arm_schedule`, the one definition `run_launch` takes (`LaunchArguments.model_fields['arm_schedule']`). Its default moved from one arm at a time to `interleaved`: every arm is prepared into one launch and they start together, so one arm refused at its launch starts none, and an arm whose run fails leaves its siblings to finish. `max_concurrent_arms=1` is `arm_schedule='sequential'`; a value above 1 is `concurrent` (every arm at once). `EvalSweep.max_concurrent_arms` stays, recording 1 or the number of arms. A default sweep is now refused up front when it has more arms than the host admits at once (`max_admitted_runs`) or than one launch may start (`max_launch_arms`): a 5-arm sweep on a host admitting 4 needs `arm_schedule='sequential'`. `measure_latency` beside `interleaved` or `concurrent` is refused as the arguments are built (`LaunchArguments`, `SweepSettings`), so `launch_estimate` refuses it too.",
    "Every run records the schedule its arms ran under (`EvalRun.arm_schedule`, also on `EvalLaunch`, `EvalSweep`, `EvalSummary` and the run summary; core v15.5, additive; `ArmSchedule` in `threetears.evals.schema`). It is in no identity, context key or cell. A campaign whose runs were launched together but ran one arm after another, or side by side, says so in the bundle's `launch_disclosure`.",
    "An unclear floor states the independent cases that would show it holds, computed (#846). A `To show the floors hold` table (`TableBlock.name` `projection`) gives each unclear floor and arm the count if the arms do not differ and if they differ as observed, with its cost, and the line under it says each count is about, assumes new cases vary as these did, and that repeats narrow an interval far less than new cases. A rate's count is the bounded interval computed again over the run's cases repeated to that many (`threetears.evals.analysis.stats.bounded_cases_to_clear`, the median over five seeded orders, searched by doubling then bisection to `PROJECTION_CASE_CAP`, 10,000), not the t interval the contrasts table prints: the issue's `about 107` scaled that one, which never settles a clause. A cost floor's count scales its t interval as 1/sqrt(n). Each family comparison carries `case_values`, the per-case values its bounded interval read, which the writer is not shown (bundle shape 58, since moved on in this release). What the memo says to run next (a next step's title and why, an aspect summary's `means`) may no longer state a sample size or a cost of its own: a sentence proposing more cases (a count, a number word, `double`, `3x`, `a 50-case suite`, `k to 10`, beside a word for getting more) at a count above what the run reached that no projection states, or naming a cost no projection prices and the run did not measure, is replaced by the projection's sentence once and otherwise dropped; a next step whose title is replaced keeps none of the writer's facts or why, one with nothing projected is not printed, and each is listed in the methods (`The memo said “…”, a sample size or cost no code computed, so the page does not print it.`). The seeded `eval_analysis_gen` prompt no longer asks an unanswerable answer or a next step for a rough cost: a writer prompt, not judge wording, so no judge identity moves, but a deployment's stored preset keeps the old wording until an operator pushes the new seed, and until then a failed generation's summary notes the prompt is not the in-repo default. A host matching on a memo's next steps updates its match.",
    "A campaign is a campaign of aspects (durable v16, `DURABLE_SCHEMA_VERSION` 15 -> 16, `DURABLE_SCHEMA_MINOR` 0). `EvalCampaign` holds one `question`, its `arms` (`CampaignArm`: label, role, `variant_key`, `levers`, `identity_version`; the control first, at most one), one or more `aspects` (`Aspect`: label, `template_id`, `margin`, `design: AspectDesign`, `run_ids`, `asked_at`), its `floors` (`Floor`: aspect, clause, a derived `key` `<aspect>/<kind>/<reading or *>`), `declared_at`, `declared_by` and the recorded `call` (`CampaignCall`). `run_ids` and `exploratory` are computed: `campaign.model_copy(update={'run_ids': ...})` is silently ignored, so set runs on the aspect. `template_id`, `run_ids` and `declared_design` are no longer stored fields. `eval_campaign` moved from the core space to the durable space (`DURABLE_DOC_TYPES` gains it, `CORE_RESET_DOC_TYPES` loses it). A stored v15 campaign, core or durable, reads as one aspect labelled with its behavior (a `/` in the behavior becomes `-`): its live questions' words join into the one question, their typed rules become floors on that aspect, the margin is the tightest every-rate `RateDrop`'s `max_points` (else none), and the declared control becomes an arm labelled `control`. Question ids, `supersedes` lineage and retired or superseded questions are dropped.",
    "Costs of the durable move: a build from before this release refuses every durable document this release writes, so there is no rollback once it has written; `reset_core` no longer deletes campaigns, which keep naming the deleted runs (the view reports them unresolved); a `RoutedDocumentStore` routing by lifecycle must run `relocate` before starting, so campaigns are placed anew.",
    "`create_campaign` and `ops.campaign_create` take `question`, `arms` ({label, role, from_run_ids}, resolved server-side; the action's parameter is `campaign_arms`), `aspects` ({label, template_id?, run_ids, margin?, design?}), `floors` ({aspect, clause}), `margins` ({label: margin}, for adopted aspects) and `aspects_from` (campaign ids, or {campaign_id, label}); `control_from_run_id` is removed. `CampaignDefinition` drops `run_ids`, `template_id`, `declared_design` and `control_from_run_id`; `CampaignChanges` drops `declared_design` and gains `question`, `aspects` and `floors`; `CampaignLine` gains `aspects`; `campaign_runs_add` and `campaign_runs_remove` take `aspect` (None routes a run by its template and refuses an ambiguous one); `set_campaign_control` names the control arm. One freeze rule: once any aspect holds a run. An arm whose runs carry different variant keys is refused, naming each. Derived candidate arms (`campaign_arms`) are never stored and their labels can shift when a variant joins, so match a call by `variant_key`.",
    "Adoption: `aspects_from` adopts each source campaign's upgraded aspect keeping its own `asked_at`; anything added at adoption carries its own time and reads `declared after the evidence` when later than the aspect's first result. A control named after an aspect's first result (its earliest `EvalResult.scored_at`) makes that aspect's readings post hoc. A margin or a relative floor needs a control: declaring either without one is refused with the remedy to declare a bar instead, and an aspect's stored terms carried on adoption without a control are kept, unread, and named (`AspectDeclaration.unread_without_control`). A declared aspect needs a margin only when the campaign asks a question and has a control.",
    "A campaign's kind is derived from its arms, never declared (`analysis.kinds.campaign_kind`, `CampaignKind`, still exported from `threetears.evals.analysis`): a measurement (one arm) reports each aspect's measures with intervals and its bars; a choice (two or more arms, no control) reads every pair of arms on every aspect, symmetric, with Holm across all pairs and aspects in one direction-free family, and each arm against its bars; a change (a control and candidates) reads each candidate against the control on each aspect. Code never picks an arm; the frontier line names what it showed cheapest, or every arm it could not separate.",
    "Bundle shape 59: a bundle reads one aspect. `assemble_context_bundle(campaign, *, aspect=None, ...)` refuses (`RefusedInput`) an unnamed aspect of a multi-aspect campaign or an unknown label. `AnalysisContextBundle.aspect` joins the keys; `declared: AspectDeclaration | None` replaces `declared_design`; `ComparisonFamily.question_id` -> `aspect`; `ReadingScope.post_hoc_questions` -> `question_post_hoc`; `VerdictOrder.questions` -> `question` (`QuestionScope.aspect`); the bundle's `post_hoc_questions` and report `Verdict.question_id` (-> `aspect`) are gone; new `floor_contrasts` (`FloorContrast`: every arm's per-case pass rate and cost per reply against the control, whatever the family compares) and `first_result_at` (outside the fingerprint). The overall pass rate joins the aspect's family only when its question was asked before the first run and it declares a margin. Over unchanged runs, adjusted p's move for a stored campaign with several live questions asked in time (their families merge into one) and for one with a question asked after its first run (every finding reads exploratory). An analysis or reporter case holding an older bundle is refused with a remedy (generate the analysis again; freeze the case again).",
    "Floors replace the decision rule, and only warn. A floor is broken where its clause would have settled keep, read at the nominal 95% (the bounded interval over `case_values` for a rate, the t interval on the per-case cost difference for cost), uncorrected; held where that interval lies within; otherwise unclear. A broken floor is the page's first line, above the title, and never writes the verdict line or replaces a memo sentence. The Decision section is `Floors on <aspect>` (Floor, Reading, arms, Status), with a `To show the floors hold` projection table, and says `No floor was declared on <aspect>.` where none was. Removed from `report.decision` and `report.verdict`: `evaluate_rule`, `rule_readings`, `RuleReadings`, `RuleVerdict`, `ClauseVerdict`, `rule_statement`, `rule_projection`, `clause_projection`, `keep_is_the_default`, `PROSE_RULE_LINE`, `ruled_question`, `prose_ruled`, `rule_sentence`, `RULE_ANCHOR`; new `evaluate_floor` (-> `FloorStatus`), `read_floor`, `floor_readings`, `FloorReadings`, `FloorVerdict`, `floor_statement`, `floor_warning`, `floor_projection`, `floors_projection`, `aspect_pass_rate`, `settles`, `settles_cost`. `DisclosureSource` `rule` -> `floor`; the glossary's `clause` and `settled` -> `floor` and `floor status`. A host matching on the rule's verdict line or the `See the decision rule above.` answer updates its match.",
    "`campaign_readings(campaign, bundles, *, arms)` reads a campaign (`CampaignReadings`; `arms` is required): per aspect, each candidate's change against the control with its interval and a reading (`shown better`, `shown worse` against the margin, `unclear`), Holm-corrected per candidate across its aspects, separately for gains and drops, each row's interval at its own corrected level and its adjusted p held to at most alpha when shown; no correction across candidates, which the page states. Floors are read beside, at 95%, uncorrected, so a one-aspect campaign's floor and reading on the same rate and margin never disagree. A row's change is the mean of the same per-case shares its interval reads; where arms ran under several rigs it reads one and says which (`AspectReading.rig`, `PairReading.rig`, `RateReading.rig`), and arms sharing no rig say so. `PairReading.ahead` is the ahead arm's variant key, with `ahead_label`. `MeasureReading` gains `rig`, `passed` and `trials`, and a measurement's pass rate carries an interval (`stats.pooled_rate_interval`). An unclear row projects the cases that would settle it; an unpaired projection searches at most the larger of `UNPAIRED_PROJECTION_CAP` (500) and four times the cases observed, to `UNPAIRED_PROJECTION_RESOLUTION` (5%), and says `more than N` where a search stopped there (it took 10 to 35 seconds a row before).",
    "Every door serves the campaign's page: `campaign_report` and `analysis_report` return a `CampaignReport` (`build_campaign_report`) for any campaign, one aspect or many, so a multi-aspect `report_read` no longer refuses. It opens with every missed bar and broken floor, then the writer's recommendation, a table of every aspect, what would settle each unclear row and the recorded call, then one fold per aspect holding that aspect's code-only page with arms named by the campaign's labels. An analysis's page is rebuilt from what was frozen with it; the call is read live. `campaign_verdicts` reads every fold's verdicts. Breaking for Discodon's `GET /reports/{campaign_id}` route: `report_read(format='json')` and `campaign_report` now return the campaign's page, not the evidence bundle. `report_read`'s JSON is the page's machine form (`kind: campaign`, `shape` (`CAMPAIGN_JSON_SHAPE`, 1), `campaign_id`, `basis`, `analysis_id`, `recommendation`, `readings`, `call`, and each aspect's bundle named by `bundle_fingerprint` and `bundle_schema_version`). `campaign_report` returns a `CampaignReport` whose folds each hold one aspect's `Report`. Remedy: a route that served the bundle reads it with `inspect_campaign_bundle(host, campaign_id, scope_id, aspect=...)` (`.bundle`), one aspect at a time, or with `assemble_campaign_bundle(host, campaign_id, scope_id)` for all aspects. `CampaignReport.write()` writes `report.html`, `report.md`, `campaign.json` and `bundle-<fold>.json` (was `bundle.json`); quick's `Result` gains a required `page`; the Methods line reads `its JSON beside this page`.",
    "`campaign_record` (op and action, write permission; `analysis.record_campaign_call`) records a person's call as `CampaignCall` (arm, `variant_key`, reason, `floors_overridden` by floor key, `bars_overridden: list[OverriddenBar(aspect, measure)]`, `analysis_id`, `run_ids` (the runs it was read over), `called_at`, `called_by`); the action takes bars as `<aspect>/<measure>` strings and its reason as `call_reason`. Floor and bar status come from code's readings, never the memo. It refuses an unknown arm, an analysis that is not the page's current one (a call given an `analysis_id` is checked against that analysis's frozen readings), a broken floor or missed bar the call does not override by name, an override the arm did not earn, a campaign that changed while it was read, and a measurement's call, which leaves nothing to decide. A choice is never refused for picking an arm shown behind another; the call line warns instead. A new call replaces the earlier one. The call line states every stored override, marking any `no longer broken` or `no longer missed`, and ends `over N runs; M added since`.",
    "One memo per campaign. Regenerable schema 11 -> 12: a stored analysis, insight or judge profile from before is refused on read, naming the operator step. Run `EvalStorage.drop_derived(scopes)` once before deploying: it deletes analyses, insights and judge profiles (cassettes, kept and durable documents stay) and now returns `DerivedDropped(counts, judge_profiles)`, not `dict[str, int]`; each `DroppedJudgeProfile(scope_id, profile_id, run_ids)` is a profile to record again with `judge_profiles_record` over those runs, and until then campaigns that took their judges' tier from it read their own evidence's tier. Then `analysis_generate`. A v11 insight refuses `analysis_generate`, `analysis_estimate` and code-only `report_read` over its subject until dropped. `EvalAnalysis` holds `aspects` (`AspectAnalysis`: label, bundle, `bundle_fingerprint`, decision surface, variant and run indexes, coverage), `campaign_bundle`, `document: AuthoredCampaignAnalysis`, `design_snapshot` (always present) and `recommended_variant_key`; `EvidenceRow.aspect` is new; `generation.bundle_fingerprint` is the campaign bundle's. `AnalysisLine.recommendations` is 0 or 1.",
    "The writer reads one campaign bundle (`CampaignBundle`, `CAMPAIGN_BUNDLE_SHAPE` 1; `build_campaign_bundle`, `assemble_campaign_bundle`, `build_campaign_user_message` with 24,500 characters per aspect; cells aliased c1..cN across aspects) and writes `AuthoredCampaignAnalysis`: findings, `recommendation` (a list of at most one `Recommendation`, read with `recommended()`: arm, reasons, confidence, `rests_on`, `floors_overridden: list[FloorOverride(floor, why)]`, `behind_on: list[BehindOn(aspect, ahead_arm, why)]`, `bars_missed: list[BarMissed(aspect, measure, why)]`), one `AspectSummary` per aspect (what changed, how sure, what it means) and next steps. Refused: a measurement's recommendation; a change without one; a pick of an arm that does not exist; a candidate with no better reading or improved comparison on any aspect; a switch on exploratory evidence; a pick resting on no finding (keeping the control may rest on none); a choice's pick of an arm shown ahead on no pair above `low` confidence; any broken floor, missed bar or pair where another arm is ahead left unaddressed, addressed twice or without a reason, or an unbroken floor listed. A finding citing a contrast or guardrail check against the control may name the control in its title, and a role-word label (`control`, `candidate`) is not read as an arm name. The per-aspect trim drops flagged-case excerpts, trials, contrasts, then runs' configs, readings last; an overshoot of the campaign-level part is logged. Removed: `generator.build_user_message` (-> `build_campaign_user_message`), `WRITER_REASON_CHARS`, `arms.contradicted_arms`. Changed signatures: `generate_analysis(bundle: CampaignBundle, ...)`, `first_request`, `refuse_an_undescribable_arm_table`, `case_limits`, `render_prose_figures(document, lookup)`, `in_writer_terms(text, aliases)`, `analysis_rulers(analysis, aspect)`; `inspect_campaign_bundle` and `inspect_analysis_bundle` take `aspect=`.",
    "The seeded writer prompt is rewritten (23,771 characters, 13 rules; `GEN_PROMPT_RULES.md` records each rule's change): a writer prompt, not judge wording, so no judge identity moves, but every host pushes the new seed to its `eval_analysis_gen` store (`eval_prompt_reset`), or the stored prompt names fields the writer no longer sees. A reporter eval should measure the rewrite. Reporter cases frozen before this release must be frozen again, and a reporter freeze of a campaign of several aspects is refused (slice 1).",
    "The authoring gate reads one aspect: `refuse_an_undeclarable_design(design: AspectDesign, *, floors=(), behavior, template, profile)`. A floor's `RateDrop` naming a reading the aspect does not measure is refused by the floor's key (`floor <aspect>/rate_drop/<reading> names ...`); latency is asked about by a bar, `latency` among the aspect's merit axes or in its merit priority. The refusal of a question writing its rule as prose (`Decision rule:` in its text) is gone with the question.",
    "The declared surface is 529 names (`DECLARED_CEILING` 525 -> 529, owner-approved): `CampaignDesign`, `Question` and `DecisionRule` leave it (removed, recorded above); `AspectDesign`, `Floor`, `CampaignCall`, `OverriddenBar` (kernel) and `ops.campaign_record` join the host contract, and `CampaignReport` and `CampaignReadings` (analysis) join the stable tier. The other slice-1 names (`Aspect`, `CampaignArm`, `resolve_control_arm`, `Recommendation`, `AspectSummary`, `AuthoredCampaignAnalysis`, `FloorOverride`, `BehindOn`, `BarMissed`, `DerivedDropped`, `DroppedJudgeProfile`, `AspectDeclaration`, `AspectView`, `aspect_view(s)`, `AspectReading`, `PairReading`, `MeasureReading`, `FloorStatus`, `campaign_readings`, `build_campaign_report`, `CampaignBundle`, `campaign_kind`, `CampaignKind`, `record_campaign_call`, `CampaignCallLine`, ...) are provisional.",
    "Derived arm labels are the page's arm word (`careful`, not `candidate=careful`), with ` (2)` on a collision, and quick names its control by the eval's arm name, so every door names arms as the page does (`hasty (control) vs careful`).",
    "On a campaign's page a breached guardrail warns on the first screen, after missed bars and broken floors, and never adopts or blocks (the old line `...so it is not adopted` is gone); an aspect with no margin gets no `To show no worse than the margin` row; identical timing notes are grouped into one line naming their aspects.",
    "`TextRole` (`threetears.evals.analysis`) no longer has `revisit_when`: the memo has no deferred decision, so no report block carries that role and the serializers no longer style it. A host matching on that role updates its match.",
]

[[release.change]]
from = "threetears.evals.kernel"
to = "removed"
names = ["CampaignDesign", "DecisionRule", "Question", "preregistered_questions", "resolve_declared_control"]
why = """
A campaign is now a campaign of aspects: one question, its arms (`CampaignArm`, the control first), one or more
`Aspect`s each with its own `AspectDesign`, margin and runs, and `Floor`s. `CampaignDesign` is `AspectDesign` plus
what moved to the campaign: the question is `EvalCampaign.question`, the control is the control `CampaignArm`
(`variant_key`, `levers`, `identity_version`), and when it was asked is `Aspect.asked_at`. A `DecisionRule`'s clauses
are `Floor`s on the aspect (`Floor(aspect=..., clause=RateDrop(...))`); a floor warns and decides nothing. `Question`
has no successor: a campaign asks one question, and its merit axes are `AspectDesign.merit_axes`. A stored v15
campaign reads as one aspect, so nothing stored needs rewriting. `preregistered_questions` is `Aspect.asked_at`
against the aspect's first result; `resolve_declared_control` is `resolve_control_arm(campaign.control)`. Removed
without a deprecation cycle, `DecisionRule` included: by owner ruling (2026-10-18) the campaign of aspects replaces
the design outright on this line, and Discodon, the only host, ports by hand.
"""

[[release.change]]
from = "threetears.evals.kernel"
to = "removed"
names = ["AuthoredAnalysis", "Decision", "QuestionAnswer"]
why = """
One memo covers a campaign: `AuthoredCampaignAnalysis` (findings, at most one `Recommendation`, one `AspectSummary`
per aspect, next steps) replaces `AuthoredAnalysis`; `Recommendation` replaces `Decision`, and the aspect summaries
replace `QuestionAnswer`. Nothing read the retired shapes in this release: a stored analysis is refused on read and generated
again.
"""

