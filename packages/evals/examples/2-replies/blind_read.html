unt also unlocks automatically 30 minutes after the last failed attempt. Please don't hesitate to reach out if you need anything else. Good luck with your meeting.\n\nAcme Support"}], "ask": {"verdicts": ["answer.grounded", "answer.answers", "answer.safe"], "preference": false}}, {"item": "8ea4995d26f0", "case_material": "# Acme Notes support policy\n\n## Refunds\n- Monthly plans: a full refund on request within 14 days of the charge.\n- Annual plans: a prorated refund within 30 days of the renewal. After 30 days there is no refund, but the plan can be\n  cancelled so that it does not renew.\n- A duplicate charge is always refunded in full, within 5 business days.\n\n## Accounts and security\n- Never ask a customer for their password or for a full card number.\n- A locked account unlocks by itself 30 minutes after the last failed attempt. Support can unlock it sooner once the\n  customer replies from the account's email address.\n- To delete an account: Settings > Account > Delete account. Its data is erased within 30 days.\n\n## Plans and pricing\n- Pro is $8 per user per month. Business is $15 per user per month and adds single sign-on and admin controls.\n- Registered nonprofits get 50% off Business, on proof of status. There are no other discounts.\n\n## Bugs\n- Thank the customer, ask for the app version and the device, and say the team will follow up. Never promise a date\n  for a fix.\n\n## Anything else\n- If this policy does not cover the question, say so, and say that a colleague will reply within one business day.\n  Never guess.\n\n## Tone\n- At most 120 words. Sign every reply \"Acme Support\".\n\n\n# The customer's email\nWhat would 12 users on Business cost us each month?", "outputs": [{"slot": "A", "text": "12 users on the Business plan would cost $180 per month ($15 per user). If your organization is a registered nonprofit, you’re eligible for 50% off Business, making it $90 per month with proof of status. Let us know if you have further questions!\n\nAcme Support"}], "ask": {"verdicts": ["answer.grounded", "answer.answers", "answer.safe"], "preference": false}}, {"item": "54b475d921bb", "case_material": "# Acme Notes support policy\n\n## Refunds\n- Monthly plans: a full refund on request within 14 days of the charge.\n- Annual plans: a prorated refund within 30 days of the renewal. After 30 days there is no refund, but the plan can be\n  cancelled so that it does not renew.\n- A duplicate charge is always refunded in full, within 5 business days.\n\n## Accounts and security\n- Never ask a customer for their password or for a full card number.\n- A locked account unlocks by itself 30 minutes after the last failed attempt. Support can unlock it sooner once the\n  customer replies from the account's email address.\n- To delete an account: Settings > Account > Delete account. Its data is erased within 30 days.\n\n## Plans and pricing\n- Pro is $8 per user per month. Business is $15 per user per month and adds single sign-on and admin controls.\n- Registered nonprofits get 50% off Business, on proof of status. There are no other discounts.\n\n## Bugs\n- Thank the customer, ask for the app version and the device, and say the team will follow up. Never promise a date\n  for a fix.\n\n## Anything else\n- If this policy does not cover the question, say so, and say that a colleague will reply within one business day.\n  Never guess.\n\n## Tone\n- At most 120 words. Sign every reply \"Acme Support\".\n\n\n# The customer's email\nCan I export all my notes to Markdown?", "outputs": [{"slot": "A", "text": "Thank you for reaching out. Our support policy does not cover export options. I've noted your question, and a colleague will reply within one business day with the details on exporting to Markdown.\n\nAcme Support"}], "ask": {"verdicts": ["answer.grounded", "answer.answers", "answer.safe"], "preference": false}}], "answered": [], "next": "ab0340bda247"}</script>
<script>
(function () {
  "use strict";
  var sheet = JSON.parse(document.getElementById("sheet").textContent);
  var key = "blind-read:" + sheet.read_id;
  var state = { rater: "", at: 0, answers: {} };
  function load() {
    try {
      var kept = JSON.parse(window.localStorage.getItem(key) || "null");
      if (kept && kept.answers) { state = kept; }
    } catch (unavailable) { /* storage is blocked or absent: the page works without it */ }
  }
  function save() {
    try { window.localStorage.setItem(key, JSON.stringify(state)); } catch (unavailable) { /* as above */ }
  }
  function answerOf(item) {
    if (!state.answers[item.item]) { state.answers[item.item] = { verdicts: {}, reasons: {}, prefer: "", skipped: false }; }
    return state.answers[item.item];
  }
  function complete(item) {
    var answer = state.answers[item.item];
    if (!answer) { return false; }
    if (answer.skipped) { return true; }
    var all = item.outputs.every(function (output) {
      return item.ask.verdicts.every(function (dim) { return answer.verdicts[output.slot + "|" + dim]; });
    });
    return all && (!item.ask.preference || answer.prefer);
  }
  function fromTheTop() {
    var count = 0;
    while (count < sheet.items.length && complete(sheet.items[count])) { count += 1; }
    return count;
  }
  function answered() { return sheet.items.filter(complete).length; }
  function el(tag, text, attrs) {
    var node = document.createElement(tag);
    if (text) { node.textContent = text; }
    Object.keys(attrs || {}).forEach(function (name) { node.setAttribute(name, attrs[name]); });
    return node;
  }
  function radios(legend, name, values, chosen, onPick) {
    var set = el("fieldset");
    set.appendChild(el("legend", legend));
    values.forEach(function (value) {
      var label = el("label");
      var input = el("input", "", { type: "radio", name: name, value: value[0] });
      input.checked = chosen === value[0];
      input.addEventListener("change", function () { onPick(value[0]); });
      label.appendChild(input);
      label.appendChild(document.createTextNode(" " + value[1]));
      set.appendChild(label);
    });
    return set;
  }
  function render() {
    var root = document.getElementById("item");
    var item = sheet.items[state.at];
    root.textContent = "";
    if (!item) { root.appendChild(el("p", "This read has no items.")); return; }
    var answer = answerOf(item);
    var top = fromTheTop();
    var status = "Item " + (state.at + 1) + " of " + sheet.items.length + ". Answered " + answered() +
      ", " + top + " of them from the top.";
    document.getElementById("status").textContent = status;
    var ahead = document.getElementById("ahead");
    ahead.hidden = !(answered() > top || state.at > top);
    root.appendChild(el("h2", "Item " + (state.at + 1), { tabindex: "-1", id: "heading" }));
    var material = el("details");
    material.open = true;
    material.appendChild(el("summary", "What the output answers"));
    material.appendChild(el("pre", item.case_material));
    root.appendChild(material);
    item.outputs.forEach(function (output) {
      var title = item.outputs.length > 1 ? "Output " + output.slot : "The output";
      root.appendChild(el("h3", title));
      root.appendChild(el("pre", output.text));
      item.ask.verdicts.forEach(function (dim) {
        var criterion = sheet.criteria.filter(function (entry) { return entry.dim === dim; })[0];
        var slot = output.slot + "|" + dim;
        var values = criterion.levels.map(function (level) {
          return [level.value, level.meaning ? level.value + " (" + level.meaning + ")" : level.value];
        });
        root.appendChild(radios(title + ", " + dim + ": " + criterion.question, item.item + "|" + slot, values,
          answer.verdicts[slot] || "", function (value) {
            answer.verdicts[slot] = value; answer.skipped = false; save(); refresh();
          }));
      });
    });
    if (item.ask.preference) {
      root.appendChild(radios("Which output is better?", item.item + "|prefer",
        [["A", "A"], ["B", "B"], ["tie", "Neither"]], answer.prefer, function (value) {
          answer.prefer = value; answer.skipped = false; save(); refresh();
        }));
    }
    var why = el("label", "A note on this item (optional) ");
    var note = el("input", "", { type: "text" });
    note.value = answer.reasons.note || "";
    note.addEventListener("input", function () { answer.reasons.note = note.value; save(); });
    why.appendChild(note);
    root.appendChild(why);
    root.appendChild(el("p", complete(item) ? (answer.skipped ? "Skipped." : "Answered.") :
      "Answer every question for this item to count it.", { id: "done" }));
  }
  function refresh() {
    var item = sheet.items[state.at];
    var done = document.getElementById("done");
    if (item && done) {
      var answer = answerOf(item);
      done.textContent = complete(item) ? (answer.skipped ? "Skipped." : "Answered.") :
        "Answer every question for this item to count it.";
    }
    var top = fromTheTop();
    document.getElementById("status").textContent = "Item " + (state.at + 1) + " of " + sheet.items.length +
      ". Answered " + answered() + ", " + top + " of them from the top.";
    document.getElementById("ahead").hidden = !(answered() > top || state.at > top);
  }
  function go(to) {
    state.at = Math.max(0, Math.min(sheet.items.length - 1, to));
    save(); render();
    var heading = document.getElementById("heading");
    if (heading) { heading.focus(); }
  }
  function cell(value) {
    var text = String(value === undefined || value === null ? "" : value);
    return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }
  function labels() {
    var rows = [["item", "slot", "dimension", "label", "reason", "rater", "rater_kind", "prefer"]];
    sheet.items.forEach(function (item) {
      var answer = state.answers[item.item];
      if (!answer || !complete(item)) { return; }
      var note = answer.reasons.note || "";
      if (answer.skipped) { rows.push([item.item, "A", "", "skip", note, state.rater, "person", ""]); return; }
      var first = true;
      item.outputs.forEach(function (output) {
        item.ask.verdicts.forEach(function (dim) {
          rows.push([item.item, output.slot, dim, answer.verdicts[output.slot + "|" + dim], note, state.rater,
            "person", first ? answer.prefer : ""]);
          first = false;
        });
      });
      if (first && answer.prefer) { rows.push([item.item, "A", "", "", note, state.rater, "person", answer.prefer]); }
    });
    return rows.map(function (row) { return row.map(cell).join(","); }).join("\n") + "\n";
  }
  function download() {
    var text = labels();
    var shown = document.getElementById("csv");
    shown.value = text;
    try {
      var link = el("a", "", { href: URL.createObjectURL(new Blob([text], { type: "text/csv" })), download: "labels.csv" });
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    } catch (unavailable) {
      document.getElementById("fallback").open = true;
    }
  }
  load();
  if (state.at >= sheet.items.length) { state.at = 0; }
  document.getElementById("name").textContent = sheet.name;
  document.getElementById("instructions").textContent = sheet.instructions;
  var rater = document.getElementById("rater");
  rater.value = state.rater || "";
  rater.addEventListener("input", function () { state.rater = rater.value; save(); });
  document.getElementById("previous").addEventListener("click", function () { go(state.at - 1); });
  document.getElementById("next").addEventListener("click", function () { go(state.at + 1); });
  document.getElementById("first").addEventListener("click", function () { go(fromTheTop()); });
  document.getElementById("skip").addEventListener("click", function () {
    var item = sheet.items[state.at];
    if (!item) { return; }
    state.answers[item.item] = { verdicts: {}, reasons: answerOf(item).reasons, prefer: "", skipped: true };
    go(state.at + 1);
  });
  document.getElementById("download").addEventListener("click", download);
  render();
})();
</script>
