[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-scrape"
version = "0.28.0"
description = "AI-driven, self-healing web scraping: pluggable render backends + LLM-proposed extraction candidates validated and judged against real page content, never hand-rolled per-site parsers"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
# Compound, and the only compound one in this family, because this is the only package that
# redistributes somebody else's files: `src/threetears/scrape/operator_assets/novnc/` is noVNC
# v1.7.0, vendored unmodified so a platform mounting the operator router gets a working display
# instead of homework. MPL-2.0 is file-level copyleft -- it does not reach the MIT code around
# it -- but a wheel whose metadata said plain "MIT" would be claiming those files are MIT, and
# they are not.
#
# LicenseRef-noVNC-DES is `core/crypto/des.js`, which carries two bespoke permissive grants
# (AT&T Laboratories Cambridge 1999, Widget Workshop 1996) that match no listed SPDX licence.
# PEP 639's LicenseRef form is how you name one honestly.
#
# The full provenance, including the digest that makes "unmodified" checkable, is in
# `src/threetears/scrape/operator_assets/novnc-provenance.json`.
license = "MIT AND MPL-2.0 AND LicenseRef-noVNC-DES"
# Every licence text travels into the wheel's `.dist-info/licenses/`, alongside the copies that
# sit next to the code itself. Both, deliberately: the in-tree copies are what the MPL means by
# the notice travelling with the files, and the dist-info copies are what tooling reads.
license-files = [
    "LICENSE",
    "src/threetears/scrape/operator_assets/novnc/LICENSE.txt",
    "src/threetears/scrape/operator_assets/novnc/AUTHORS",
    "src/threetears/scrape/operator_assets/novnc/docs/LICENSE.MPL-2.0",
    "src/threetears/scrape/operator_assets/novnc/docs/LICENSE.BSD-2-Clause",
    "src/threetears/scrape/operator_assets/novnc/docs/LICENSE.BSD-3-Clause",
    "src/threetears/scrape/operator_assets/novnc/vendor/pako/LICENSE",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears>=0.28.0,<0.29.0",
    # [document]: drivers/document.py's DocumentDriver reuses parse_document to
    # feed PDF/DOCX/XLSX/CSV targets through the same AI eval loop HTML-page
    # targets already use.
    # [fetch]: page_finder.py drives web_fetch, which now extracts through the
    # search leaf. That path REFUSES without an extractor rather than falling
    # back to stripping tags with a regex, so the extra stopped being optional
    # for a package whose whole job is reading pages.
    "3tears-agent-tools[document,fetch]>=0.28.0,<0.29.0",
    "3tears-models>=0.28.0,<0.29.0",
    "3tears-observe>=0.28.0,<0.29.0",
    # page_finder.py reads the typed search result off ToolMessage.artifact
    # (search-spec.md check 4) rather than re-parsing the prose rendering, so
    # the contracts are a direct import now -- previously they arrived only
    # transitively through agent-tools[fetch], which is not a dependency this
    # package may lean on for its own imports.
    "3tears-search>=0.28.0,<0.29.0",
    "httpx[socks]>=0.27",
    # extraction.py's vision-extraction path builds a multimodal
    # HumanMessage directly -- an explicit dependency rather than relying on
    # 3tears-models' own transitive langchain-core pin.
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "uuid-utils",  # uuid7 ids (scrape.collections, .migrations)
    # extraction.py needs a CSS-selector engine to execute candidate
    # extraction strategies (structural validation + recipe reuse on later
    # fetches, both without an LLM call). MIT-licensed, pure-Python when
    # backed by stdlib html.parser (no lxml C-extension required) -- safe
    # in the MIT-licensed core tree, unlike nodriver's AGPL boundary.
    "beautifulsoup4>=4.12",
    # drivers/camoufox.py -- an in-process ScrapeDriver backend (unlike
    # drivers/nodriver_sidecar.py's sidecar-only AGPL isolation). The
    # camoufox Python wrapper package itself is MIT-licensed; the browser
    # patches it launches (a separate binary, fetched via `camoufox fetch`,
    # not this dependency) are MPL-2.0 (verified via GitHub's license API)
    # -- file-level copyleft only, safe in-process.
    "camoufox>=0.4",
    # Pin below Playwright's own 1.61 release: it added an `isMobile`
    # viewport field Camoufox's bundled Firefox patch (Juggler protocol)
    # doesn't recognize yet, breaking every browser launch with a
    # schema-validation error. Matches a currently-open upstream bug:
    # https://github.com/daijro/camoufox/issues/653. Revisit this pin once
    # camoufox ships a fix (or Playwright reverts/gates the new field).
    "playwright<1.61",
]

[project.optional-dependencies]
# reprobe.py books a blocked target's next probe as a scheduled-jobs
# `relative_delay` job, for a caller that is event-driven rather than
# polling. Optional because 3tears-scheduled-jobs brings NATS and
# APScheduler with it, and a polling caller needs none of that: its next
# poll is the re-probe, gated by `blocked_until` on the health row.
# circuit.py depends on the two-method ReprobeScheduler Protocol, never on
# this package, so nothing in the default install imports it.
reprobe = ["3tears-scheduled-jobs>=0.28.0,<0.29.0"]

# operator.py mounts the human-handover surface into a consuming platform's own
# FastAPI app: the operator page, the noVNC client, and the WebSocket that
# relays RFB from the display. Optional because a deployment that never needs a
# human never needs a web framework, and this package is a library everywhere
# else -- nothing here runs a server, it hands the platform a router to mount.
#
# `3tears-nats` because control messages route to whichever pod holds the
# display over a subject keyed on the session, rather than by addressing pods.
hitl = [
    "fastapi>=0.115",
    "3tears-nats>=0.28.0,<0.29.0",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-agent-tools = { workspace = true }
3tears-models = { workspace = true }
3tears-nats = { workspace = true }
3tears-observe = { workspace = true }
3tears-scheduled-jobs = { workspace = true }
3tears-search = { workspace = true }
