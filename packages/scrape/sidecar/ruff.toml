# The sidecar is a separate deployable on a DIFFERENT Python than the workspace.
#
# The repo root sets `target-version = "py314"`, and ruff rewrites source to match:
# PEP 758 (3.14) allows `except A, B:` without parentheses, so ruff's autofix strips
# them. This container runs `python:3.12-slim-bookworm`, where that is a SyntaxError.
#
# That combination has silently broken this package twice. Both times the sequence was
# identical and every workspace gate reported clean: ruff formats the file, mypy skips
# it (it is outside `[tool.mypy] files`), and the workspace suite carries
# `--ignore=packages/scrape/sidecar`. Only `./scripts/test-sidecar.sh` catches it, and
# the first time nothing ran that script at all.
#
# A ruff.toml here is a full override rather than an extension, so the settings the
# workspace sets that still matter are restated. `extend` is deliberately not used:
# inheriting the root file would inherit its target-version, which is the whole problem.
target-version = "py312"
line-length = 120

[lint]
# F as well as SLF, added 2026-07-27 after an undefined name reached a RUNNING container.
#
# `suppress` was used here after an earlier change had removed its import. `./scripts/lint.sh`
# passed, because ruff's default rule set is not in force anywhere in this repo -- root or here --
# and mypy deliberately does not check this directory at all. So the only thing standing between a
# `NameError` and a container that boots into it was `./scripts/test-sidecar.sh`, and it only
# caught this one because a test happened to cover that branch.
#
# F821 (undefined name) is the rule that matters; the rest of F comes with it and cost two unused
# imports to adopt. This is the second time this directory's lint has let something through that
# ran -- the first was a formatter autofix writing a syntax error -- which is why the answer is a
# rule rather than more care.
#
# The repo root now selects F too, and this still has to say so: a nested ruff.toml REPLACES the
# root's configuration rather than extending it, so dropping F here would switch it back off for
# exactly the directory that earned it.
select = ["SLF", "F"]

[lint.per-file-ignores]
# Restated from the repo root, which cannot reach this far once a nested config exists:
# a ruff.toml is a full override, not an extension. Reinstating the root's setting is
# deliberate rather than a copy for its own sake -- dropping it would silently turn the
# already-justified private access in this container's own test suite into failures the moment
# this file exists. (`main.py` and `hitl.py` carry their own keys further down, added later and
# for a different reason, so they are unaffected either way.)
#
# The sidecar's module-level globals (_browser/_ready) and its lazy warm-up hook have no
# public accessor; tests set and read them directly to drive cold-start, warm-start and
# retry scenarios without launching a real Chromium. The HITL suites do the same for the
# lifecycle's process handles and argument builders, where the private thing IS the
# behaviour under test.
"tests/*" = ["SLF001"]

# main.py and hitl.py are two halves of ONE container and import each other. The helpers they
# share are module-private on purpose: nothing outside the container may call them, and a
# public alias would advertise them to consumers that must not have them.
#
# Declared here rather than as inline `noqa`, with entries in
# `tests/enforcement/_underscore_exemptions.txt`, because that is the channel the exemptions
# file's own header requires: every entry there must have a matching ruff ignore so the two
# stay in step, and the reasons then live in one reviewable list instead of at each call site.
#
# The cost, stated rather than glossed: a per-file ignore also suppresses every FUTURE private
# access in the files listed below, which an inline pragma would not. The ledger entries are what
# offsets that -- they record what was actually justified, so a new access is visible as an
# undocumented one rather than as silence.
#
# It makes no difference to the enforcement walker: `find_local_src_roots` scans
# `packages/*/src` only, so neither this container's files nor any `tests/` tree is ever walked
# by it. Ruff at the repo root is the only thing that reads these.
"main.py" = ["SLF001"]
"hitl.py" = ["SLF001"]
