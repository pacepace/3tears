[project]
name = "nodriver-sidecar"
version = "0.1.0"
description = "Thin HTTP wrapper around nodriver + Xvfb -- AGPL-3.0, never imported into 3tears-scrape's MIT tree."
requires-python = ">=3.12"
dependencies = [
    "nodriver>=0.50,<0.51",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv]
# Supply-chain cooldown: refuse any PyPI release younger than 14 days, so a version
# published by a registry account takeover leaves the index before we can resolve to it.
# Only registry indexes are filtered; path and git sources are unaffected.
exclude-newer = "14 days"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A bare `pytest` here must collect what `scripts/test-sidecar.sh` collects. Without this it
# walks `.venv/` and picks up dependencies' own test modules -- a real run recorded
# `annotated_types/test_cases.py` as part of this branch's passing evidence, which is harmless
# to the result and wrong about what was actually tested.
testpaths = ["tests"]
norecursedirs = [".venv", "*.egg", "build", "dist"]
