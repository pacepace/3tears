services:
  nodriver-sidecar:
    build: .
    image: nodriver-sidecar:latest
    container_name: nodriver-sidecar
    # Chromium under Xvfb needs real shared memory; the Docker default (64mb)
    # crashes the renderer process under real page loads.
    shm_size: 2gb
    ports:
      - "8088:8088"
      # Deliberately NOT publishing 6080 (websockify / noVNC).
      #
      # Adding `- "6080:6080"` here is a one-line change that looks helpful and is not: the
      # HITL endpoints authenticate nobody, and they never will. The sidecar holds no identity
      # and cannot evaluate a policy, so anything that reaches 6080 gets full mouse and
      # keyboard on a browser that may be holding a target's authenticated session.
      #
      # The session token proves only that a caller holds something this container minted --
      # deciding who was ENTITLED to it is the consuming platform's job, evaluated where
      # identity actually lives. This is not a control that is coming later; it is one that
      # belongs somewhere else. Put this port behind whatever fronts the rest of your
      # deployment.
      #
      # For a local look at it, publish the port on the command line where the decision is
      # visible and temporary, rather than committing it into the compose file:
      #   docker run -p 6080:6080 ...
      #
      # x11vnc itself binds loopback inside the container regardless, so websockify is the
      # only thing that could ever be exposed.
    environment:
      SCREEN_GEOM: "1920x1080x24"
      PORT: "8088"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Uncomment with the tor service below to send this container's browser out through TOR.
    # EGRESS_NAME is what gets recorded against a result, so "walled" can be told apart from
    # "walled from this exit".
    # environment:
    #   EGRESS_PROXY: "socks5://tor:9050"
    #   EGRESS_NAME: "tor"

  # An exit, not a requirement. Commented out because the default route is the default, and a
  # compose file that silently routes every scrape through TOR would be a surprising thing to
  # inherit. TOR exits are public, enumerable and heavily challenged by exactly the bot walls
  # this package works around -- it is a tool for non-attribution, and it raises the challenge
  # rate rather than lowering it.
  #
  # EGRESS_PROXY above sets this container's DEFAULT exit, not its only one: a render can ask
  # for a different one per request (RenderRequest.egress_proxy), because a browser context
  # carries its own proxy even though the --proxy-server command-line flag is process-wide.
  # One container can therefore serve several exits, and running a second copy is not how you
  # get a second exit.
  #
  # tor:
  #   image: osminogin/tor-simple:latest
  #   restart: unless-stopped
