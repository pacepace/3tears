services:
  nodriver-sidecar:
    build: .
    # The SAME tag `docker buildx bake nodriver-sidecar` writes, and that matters more than it
    # looks. This once read `nodriver-sidecar:latest` while bake tags `aibots/...`, so a
    # deployment that built with bake and then ran compose got whatever stale image happened to
    # carry the bare name -- silently, with every command reported as succeeding. It cost a
    # verification run against a nine-day-old container whose feature under test did not exist
    # in it yet.
    #
    # REGISTRY defaults to `aibots` in docker-bake.hcl; override both together if you retag.
    image: ${REGISTRY:-aibots}/nodriver-sidecar:latest
    container_name: nodriver-sidecar
    # Chromium under Xvfb needs real shared memory; the Docker default (64mb)
    # crashes the renderer process under real page loads.
    shm_size: 2gb
    ports:
      # 8088 is the API port, and it is published here because a compose file that exposed
      # nothing would not run. Understand what it now carries before you keep this line in a
      # deployment: since the HITL endpoints landed, 8088 mints session tokens and RETURNS
      # RAW COOKIE JARS from a human's solved session. It authenticates nobody, for the same
      # reason 6080 below does not -- the sidecar holds no identity and cannot evaluate a
      # policy.
      #
      # So the reasoning written at length under 6080 applies to this port too, and the only
      # difference is that this one has to be reachable by SOMETHING. Bind it to an interface
      # your platform fronts (`- "127.0.0.1:8088:8088"`), or put it behind whatever already
      # authenticates the rest of your deployment. Publishing it to 0.0.0.0 on a shared
      # network hands anyone who can reach it a browser and a cookie jar.
      - "8088:8088"
      # Deliberately NOT publishing 6080 (websockify / noVNC).
      #
      # Adding `- "6080:6080"` here is a one-line change that looks helpful and is not: the
      # HITL endpoints authenticate nobody, and they never will. The sidecar holds no identity
      # and cannot evaluate a policy, so anything that reaches 6080 gets full mouse and
      # keyboard on a browser that may be holding a target's authenticated session.
      #
      # The session token proves only that a caller holds something this container minted --
      # deciding who was ENTITLED to it is the consuming platform's job, evaluated where
      # identity actually lives. This is not a control that is coming later; it is one that
      # belongs somewhere else. Put this port behind whatever fronts the rest of your
      # deployment.
      #
      # For a local look at it, publish the port on the command line where the decision is
      # visible and temporary, rather than committing it into the compose file:
      #   docker run -p 6080:6080 ...
      #
      # x11vnc itself binds loopback inside the container regardless, so websockify is the
      # only thing that could ever be exposed.
    environment:
      SCREEN_GEOM: "1920x1080x24"
      PORT: "8088"
      # Uncomment these two WITH the tor service at the bottom of this file to send this
      # container's browser out through TOR. They live inside this block deliberately: a second
      # `environment:` key on the same service is a YAML duplicate, and the later one wins
      # silently -- so the "obvious" placement next to the tor service would have dropped
      # SCREEN_GEOM and PORT above without a word.
      #
      # EGRESS_NAME is what gets recorded against a result, so "walled" can be told apart from
      # "walled from this exit".
      # EGRESS_PROXY: "socks5://tor:9050"
      # EGRESS_NAME: "tor"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # An exit, not a requirement. Commented out because the default route is the default, and a
  # compose file that silently routes every scrape through TOR would be a surprising thing to
  # inherit. TOR exits are public, enumerable and heavily challenged by exactly the bot walls
  # this package works around -- it is a tool for non-attribution, and it raises the challenge
  # rate rather than lowering it.
  #
  # EGRESS_PROXY above sets this container's DEFAULT exit, not its only one: a render can ask
  # for a different one per request (RenderRequest.egress_proxy), because a browser context
  # carries its own proxy even though the --proxy-server command-line flag is process-wide.
  # One container can therefore serve several exits, and running a second copy is not how you
  # get a second exit.
  #
  # tor:
  #   image: osminogin/tor-simple:latest
  #   restart: unless-stopped

  # Cloudflare WARP, the other exit this package names. Commented out for the same reason as
  # tor, and reached the same way -- `EGRESS_PROXY: "socks5://warp:40000"` with
  # `EGRESS_NAME: "warp"`.
  #
  # WARP and TOR are for OPPOSITE problems, which is why both exist rather than one. WARP is a
  # VPN: Cloudflare can associate the traffic with the account, so it is not anonymity, but its
  # addresses are far less challenged than TOR exits. Reach for WARP when a target simply
  # dislikes the container's own address; reach for TOR when the point is non-attribution and
  # a higher challenge rate is an acceptable price.
  #
  # No official Cloudflare image publishes a SOCKS listener, so this is a thin wrapper you
  # build: `warp-cli registration new && warp-cli mode proxy && warp-cli connect`, which puts
  # WARP on 127.0.0.1:40000 inside that container. Bind it to 0.0.0.0 there for the sidecar to
  # reach it. Registering and connecting the daemon is deployment work by design -- see the
  # module docstring in `threetears.core.egress` on why a library does not own another
  # network's process lifecycle.
  #
  # warp:
  #   build: ./warp
  #   restart: unless-stopped
