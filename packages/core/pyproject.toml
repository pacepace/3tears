[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears"
version = "0.80.0"
description = "Three-tier caching framework for Python -- L1 SQLite, L2 NATS KV, L3 PostgreSQL or a git working tree"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears-observe>=0.80.0,<0.81.0",
    "3tears-nats>=0.80.0,<0.81.0",
    "sqlalchemy",
    "asyncpg>=0.30",  # create_pool(connect=...), the hook a failed pool start closes its connections through
    "pydantic",
    "pyyaml>=6.0",  # duplicate-key-refusing loader for human-authored files (core.authored_yaml)
    "pydantic-core",  # to_jsonable_python (core.serialization); pydantic pins the release
]

[project.optional-dependencies]
# The signed-token and encryption half of core.security (identity tokens, proofs of possession,
# service envelopes, sealing), and the NATS L3 proxy, which signs its door requests with it. The
# tiers, the SQL backend, migrations, coordination and the sandbox / secret-reference / freshness
# modules import without it; threetears.core.security and .backends name this extra when a name
# behind it is reached without it.
security = [
    "cryptography>=42",  # AES-256-GCM encryption-at-rest (core.security.encryption)
    "pyjwt[crypto]>=2.8",  # EdDSA-signed identity tokens (core.security.identity_token)
]
# The traced outbound HTTP transport (core.http_client) and the egress selector's clients.
http = ["httpx"]
# The L2 (NATS KV) tier. Core never imports `nats-py` itself -- it reaches the
# client only through `threetears.nats`, whose nats-py-backed names are now
# lazy -- so this extra is the single switch for "this process talks to NATS".
# Anything using L2, DerivedCollection, or the invalidation listener wants it;
# an L1-SQLite-only process does not, and `nkeys` ships no wheels, so not
# installing it is the difference between a wheel install and a source build.
# The git L3 (threetears.core.backends.git) needs it too: its writer lease,
# forwarding and the advanced broadcast run over the NATS client.
nats = ["3tears-nats[client]>=0.80.0,<0.81.0"]
tracing = ["opentelemetry-api>=1.20,<2"]
# needed by :func:`threetears.core.egress.SocksEgress` / :func:`WarpEgress`, which build
# ``socks5://`` proxy URLs. httpx routes those through socksio and raises ImportError without
# it. Declared as an extra rather than a hard dependency because the overwhelming majority of
# consumers use the default route or an http(s) proxy and should not carry it -- but declared
# at all, because "install 3tears, reach for SocksEgress, get an ImportError on the first
# request" makes a packaging requirement look like a runtime bug.
socks = ["httpx[socks]"]
duckdb = ["duckdb>=1.1"]
# a scoped snapshot (threetears.core.collections.scoped_snapshot): a collection a pod needs whole,
# held in L2 as one columnar chunk per scope (Arrow IPC, zstd) and loaded into a DuckDB L1. pyarrow
# encodes and decodes the chunks; DuckDB reads Arrow without a copy.
snapshot = ["duckdb>=1.1", "pyarrow>=17"]
# pulled by anything importing :mod:`threetears.core.testing.fixtures`
# (the centralized testcontainer harness for downstream integration
# tests). lazy-imported inside fixture bodies so the rest of
# threetears.core stays free of these deps; the optional-extras
# declaration just gives consumers a one-line dep request:
# ``3tears[testing]`` in their dev / test extras.
testing = [
    "testcontainers[nats,postgres]>=4.15.0",  # 4.15.0 is the first with testcontainers.community
    "docker>=7.0",
    "pytest>=8.0",
    "boto3",  # the MinIO bucket fixture (core.testing.fixtures)
]
# Value types core's L1 caches and schema mapping accept when the host already uses them: pgvector's
# Vector columns and uuid_utils' UUID. Core probes for each and works without it.
pgvector = ["pgvector"]
uuid-utils = ["uuid-utils"]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears-observe = { workspace = true }
3tears-nats = { workspace = true }
