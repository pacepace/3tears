[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears"
version = "0.30.0"
description = "Three-tier caching framework for Python -- L1 SQLite, L2 NATS KV, L3 PostgreSQL"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears-observe>=0.30.0,<0.31.0",
    "3tears-nats>=0.30.0,<0.31.0",
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
    "pydantic",
    "uuid-utils",  # uuid7 ids (core.collections.registry, core.cache.sqlite/duckdb)
    "cryptography>=42",  # AES-256-GCM encryption-at-rest (core.security.encryption)
    "pyjwt[crypto]>=2.8",  # EdDSA-signed identity tokens (core.security.identity_token)
    "httpx",  # traced outbound HTTP transport (core.http_client)
    "pyyaml>=6.0",  # duplicate-key-refusing loader for human-authored files (core.authored_yaml)
]

[project.optional-dependencies]
# The L2 (NATS KV) tier. Core never imports `nats-py` itself -- it reaches the
# client only through `threetears.nats`, whose nats-py-backed names are now
# lazy -- so this extra is the single switch for "this process talks to NATS".
# Anything using L2, DerivedCollection, or the invalidation listener wants it;
# an L1-SQLite-only process does not, and `nkeys` ships no wheels, so not
# installing it is the difference between a wheel install and a source build.
nats = ["3tears-nats[client]>=0.30.0,<0.31.0"]
tracing = ["opentelemetry-api>=1.20"]
# needed by :func:`threetears.core.egress.SocksEgress` / :func:`WarpEgress`, which build
# ``socks5://`` proxy URLs. httpx routes those through socksio and raises ImportError without
# it. Declared as an extra rather than a hard dependency because the overwhelming majority of
# consumers use the default route or an http(s) proxy and should not carry it -- but declared
# at all, because "install 3tears, reach for SocksEgress, get an ImportError on the first
# request" makes a packaging requirement look like a runtime bug.
socks = ["httpx[socks]"]
duckdb = ["duckdb>=1.0"]
# pulled by anything importing :mod:`threetears.core.testing.fixtures`
# (the centralized testcontainer harness for downstream integration
# tests). lazy-imported inside fixture bodies so the rest of
# threetears.core stays free of these deps; the optional-extras
# declaration just gives consumers a one-line dep request:
# ``3tears[testing]`` in their dev / test extras.
testing = [
    "testcontainers[nats,postgres]>=4.0",
    "docker>=7.0",
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears-observe = { workspace = true }
3tears-nats = { workspace = true }
