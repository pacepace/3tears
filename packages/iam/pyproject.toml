[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-iam"
version = "0.78.0"
description = "Identity and access primitives: OAuth2/OIDC, SAML, passwords, JWT sessions, DPoP, TOTP, WebAuthn, and the anti-automation controls that guard them"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The base is protocol, crypto and policy: what a consumer doing sign-in, OIDC and sessions needs, with
# no Postgres or NATS stack behind it. The floor is pinned in tests/enforcement/test_dependency_alignment.py.
dependencies = [
    "3tears-observe>=0.78.0,<0.79.0",
    # the sensitive-action taxonomy stepup names (ImpersonationCategory), in the dependency-free
    # leaf agent-acl's impersonation deny-list reads too. One class for both checks, without
    # installing the authorization layer to name it.
    "3tears-access-contracts>=0.78.0,<0.79.0",
    # argon2id for password hashing, bcrypt for verify-then-upgrade of hashes
    # migrated in from an older system. bcrypt is verify-only here: nothing in
    # this package ever WRITES a bcrypt hash.
    "argon2-cffi>=25.1.0",
    "bcrypt>=5.0.0",
    # session tokens (EdDSA or HS256), DPoP proofs, and OIDC id_token
    # verification. [crypto] pulls the asymmetric backends.
    "pyjwt[crypto]>=2.8",
    # Ed25519/EC key handling for session tokens and DPoP proofs.
    "cryptography>=43.0",
    # OIDC discovery, the OAuth2 token exchange, provider userinfo/profile
    # fetches, and the k-anonymity breach-corpus range query. Used directly
    # rather than through authlib: the flows here are small enough that a
    # second OAuth framework would be more surface than saved code.
    "httpx>=0.27",
    # TOTP code generation/verification (RFC 6238).
    "pyotp>=2.9",
    # OIDC id_token verification. joserfc rather than pyjwt for this one path: it models a
    # JWKS KeySet and a claims registry directly, which is what an id_token needs, and
    # authlib's own jose module -- the obvious alternative -- is deprecated.
    "joserfc>=1.0",
    # SecretStr on the seed-sealing surface, and the type core's seal/open_secret speak.
    # Declared directly rather than leaned on transitively: this package names it in a
    # public signature, so it is a real dependency of this API, not an implementation detail.
    "pydantic>=2",
]

[project.optional-dependencies]
# The three modules that build on core rather than beside it: dpop (core's jwk_thumbprint and
# proof-freshness rules, with a caller-supplied ReplayGuard), stores.attempt_limiter
# (CollectionAttemptLimiter, over core's WindowedCounter and collections), and TOTP's
# seal_seed/unseal_seed (core's seal/open_secret, so sealed seeds stay readable by the one
# implementation that wrote them). Each raises an ImportError naming this extra without it.
# Behind an extra because core brings sqlalchemy, asyncpg and pyyaml, which nothing else here uses.
core = [
    "3tears[security]>=0.78.0,<0.79.0",
]
# The switch for the KV stores in threetears.iam.stores.nats_kv: auth codes, OAuth state and
# single-use tickets, each short-lived and TTL'd, which is a KV bucket's job. The module itself
# names the NATS client only for type checking and takes the bucket by shape, so this extra
# installs the client a caller opens that bucket with. It brings nats-py and nkeys, which has no
# wheels for every target, so a consumer with its own stores does not carry it.
nats = [
    "3tears-nats[client]>=0.78.0,<0.79.0",
]
# SAML drags pysaml2 AND the xmlsec1 SYSTEM binary in with it. A consumer that
# only needs OAuth/OIDC should not inherit an apt-get line, so the SAML service
# provider lives behind this extra and threetears.iam.saml raises a pointed
# ImportError when it is missing.
saml = [
    "pysaml2>=7.5.0",
    "defusedxml>=0.7",
]
# WebAuthn/passkey registration + assertion verification. Optional for the same
# reason: a consumer doing password + OIDC only should not carry it.
webauthn = [
    "webauthn>=3.0",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-observe = { workspace = true }
3tears-access-contracts = { workspace = true }
3tears-nats = { workspace = true }

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["threetears.iam"]
explicit_package_bases = true
ignore_missing_imports = true

# no [tool.pytest.ini_options] block: pytest's rootdir detection picks the
# closest pyproject with that block, so a per-package one would hide the
# workspace conftest.py and unregister the canonical pytest_plugins line.
# inherit from the workspace instead.
