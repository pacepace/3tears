[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-object-store"
version = "0.89.0"
description = "Streaming S3-compatible object store for large binary artifacts (Path-2)"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# the contract is dependency-free (media-contracts); this impl package
# isolates the aiobotocore (-> botocore) S3 client tree so it
# never leaks into the contract or its other consumers. core (``3tears``) is
# pulled in for the secret_refs resolver used by the wiring helper -- core is
# foundational + acyclic and brings no aiobotocore, so the isolation still holds. aiobotocore
# directly rather than through aioboto3, whose last release (15.5.0, 2025-10) pins aiobotocore 2.25
# and with it a boto3 too old for redshift-connector's eval() fix (CVE-2026-8838, needs 2.1.14).
dependencies = [
    "3tears>=0.89.0,<0.90.0",
    "3tears-media-contracts>=0.89.0,<0.90.0",
    "3tears-observe>=0.89.0,<0.90.0",
    "aiobotocore>=3.9",
    "cryptography>=42",  # AES-256-GCM sealing and scrypt key derivation (object_store.encrypted)
    "pydantic>=2",  # SecretStr for the sealing passphrase (object_store.encrypted)
    "botocore",  # retry config and ClientError (object_store.s3); aiobotocore brings the release it needs
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.uv.sources]
3tears = { workspace = true }
3tears-media-contracts = { workspace = true }
3tears-observe = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]
