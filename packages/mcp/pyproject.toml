[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-mcp"
version = "0.77.1"
description = "Shared MCP framework: McpServer + McpTool + PlatformHttpClient + per-tool RBAC backed by mcp_tool_grants and the task-02 epoch broadcast"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# The base is the server, the tools, identity and PlatformHttpClient: what a host with its own
# Authorizer needs. The floor is pinned in tests/enforcement/test_dependency_alignment.py.
dependencies = [
    "3tears-observe>=0.77.0,<0.78.0",
    "jsonschema>=4.20",  # McpServer checks arguments against inputSchema (mcp 2.x no longer does); mcp's own dependency
    "mcp>=1.27,<3",  # 1.x and 2.x both supported (McpServer picks the SDK API) until the owner drops 1.x
    "httpx>=0.27",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The grant store: LocalGrantAuthorizer, mcp.rbac and mcp.migrations -- grants in Postgres, kept
# coherent across pods by an epoch broadcast. The only part of the package that needs the rest of
# the family, so a server that brings its own Authorizer does not install it.
grants = [
    "3tears>=0.77.0,<0.78.0",
    "3tears-epoch>=0.77.0,<0.78.0",
    "3tears-nats>=0.77.0,<0.78.0",
    "sqlalchemy",  # mcp.rbac's table declaration
    "uuid-utils",  # uuid7 ids (mcp.rbac)
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-epoch = { workspace = true }
3tears-nats = { workspace = true }
3tears-observe = { workspace = true }

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["threetears.mcp"]
explicit_package_bases = true
ignore_missing_imports = true

# no [tool.pytest.ini_options] block: pytest's rootdir detection
# picks the closest pyproject with [tool.pytest.ini_options], so a
# per-package block hides the workspace-level conftest.py and
# unregisters the canonical ``pytest_plugins = ["threetears.core.
# testing.fixtures"]`` line. inherit from the workspace instead.
