[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-registry"
version = "0.87.1"
description = "MCP-compatible tool registry for 3tears tool system"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "3tears[security]>=0.87.0,<0.88.0",
    "3tears-agent-acl>=0.87.0,<0.88.0",
    "3tears-agent-tools>=0.87.0,<0.88.0",
    # following the access tables' write generations from the epoch bucket
    "3tears-epoch>=0.87.0,<0.88.0",
    # [client]: this package uses the NATS client at runtime, and nats-py is an
    # extra of 3tears-nats so an L1-SQLite-only consumer is not forced to build it.
    "3tears-nats[client]>=0.87.0,<0.88.0",
    "3tears-observe>=0.87.0,<0.88.0",
    "nats-py>=2.0",
    "prometheus-client>=0.20",
    "pydantic>=2.0",
    "sqlalchemy",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-agent-acl = { workspace = true }
3tears-agent-tools = { workspace = true }
3tears-epoch = { workspace = true }
3tears-nats = { workspace = true }
3tears-observe = { workspace = true }
