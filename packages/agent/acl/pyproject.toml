[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-agent-acl"
version = "0.54.0"
description = "shared rbac evaluator + cache for the 3tears platform: groups, roles, role assignments, evaluation trails"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears>=0.54.0,<0.55.0",
    "3tears-observe>=0.54.0,<0.55.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# The cross-process rbac invalidation bus (threetears.agent.acl.invalidation_bus).
bus = ["3tears-nats[client]>=0.54.0,<0.55.0"]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears-nats = { workspace = true }
3tears = { workspace = true }
3tears-observe = { workspace = true }

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["threetears.agent.acl"]
explicit_package_bases = true
ignore_missing_imports = true

# no [tool.pytest.ini_options] block: pytest roots a run at the closest
# pyproject that has one, so a per-package block makes `scripts/test.sh <pkg>`
# drop the workspace configuration (import mode, pythonpath, markers) and the
# tests' relative helper imports fail to collect. inherit from the workspace
# instead; tests/enforcement/test_one_pytest_config.py holds this.
