[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-agent-skills"
version = "0.95.0"
description = "Procedural memory for LLM agents -- skill definitions + invocation history"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears>=0.95.0,<0.96.0",
    "3tears-observe>=0.95.0,<0.96.0",
    "langchain-core",
    "pydantic",
    "uuid-utils",
    "sqlalchemy",
]

# the modules defining this package's collection classes, imported at process start by
# threetears.core.collections.load_declared_collections(), so every registry lookup knows their tables
[project.entry-points."threetears.collections"]
"threetears.agent.skills.collections" = "threetears.agent.skills.collections"

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-observe = { workspace = true }
