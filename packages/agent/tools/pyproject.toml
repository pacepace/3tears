[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-agent-tools"
version = "0.24.5"
description = "Tool framework for LLM agents -- routing, execution, and builtin tools"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "3tears>=0.24.0,<0.25.0",
    "3tears-agent-audit>=0.24.0,<0.25.0",
    "3tears-agent-memory>=0.24.0,<0.25.0",
    "3tears-langgraph>=0.24.0,<0.25.0",
    "3tears-media-contracts>=0.24.0,<0.25.0",
    # [client]: this package uses the NATS client at runtime, and nats-py is an
    # extra of 3tears-nats so an L1-SQLite-only consumer is not forced to build it.
    "3tears-nats[client]>=0.24.0,<0.25.0",
    "3tears-observe>=0.24.0,<0.25.0",
    # [standalone]: the fetch half of the search seam. Extract reads
    # candidate-derived URLs under a byte cap, which the traced client cannot
    # do -- see threetears.agent.tools.search_transport for the split.
    "3tears-search[standalone]>=0.24.0,<0.25.0",
    "langchain-core",
    "httpx",
    "prometheus-client>=0.20",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[project.optional-dependencies]
calculator = ["simpleeval"]
units = ["pint"]
fetch = ["3tears-search[extract]>=0.24.0,<0.25.0"]
pdf = ["PyMuPDF"]
docx = ["python-docx"]
xlsx = ["openpyxl"]
vision = [
    "pillow",
]
ocr = ["pytesseract", "pdf2image"]
document = ["PyMuPDF", "python-docx", "openpyxl"]
all = ["simpleeval", "pint", "3tears-search[extract]>=0.24.0,<0.25.0", "PyMuPDF", "python-docx", "openpyxl", "pytesseract", "pdf2image", "Pillow"]

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears = { workspace = true }
3tears-agent-audit = { workspace = true }
3tears-agent-memory = { workspace = true }
3tears-langgraph = { workspace = true }
3tears-media-contracts = { workspace = true }
3tears-nats = { workspace = true }
3tears-observe = { workspace = true }
3tears-search = { workspace = true }
