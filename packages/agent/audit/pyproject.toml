[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "3tears-agent-audit"
version = "0.54.0"
description = "unified audit envelope, fire-and-forget publish helper, and the audit erasure rule and hub anonymization request for the 3tears platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "pace"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # [client]: this package uses the NATS client at runtime, and nats-py is an
    # extra of 3tears-nats so an L1-SQLite-only consumer is not forced to build it.
    "3tears-nats[client]>=0.54.0,<0.55.0",
    "3tears-observe>=0.54.0,<0.55.0",
    "pydantic>=2.0",
]

[project.urls]
Repository = "https://github.com/pacepace/3tears"

[tool.hatch.build.targets.wheel]
packages = ["src/threetears"]

[tool.uv.sources]
3tears-nats = { workspace = true }
3tears-observe = { workspace = true }

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["threetears.agent.audit"]
explicit_package_bases = true
ignore_missing_imports = true

# no [tool.pytest.ini_options] block: pytest roots a run at the closest
# pyproject that has one, so a per-package block makes `scripts/test.sh <pkg>`
# drop the workspace configuration (import mode, pythonpath, markers) and the
# tests' relative helper imports fail to collect. inherit from the workspace
# instead; tests/enforcement/test_one_pytest_config.py holds this.
