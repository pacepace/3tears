[[package]]
name = "3tears"
version = "0.83.0"
source = { editable = "packages/core" }
dependencies = [
    { name = "3tears-nats" },
    { name = "3tears-observe" },
    { name = "asyncpg" },
    { name = "pydantic" },
    { name = "pydantic-core" },
    { name = "pyyaml" },
    { name = "sqlalchemy" },
]

[package.optional-dependencies]
