    { name = "boto3" },
    { name = "docker" },
    { name = "pytest" },
    { name = "testcontainers", extra = ["nats"] },
]
tracing = [
    { name = "opentelemetry-api" },
]
uuid-utils = [
    { name = "uuid-utils" },
]

