    { name = "duckdb" },
]
http = [
    { name = "httpx" },
]
nats = [
    { name = "3tears-nats", extra = ["client"] },
]
pgvector = [
    { name = "pgvector" },
]
security = [
    { name = "cryptography" },
    { name = "pyjwt", extra = ["crypto"] },
]
snapshot = [
    { name = "duckdb" },
    { name = "pyarrow" },
]
socks = [
    { name = "httpx", extra = ["socks"] },
]
