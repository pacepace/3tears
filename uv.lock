    { name = "3tears-observe", editable = "packages/observe" },
    { name = "asyncpg", specifier = ">=0.30" },
    { name = "boto3", marker = "extra == 'testing'" },
    { name = "cryptography", marker = "extra == 'security'", specifier = ">=42" },
    { name = "docker", marker = "extra == 'testing'", specifier = ">=7.0" },
    { name = "duckdb", marker = "extra == 'duckdb'", specifier = ">=1.1" },
    { name = "duckdb", marker = "extra == 'snapshot'", specifier = ">=1.1" },
    { name = "httpx", marker = "extra == 'http'" },
    { name = "httpx", extras = ["socks"], marker = "extra == 'socks'" },
    { name = "opentelemetry-api", marker = "extra == 'tracing'", specifier = ">=1.20,<2" },
    { name = "pgvector", marker = "extra == 'pgvector'" },
    { name = "pyarrow", marker = "extra == 'snapshot'", specifier = ">=17" },
    { name = "pydantic" },
    { name = "pydantic-core" },
    { name = "pyjwt", extras = ["crypto"], marker = "extra == 'security'", specifier = ">=2.8" },
    { name = "pytest", marker = "extra == 'testing'", specifier = ">=8.0" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "sqlalchemy" },
    { name = "testcontainers", extras = ["nats", "postgres"], marker = "extra == 'testing'", specifier = ">=4.15.0" },
    { name = "uuid-utils", marker = "extra == 'uuid-utils'" },
]
provides-extras = ["security", "http", "nats", "tracing", "socks", "duckdb", "snapshot", "testing", "pgvector", "uuid-utils"]

