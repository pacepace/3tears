# testament (https://github.com/brookstalley/testament) runs the unit suite and, suite by suite, the
# integration suite on a pool of runners. ./scripts/test.sh and ./scripts/test-integration.sh hand off
# to it when `testament` is on PATH; without it, nothing here is read.
#
# The unit suite's command and selection mirror test.sh's whole-suite run, minus `-n 4 --dist loadgroup`:
# testament distributes the tests itself. The selection holds the evals render tests (the `browser`
# marker): the image carries headless Chromium for them, and the env below makes a launch that fails
# fail those tests rather than skip them. The event loop's wall-clock tests (`loop_timing`) are not in
# the unit suite: they have a suite of their own (`loop_timing`, one batch a runner), and CI runs them
# serially on GitHub's runner (scripts/ci-unit-tests.sh --loop-timing). The `docker` tests
# drive a Docker daemon, which the image has none of, and the `secrets` tests read a credential, which
# never ships to a runner: both stay off the pool and run on the laptop (`test-integration.sh --here`
# runs them all; test-live-claude-cli.sh records the Claude CLI batch; `TAVILY_API_KEY=... ./scripts/test.sh
# search packages/search/tests/test_embedded_smoke.py` runs Tavily alone, the key keeping it local). `secrets_marker` would run them locally inside the same run, but can't be
# set beside `fallback = "pool-only"`, so the commands deselect them instead.
#
# `fallback = "pool-only"`: when the pool can't take a run, it fails (exit 2, naming this key)
# rather than running the suite on the submitting machine. A local run is a choice, made with
# TESTAMENT=off and a TESTAMENT_OFF_REASON (scripts/test.sh). Needs testament 0.45.1 or later.
#
# Version 3: the suites are tables of their own ([suites.<name>]), each with its command, selection
# and areas; the keys up to [git] are the project's, shared by every suite (one image, one setup,
# one workspace per tree). `default` is the unit suite. scripts/test.sh and scripts/ci-unit-pool.sh
# name it (`--suite default`), so a run of theirs stays this suite when another is added. A bare
# `testament run` (no `--`, no `--suite`) runs every suite, the integration suite included.
manifest_version = 3
name = "3tears"
executor = "container"
fallback = "pool-only"
env_inputs = ["uv.lock", ".python-version"]
batch_timeout_s = 1800
collect_timeout_s = 900

[env]
UV_CACHE_DIR = "/tr/cache/uv"
# where docker/testament.Dockerfile installed Chromium (its ENV says the same)
PLAYWRIGHT_BROWSERS_PATH = "/opt/ms-playwright"
# packages/evals/tests/report_kit_support.py: a browser test whose Chromium cannot launch fails here
THREETEARS_REQUIRE_CHROMIUM = "1"

[image]
dockerfile = "docker/testament.Dockerfile"
inputs = ["docker/testament.Dockerfile", "scripts/check-fallback-fonts.sh", "scripts/check-test-services.sh"]

[setup]
timeout_s = 1800
# CI's install (`uv sync --extra vision`), frozen to the lockfile
steps = [["uv", "sync", "--frozen", "--extra", "vision", "--quiet"]]

[git]
# Release tags (and the trees they point at) go with the tree, so tests that read a release from git run on the pool.
tags = ["v[0-9]*"]

# The unit suite. `default_for_paths`: a path that more than one suite could take (each collects
# packages/ and tests/, split by marker) runs here, as do options with no path (`-- -k foo`).
[suites.default]
adapter = "pytest"
command = ["uv", "run", "--frozen", "pytest", "-m", "not integration and not loop_timing and not docker and not secrets"]
default_selection = ["packages/", "tests/"]
default_for_paths = true

# Areas divide the one suite for reporting and selection without splitting it: `testament run
# --area core` or `--not-area evals`, `testament time --by area`, `trend --by area`. They join no
# cache or environment key and change no batching. Order matters: a test belongs to the FIRST area
# whose glob matches its path (fnmatch, where `*` crosses `/`). `platform` names its packages rather
# than ending in a catch-all `packages/**`, which would overlap every area above it and fail
# `testament areas check --strict`; a new package needs its glob here, and
# tests/enforcement/test_testament_areas_cover_the_tree.py says so. Needs testament 0.44.0 or later.
[suites.default.areas]
evals = ["packages/evals/**"]
enforcement = ["packages/enforcement/**", "tests/enforcement/**"]
core = ["packages/core/**"]
agent = ["packages/agent/**"]
platform = [
    "packages/backup/**",
    "packages/channels/**",
    "packages/conversations/**",
    "packages/datasources/**",
    "packages/epoch/**",
    "packages/geo/**",
    "packages/iam/**",
    "packages/interfaces/**",
    "packages/langgraph/**",
    "packages/mcp/**",
    "packages/models/**",
    "packages/nats/**",
    "packages/object-store/**",
    "packages/observe/**",
    "packages/registry/**",
    "packages/scheduled-jobs/**",
    "packages/scrape/**",
    "packages/search/**",
    "packages/tool-schema/**",
    "tests/test_*.py",
    "tests/integration/**",
]

# The event loop's wall-clock tests (`loop_timing`), as scripts/ci-unit-tests.sh runs them apart and serially: a
# runner takes one batch of them at a time, never two beside each other. Their bounds are still calibrated against
# the load beside them, since a runner runs other suites' and projects' batches meanwhile. A path's loop_timing tests
# run with `testament run --suite loop_timing -- <path>`.
[suites.loop_timing]
adapter = "pytest"
command = ["uv", "run", "--frozen", "pytest", "-m", "loop_timing and not integration and not docker and not secrets"]
default_selection = ["packages/", "tests/"]
max_batches_per_runner = 1

[suites.loop_timing.areas]
evals = ["packages/evals/**"]
enforcement = ["packages/enforcement/**", "tests/enforcement/**"]
core = ["packages/core/**"]
agent = ["packages/agent/**"]
platform = [
    "packages/backup/**",
    "packages/channels/**",
    "packages/conversations/**",
    "packages/datasources/**",
    "packages/epoch/**",
    "packages/geo/**",
    "packages/iam/**",
    "packages/interfaces/**",
    "packages/langgraph/**",
    "packages/mcp/**",
    "packages/models/**",
    "packages/nats/**",
    "packages/object-store/**",
    "packages/observe/**",
    "packages/registry/**",
    "packages/scheduled-jobs/**",
    "packages/scrape/**",
    "packages/search/**",
    "packages/tool-schema/**",
    "tests/test_*.py",
    "tests/integration/**",
]

# The integration suite: the tests marked `integration` that need only Postgres, NATS or S3, with those
# services started inside the pool's container as child processes (threetears.core.testing.services),
# since the container has no Docker daemon. scripts/test-integration.sh runs it: the paths (directories or
# files) listed in `default_selection`, nothing on the laptop. Its `--here` runs the rest there: the files
# that drive Docker themselves or read a credential (the `docker` and `secrets` markers, deselected here
# as in the unit suite). tests/enforcement/test_integration_suite_selection.py holds the two lists to every
# integration test in the tree. The `process_only` modules check these child-process services themselves;
# off the pool they are deselected (tests/require_services.py).
#
# A suite's `env` replaces the project's whole, so the uv cache is repeated; Chromium's two are left
# out, since no integration test drives a browser (the image's ENV still names Chromium's path).
# THREETEARS_TEST_SERVICES=process selects the child processes; THREETEARS_REQUIRE_SERVICES=1 makes a
# service that is not there fail the test rather than skip it, and tests/require_services.py turns any
# other runtime skip of an integration test into a failure, since a skip reads like a pass.
[suites.integration]
adapter = "pytest"
command = ["uv", "run", "--frozen", "pytest", "-m", "integration and not docker and not secrets"]
default_selection = [
    "packages/agent/acl/tests/integration",
    "packages/agent/audit/tests/integration",
    "packages/agent/identity/tests/integration",
    "packages/agent/intention/tests/integration",
    "packages/agent/knowledge/tests/integration",
    "packages/agent/memory/tests/integration",
    "packages/agent/skills/tests/integration",
    "packages/agent/tools/tests/integration",
    "packages/agent/wake/tests/integration",
    "packages/agent/workspace/tests/integration",
    "packages/backup/tests/integration",
    "packages/channels/tests/integration",
    "packages/conversations/tests/integration",
    "packages/core/tests/integration",
    # datasources' Postgres modules; its Redshift ones read a credential and stay local
    "packages/datasources/tests/integration/test_asyncpg_driver_live.py",
    "packages/datasources/tests/integration/test_asyncpg_driver_pool_start_live.py",
    "packages/datasources/tests/integration/test_asyncpg_text_parameters_live.py",
    "packages/datasources/tests/integration/test_bulk_read_live.py",
    "packages/datasources/tests/integration/test_capability_source_collection_live.py",
    "packages/datasources/tests/integration/test_collection_schema_parity_live.py",
    "packages/datasources/tests/integration/test_transaction_live.py",
    "packages/epoch/tests/integration",
    "packages/geo/tests/integration",
    "packages/iam/tests/integration",
    "packages/langgraph/tests/integration",
    "packages/mcp/tests/integration",
    # nats' modules; the Docker lame-duck module drives containers itself and stays local (its scenarios run
    # here as test_lame_duck_handover_process_live.py)
    "packages/nats/tests/integration/test_a_large_request_round_trips_live.py",
    "packages/nats/tests/integration/test_a_lost_file_stream_comes_back_live.py",
    "packages/nats/tests/integration/test_a_persisted_copy_is_refilled_live.py",
    "packages/nats/tests/integration/test_a_pod_can_bounce_its_bytes_to_any_subject_residual_live.py",
    "packages/nats/tests/integration/test_a_pod_never_manages_a_stream_live.py",
    "packages/nats/tests/integration/test_a_pod_reads_only_its_own_messages_live.py",
    "packages/nats/tests/integration/test_a_restart_wiped_stream_comes_back_live.py",
    "packages/nats/tests/integration/test_a_slow_pull_handler_keeps_its_message_live.py",
    "packages/nats/tests/integration/test_a_stopping_pull_consumer_strands_nothing_live.py",
    "packages/nats/tests/integration/test_a_subscription_exists_when_subscribe_returns_live.py",
    "packages/nats/tests/integration/test_a_timed_out_ping_leaves_the_connection_reading_live.py",
    "packages/nats/tests/integration/test_agent_bucket_grant_live.py",
    "packages/nats/tests/integration/test_agent_table_grant_live.py",
    "packages/nats/tests/integration/test_an_existing_durable_follows_its_code_live.py",
    "packages/nats/tests/integration/test_connection_kick_live.py",
    "packages/nats/tests/integration/test_credential_refusal_live.py",
    "packages/nats/tests/integration/test_credential_renewal_live.py",
    "packages/nats/tests/integration/test_data_version_key_grant_live.py",
    "packages/nats/tests/integration/test_declared_bucket_bounds_live.py",
    "packages/nats/tests/integration/test_declared_replicas_live.py",
    "packages/nats/tests/integration/test_declarer_owns_bucket_live.py",
    "packages/nats/tests/integration/test_durable_result_grants_live.py",
    "packages/nats/tests/integration/test_forged_door_delivery_live.py",
    "packages/nats/tests/integration/test_forward_grants_live.py",
    "packages/nats/tests/integration/test_forward_round_trip.py",
    "packages/nats/tests/integration/test_hitl_grant_silent_failure_live.py",
    "packages/nats/tests/integration/test_kv_bucket_not_found_live.py",
    "packages/nats/tests/integration/test_kv_bucket_reconcile_live.py",
    "packages/nats/tests/integration/test_kv_cas_delete_round_trip.py",
    "packages/nats/tests/integration/test_kv_get_latest_round_trip.py",
    "packages/nats/tests/integration/test_kv_removal_markers_live.py",
    "packages/nats/tests/integration/test_kv_self_heal_round_trip.py",
    "packages/nats/tests/integration/test_kv_watch_key_grant_live.py",
    "packages/nats/tests/integration/test_kv_watch_prefix_round_trip.py",
    "packages/nats/tests/integration/test_lame_duck_handover_process_live.py",
    "packages/nats/tests/integration/test_nats_round_trip.py",
    "packages/nats/tests/integration/test_object_store_round_trip.py",
    "packages/nats/tests/integration/test_oplog_round_trip.py",
    "packages/nats/tests/integration/test_pipe_round_trip.py",
    "packages/nats/tests/integration/test_renewal_request_live.py",
    "packages/nats/tests/integration/test_server_reported_credential_ttl_live.py",
    "packages/nats/tests/integration/test_shared_pod_bucket_owner_keys_live.py",
    "packages/nats/tests/integration/test_tool_pod_object_store_grant_live.py",
    "packages/nats/tests/integration/test_user_jwt_scoped_grant_live.py",
    "packages/object-store/tests/integration",
    "packages/registry/tests/integration",
    "packages/scheduled-jobs/tests/integration",
    # scrape's Postgres and NATS modules; the sidecar pipe drives Docker
    "packages/scrape/tests/integration/test_enrichment_status_migration.py",
    "packages/scrape/tests/integration/test_health_l3_roundtrip.py",
    "packages/scrape/tests/integration/test_reprobe_booking_l3.py",
]
env = { UV_CACHE_DIR = "/tr/cache/uv", THREETEARS_TEST_SERVICES = "process", THREETEARS_REQUIRE_SERVICES = "1" }

# Areas within the integration suite, for `testament time --suite integration --by area`. First match wins,
# so the catch-all comes last.
[suites.integration.areas]
nats = ["packages/nats/**"]
core = ["packages/core/**"]
agent = ["packages/agent/**"]
platform = ["packages/**"]
