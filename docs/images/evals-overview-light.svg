<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 692" width="820" height="692" role="img" aria-label="The designed evals architecture, simplified. The host app brings its own UI, storage, tracing and model clients through small adapters, any of which but the UI may be built on an optional 3tears module instead, and its code under test through a kind. The evals engine depends on no other 3tears package. Its report writer loops: the analyst writes, code checks bounce a faulty draft, the editor reviews, the analyst revises, and the report is stored. Offline, a capability gap the analyst reports becomes a change to 3tears that ships back to the host."><title>The designed evals architecture, simplified. The host app brings its own UI, storage, tracing and model clients through small adapters, any of which but the UI may be built on an optional 3tears module instead, and its code under test through a kind. The evals engine depends on no other 3tears package. Its report writer loops: the analyst writes, code checks bounce a faulty draft, the editor reviews, the analyst revises, and the report is stored. Offline, a capability gap the analyst reports becomes a change to 3tears that ships back to the host.</title><style>
.bg { fill: #f6f6f2; }
.z-host { fill: #eedabf; stroke: #b0925a; stroke-width: 1.4; }
.z-3t { fill: #acc8d9; }
.z-dev { fill: url(#hatch); stroke: #6a4c9c; stroke-width: 1.4; stroke-dasharray: 7 3 2 3; }
.hbg { fill: #f8f7fa; } .hln { stroke: #d8cfe6; stroke-width: 1.4; }
.subzone { fill: none; stroke: #6f8aa3; stroke-dasharray: 3 3; }
text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
.zl { font-size: 12px; font-weight: 700; letter-spacing: .06em; fill: #1c2329; }
.note { font-size: 13px; font-style: italic; fill: #1c2329; }
.box { stroke: #a3adb7; stroke-width: 1; }
.box.h { fill: #fff7ec; } .box.t { fill: #c3dbea; } .box.d { fill: #fdfcff; }
.box.o { fill: #c3dbea; stroke: #46515c; stroke-width: 1.4; stroke-dasharray: 5 3; }
.t { font-size: 14px; font-weight: 700; fill: #1c2329; }
.s { font-size: 13px; fill: #4f5963; }
.p { font-size: 13px; font-weight: 700; fill: #4f5963; }
.lbl { font-size: 12px; font-weight: 600; fill: #4f5963; }
.ln { fill: none; stroke: #46515c; stroke-width: 1.4; }
.ln.opt { stroke-dasharray: 4 3; }
.ln.ac { stroke: #b4441b; stroke-width: 2.2; }
.ln.dev { stroke: #6a4c9c; stroke-width: 2; stroke-dasharray: 8 3 2 3; }
.ah { fill: #46515c; } .ahA { fill: #b4441b; } .ahD { fill: #6a4c9c; }
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahA" d="M0,1 L10,5 L0,9 z"/></marker><marker id="ahD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ahD" d="M0,1 L10,5 L0,9 z"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hbg" width="7" height="7"/><line class="hln" x1="0" y1="0" x2="0" y2="7"/></pattern></defs><rect class="bg" width="820" height="692" rx="8"/><rect class="z-3t" x="12" y="156" width="168" height="276" rx="6"/><text class="zl" x="24" y="176">3TEARS, OPTIONAL</text><rect class="z-host" x="192" y="36" width="180" height="484" rx="6"/><text class="zl" x="204" y="60">HOST APP</text><rect class="z-3t" x="384" y="36" width="432" height="484" rx="6"/><text class="zl" x="398" y="60">3TEARS-EVALS</text><rect class="z-dev" x="12" y="540" width="804" height="140" rx="6"/><text class="zl" x="24" y="564">OFFLINE: THE TOOL-IMPROVEMENT LOOP</text><rect class="subzone" x="552" y="88" width="254" height="336" rx="5"/><text class="note" x="398" y="78">depends on no other 3tears package</text><text class="zl" x="560" y="106">REPORT WRITER</text><path class="ln opt" d="M204,216 H168" marker-end="url(#ah)"/><path class="ln opt" d="M204,304 H168" marker-end="url(#ah)"/><path class="ln opt" d="M204,392 H168" marker-end="url(#ah)"/><path class="ln " d="M360,128 H398" marker-end="url(#ah)" marker-start="url(#ah)"/><path class="ln " d="M398,216 H360" marker-end="url(#ah)" marker-start="url(#ah)"/><path class="ln " d="M360,304 H398" marker-end="url(#ah)"/><path class="ln " d="M398,392 H360" marker-end="url(#ah)"/><path class="ln " d="M398,480 H360" marker-end="url(#ah)"/><path class="ln ac" d="M534,132 H576" marker-end="url(#ahA)"/><path class="ln ac" d="M640,168 V196" marker-end="url(#ahA)"/><path class="ln ac" d="M640,248 V276" marker-end="url(#ahA)"/><path class="ln ac" d="M640,328 V356" marker-end="url(#ahA)"/><path class="ln " d="M788,222 H800 V150 H788" marker-end="url(#ah)"/><path class="ln " d="M576,302 H562 V142 H576" marker-end="url(#ah)"/><path class="ln dev" d="M788,128 H812 V614 H788" marker-end="url(#ahD)"/><path class="ln dev" d="M568,614 H516" marker-end="url(#ahD)"/><path class="ln dev" d="M316,614 H282 V522" marker-end="url(#ahD)"/><rect class="box o" x="24" y="184" width="144" height="64" rx="3"/><text class="t" x="34" y="206">3tears core</text><text class="s" x="34" y="224">a store over</text><text class="s" x="34" y="240">DataStore</text><rect class="box o" x="24" y="272" width="144" height="64" rx="3"/><text class="t" x="34" y="294">3tears observe</text><text class="s" x="34" y="312">the OTel pipeline</text><text class="s" x="34" y="328">it builds</text><rect class="box o" x="24" y="360" width="144" height="64" rx="3"/><text class="t" x="34" y="382">3tears-models</text><text class="s" x="34" y="400">its model</text><text class="s" x="34" y="416">clients</text><rect class="box h" x="204" y="96" width="156" height="64" rx="3"/><text class="t" x="214" y="118">Web UI or MCP</text><text class="s" x="214" y="136">asks, and reads</text><text class="s" x="214" y="152">the report</text><rect class="box h" x="204" y="184" width="156" height="64" rx="3"/><text class="t" x="214" y="206">Storage adapter</text><text class="s" x="214" y="224">on its own</text><text class="s" x="214" y="240">database</text><rect class="box h" x="204" y="272" width="156" height="64" rx="3"/><text class="t" x="214" y="294">Trace sink</text><text class="s" x="214" y="312">optional; on its</text><text class="s" x="214" y="328">OTel pipeline</text><rect class="box h" x="204" y="360" width="156" height="64" rx="3"/><text class="t" x="214" y="382">Model adapter</text><text class="s" x="214" y="400">on its own SDK</text><text class="s" x="214" y="416">client</text><rect class="box h" x="204" y="448" width="156" height="64" rx="3"/><text class="t" x="214" y="470">Code under test</text><text class="s" x="214" y="488">its production</text><text class="s" x="214" y="504">code, via a kind</text><rect class="box t" x="398" y="88" width="136" height="424" rx="3"/><text class="t" x="408" y="112">Engine</text><text class="p" x="408" y="133">catalogue</text><text class="s" x="408" y="166">runs every case</text><text class="s" x="408" y="182">and judges it</text><text class="p" x="408" y="221">storage port</text><text class="p" x="408" y="309">trace port</text><text class="p" x="408" y="397">model ports</text><text class="p" x="408" y="485">kind seam</text><rect class="box t" x="576" y="116" width="212" height="52" rx="3"/><text class="t" x="586" y="138">Analyst (model)</text><text class="s" x="586" y="156">writes the report</text><rect class="box t" x="576" y="196" width="212" height="52" rx="3"/><text class="t" x="586" y="218">Checks (code)</text><text class="s" x="586" y="236">validate each draft</text><rect class="box t" x="576" y="276" width="212" height="52" rx="3"/><text class="t" x="586" y="298">Editor (model)</text><text class="s" x="586" y="316">reviews the page</text><rect class="box t" x="576" y="356" width="212" height="52" rx="3"/><text class="t" x="586" y="378">Stored report</text><text class="s" x="586" y="396">read through the UI</text><rect class="box d" x="568" y="576" width="220" height="76" rx="3"/><text class="t" x="578" y="598">Coding agent</text><text class="s" x="578" y="616">in the 3tears repo turns</text><text class="s" x="578" y="632">an approved gap into</text><text class="s" x="578" y="648">a change</text><rect class="box d" x="316" y="576" width="200" height="76" rx="3"/><text class="t" x="326" y="598">Release or pin</text><text class="s" x="326" y="616">a 3tears release, or</text><text class="s" x="326" y="632">a pinnable commit</text><text class="lbl" x="760" y="188" text-anchor="end">bounce</text><text class="lbl" x="648" y="188" text-anchor="start">draft</text><text class="lbl" x="648" y="268" text-anchor="start">clean</text><text class="lbl" x="572" y="268" text-anchor="start">revise</text><text class="lbl" x="648" y="348" text-anchor="start">passes</text><text class="lbl" x="800" y="564" text-anchor="end">capability gap</text><text class="lbl" x="274" y="644" text-anchor="end">the host moves its pin</text></svg>
